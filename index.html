<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подбор блюд</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f0e8;
            color: #333;
            padding: 20px;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #5d4037; font-size: 2.2rem; }
        .theme-toggle {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            background: linear-gradient(135deg, #333, #555); color: white;
            border: none; border-radius: 50%; width: 50px; height: 50px;
            font-size: 1.5rem; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center; padding: 0;
            transition: all 0.3s;
        }
        .filter-panel {
            background: white; border-radius: 16px; padding: 20px;
            max-width: 900px; margin: 0 auto 30px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            transition: background 0.3s;
        }
        .filter-group { margin-bottom: 15px; }
        .group-label { font-weight: 600; margin-bottom: 6px; color: #5d4037; display: block; font-size: 0.9rem; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        button {
            padding: 10px 18px; border: none; border-radius: 25px;
            font-weight: 600; font-size: 0.9rem; cursor: pointer;
            transition: all 0.25s; background: #e0e0e0; color: #424242;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); white-space: nowrap;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        #kolBtn { background: linear-gradient(135deg, #ff9800, #f57c00); color: white; }
        .cost-btn { background: linear-gradient(135deg, #4caf50, #388e3c); color: white; }
        .cost-btn.active { background: linear-gradient(135deg, #2e7d32, #1b5e20); box-shadow: 0 0 8px #2e7d32; }
        .time-btn { background: linear-gradient(135deg, #2196f3, #1976d2); color: white; }
        .time-btn.active { background: linear-gradient(135deg, #0d47a1, #0a3d8f); box-shadow: 0 0 8px #0d47a1; }
        .sut-btn { background: linear-gradient(135deg, #9c27b0, #7b1fa2); color: white; }
        .sut-btn.active { background: linear-gradient(135deg, #4a148c, #3a0f70); box-shadow: 0 0 8px #4a148c; }
        #pskBtn { background: linear-gradient(135deg, #e53935, #c62828); color: white; padding: 12px 30px; font-size: 1rem; }
        .reset-btn { background: #bdbdbd; color: #333; margin-left: 10px; }
        .kalori-badge {
            background: #ff9800; color: white; padding: 4px 12px;
            border-radius: 12px; font-size: 0.85rem; font-weight: 600;
            display: inline-block; margin-left: 8px;
        }
        .reset-single {
            cursor: pointer; color: #999; margin-left: 6px;
            font-size: 0.8rem; vertical-align: middle; transition: color 0.2s;
        }
        .reset-single:hover { color: #e53935; }
        #kaloriMinInput, #kaloriMaxInput {
            padding: 10px 14px; border-radius: 25px; border: 1px solid #ccc;
            width: 100px; font-size: 0.9rem; margin-right: 8px;
        }
        #result { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .results-counter {
            text-align: center; margin-bottom: 15px; font-weight: 600;
            color: #5d4037; background: white; padding: 10px; border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .dish-card {
            background: white; border-radius: 16px; padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
            border-left: 6px solid #ff9800;
            animation: fadeInUp 0.4s ease-out;
        }
        .dish-card h3 { margin-bottom: 8px; color: #5d4037; font-size: 1.4rem; }
        .badge {
            display: inline-block; background: #f0f0f0; border-radius: 12px;
            padding: 2px 10px; margin-right: 8px; font-size: 0.85rem; color: #555;
        }
        .no-results { text-align: center; padding: 30px; background: white; border-radius: 16px; color: #888; font-size: 1.1rem; }
        /* тёмная тема */
        body.dark { background: #1a1a2e; color: #e0e0e0; }
        body.dark h1 { color: #ffcc80; }
        body.dark .filter-panel { background: #16213e; }
        body.dark .group-label { color: #ffcc80; }
        body.dark .dish-card { background: #16213e; }
        body.dark .dish-card h3 { color: #ffcc80; }
        body.dark .badge { background: #0f3460; color: #ccc; }
        body.dark .no-results { background: #16213e; color: #aaa; }
        body.dark .results-counter { background: #16213e; color: #ffcc80; }
        body.dark #kaloriMinInput, body.dark #kaloriMaxInput {
            background: #2a2a3c; color: #eee; border-color: #555;
        }
        body.dark #kaloriMinInput::placeholder, body.dark #kaloriMaxInput::placeholder { color: #aaa; }
        #loadMoreBtn {
            display: block; margin: 20px auto; padding: 12px 30px;
            border-radius: 25px; background: linear-gradient(135deg, #4caf50, #388e3c);
            color: white; border: none; cursor: pointer; font-size: 1rem; font-weight: 600;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" title="Тема">🌙</button>
    <h1>🍽️ Подбор блюд</h1>
    <div class="filter-panel">
        <div class="filter-group">
            <span class="group-label">🔥 Калорийность <span class="reset-single" onclick="resetKalori()">✕</span></span>
            <div class="btn-group">
                <input type="number" id="kaloriMinInput" placeholder="Мин. ккал">
                <input type="number" id="kaloriMaxInput" placeholder="Макс. ккал">
                <button id="kolBtn" onclick="applyKalori()">Применить</button>
                <span id="kaloriDisplay"></span>
            </div>
        </div>
        <div class="filter-group">
            <span class="group-label">💰 Цена <span class="reset-single" onclick="resetCost()">✕</span></span>
            <div class="btn-group">
                <button class="cost-btn" id="cheapBtn" onclick="costCheap()">Дёшево</button>
                <button class="cost-btn" id="mediumBtn" onclick="costMedium()">Средне</button>
                <button class="cost-btn" id="expensiveBtn" onclick="costExpensive()">Дорого</button>
            </div>
        </div>
        <div class="filter-group">
            <span class="group-label">⏱️ Время <span class="reset-single" onclick="resetTime()">✕</span></span>
            <div class="btn-group">
                <button class="time-btn" id="bstBtn" onclick="gotofnost1()">Быстрое</button>
                <button class="time-btn" id="medBtn" onclick="gotofnost2()">Среднее</button>
                <button class="time-btn" id="sloBtn" onclick="gotofnost3()">Медленное</button>
            </div>
        </div>
        <div class="filter-group">
            <span class="group-label">🍲 Сытность <span class="reset-single" onclick="resetSytnost()">✕</span></span>
            <div class="btn-group">
                <button class="sut-btn" id="sutBtn" onclick="sutnost1()">Сытное</button>
                <button class="sut-btn" id="legBtn" onclick="sutnost2()">Лёгкое</button>
            </div>
        </div>
        <div class="filter-group">
            <div class="btn-group">
                <button id="pskBtn" onclick="poisk()">🔍 Найти блюдо</button>
                <button id="randomBtn" onclick="randomDish()">🎲 Случайное блюдо</button>
                <button class="reset-btn" onclick="resetFilters()">🔄 Сбросить всё</button>
            </div>
        </div>
    </div>
    <div id="result"></div>

    <script>
        // ========== ТЕМА (системные настройки + localStorage) ==========
        function applyTheme(mode) {
            if (mode === 'dark') {
                document.body.classList.add('dark');
                const btn = document.querySelector('.theme-toggle');
                if (btn) { btn.textContent = '☀️'; btn.title = 'Светлая тема'; }
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark');
                const btn = document.querySelector('.theme-toggle');
                if (btn) { btn.textContent = '🌙'; btn.title = 'Тёмная тема'; }
                localStorage.setItem('theme', 'light');
            }
        }
        (function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || saved === 'light') {
                applyTheme(saved);
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(prefersDark ? 'dark' : 'light');
            }
        })();
        function toggleTheme() {
            applyTheme(document.body.classList.contains('dark') ? 'light' : 'dark');
        }

        // ========== ФИЛЬТРЫ ==========
        let minKal = 0, maxKal = 0, cost = 0, gotofnost = 0, sutnost = 0;
        let currentPage = 0, pageSize = 10, currentFiltered = [];

        function clearActiveGroup(sel) {
            document.querySelectorAll(sel).forEach(b => b.classList.remove('active'));
        }
        function updateKaloriDisplay() {
            const span = document.getElementById('kaloriDisplay');
            let text = '';
            if (minKal > 0 && maxKal > 0) text = `От ${minKal} до ${maxKal} ккал`;
            else if (maxKal > 0) text = `До ${maxKal} ккал`;
            else if (minKal > 0) text = `От ${minKal} ккал`;
            span.className = text ? 'kalori-badge' : '';
            span.textContent = text;
        }
        function applyKalori() {
            const minI = document.getElementById('kaloriMinInput');
            const maxI = document.getElementById('kaloriMaxInput');
            minKal = Number(minI.value) || 0;
            maxKal = Number(maxI.value) || 0;
            updateKaloriDisplay();
        }
        function resetKalori() {
            minKal = maxKal = 0;
            document.getElementById('kaloriMinInput').value = '';
            document.getElementById('kaloriMaxInput').value = '';
            updateKaloriDisplay();
        }

        function costCheap() { cost=1; clearActiveGroup('.cost-btn'); document.getElementById('cheapBtn').classList.add('active'); }
        function costMedium() { cost=2; clearActiveGroup('.cost-btn'); document.getElementById('mediumBtn').classList.add('active'); }
        function costExpensive() { cost=3; clearActiveGroup('.cost-btn'); document.getElementById('expensiveBtn').classList.add('active'); }
        function resetCost() { cost=0; clearActiveGroup('.cost-btn'); }

        function gotofnost1() { gotofnost=1; clearActiveGroup('.time-btn'); document.getElementById('bstBtn').classList.add('active'); }
        function gotofnost2() { gotofnost=2; clearActiveGroup('.time-btn'); document.getElementById('medBtn').classList.add('active'); }
        function gotofnost3() { gotofnost=3; clearActiveGroup('.time-btn'); document.getElementById('sloBtn').classList.add('active'); }
        function resetTime() { gotofnost=0; clearActiveGroup('.time-btn'); }

        function sutnost1() { sutnost=1; clearActiveGroup('.sut-btn'); document.getElementById('sutBtn').classList.add('active'); }
        function sutnost2() { sutnost=2; clearActiveGroup('.sut-btn'); document.getElementById('legBtn').classList.add('active'); }
        function resetSytnost() { sutnost=0; clearActiveGroup('.sut-btn'); }

        function resetFilters() {
            minKal = maxKal = cost = gotofnost = sutnost = 0;
            document.getElementById('kaloriMinInput').value = '';
            document.getElementById('kaloriMaxInput').value = '';
            updateKaloriDisplay();
            clearActiveGroup('.cost-btn'); clearActiveGroup('.time-btn'); clearActiveGroup('.sut-btn');
            document.getElementById('result').innerHTML = '';
        }

        // ========== ЗАГРУЗКА БЛЮД ==========
let dishes = [
 
    {"name":"Овощной бульон","calories":50,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"морковь 100 г, лук 80 г, вода 500 мл, соль","recipe":"1. Морковь (1 шт.) и лук (1 шт.) очистить, крупно нарезать.\n2. Залить 500 мл воды, довести до кипения.\n3. Варить на слабом огне 20 минут.\n4. Процедить через мелкое сито или марлю.\n5. Бульон готов, можно использовать как основу.","bju":"Б:1,Ж:0,У:10"},
    {"name":"Огуречный салат с укропом","calories":25,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"огурец 150 г, укроп 5 г, лимонный сок 5 мл, соль","recipe":"1. Огурец вымыть и нарезать тонкими кружками.\n2. Укроп мелко порубить.\n3. Смешать огурец с укропом, добавить лимонный сок и щепотку соли.\n4. Аккуратно перемешать и сразу подавать.","bju":"Б:1,Ж:0,У:5"},
    {"name":"Салат из свежей капусты с лимоном","calories":40,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"белокочанная капуста 150 г, лимонный сок 10 мл, зелень 5 г, соль","recipe":"1. Капусту тонко нашинковать.\n2. Посолить и хорошо размять руками 1–2 минуты, чтобы пустила сок.\n3. Добавить лимонный сок и рубленую зелень.\n4. Перемешать и подавать.","bju":"Б:2,Ж:0,У:8"},
    {"name":"Быстрый томатный суп","calories":45,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"томаты в собственном соку 200 г, вода 100 мл, чеснок 1 зубчик, зелень 5 г, соль","recipe":"1. Томаты вместе с соком разомять вилкой или пробить блендером.\n2. Перелить в кастрюлю, добавить воду и измельчённый чеснок.\n3. Довести до кипения и варить 5 минут.\n4. Посолить, посыпать зеленью.","bju":"Б:2,Ж:0,У:9"},
    {"name":"Омлет из белков со шпинатом","calories":55,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"яичные белки 3 шт. (100 г), шпинат 30 г, соль, перец","recipe":"1. Белки слегка взбить вилкой с солью и перцем.\n2. Шпинат грубо порубить.\n3. Разогреть антипригарную сковороду без масла, выложить шпинат на 1 минуту.\n4. Залить белками, накрыть крышкой и готовить на слабом огне 3–4 минуты.","bju":"Б:12,Ж:0,У:2"},
    {"name":"Морковно-яблочный салат","calories":58,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"морковь 100 г, яблоко 50 г, лимонный сок 5 мл","recipe":"1. Морковь очистить и натереть на средней тёрке.\n2. Яблоко натереть так же, сразу сбрызнуть лимонным соком, чтобы не потемнело.\n3. Смешать и подавать сразу.","bju":"Б:1,Ж:0,У:13"},
    
    {"name":"Творожная масса с зеленью","calories":70,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"обезжиренный творог 80 г, кефир 0% 20 мл, укроп 5 г, зелёный лук 5 г, соль","recipe":"1. Творог размять вилкой с кефиром до кремовой массы.\n2. Зелень мелко порубить.\n3. Смешать творог с зеленью, посолить по вкусу.\n4. Подавать сразу или охладить 10 минут.","bju":"Б:14,Ж:0,У:3"},
    {"name":"Белковый омлет с кабачком","calories":70,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"яичные белки 3 шт. (100 г), кабачок 100 г, соль, перец","recipe":"1. Кабачок натереть на крупной тёрке и слегка отжать.\n2. Разогреть антипригарную сковороду, тушить кабачок 2 минуты.\n3. Залить взбитыми с солью белками.\n4. Накрыть крышкой, готовить 4 минуты на слабом огне.","bju":"Б:12,Ж:0,У:5"},
    {"name":"Яичная капля","calories":82,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"куриный бульон 250 мл, яйцо 1 шт., зелень 5 г, соль","recipe":"1. Довести бульон до кипения.\n2. Яйцо взбить вилкой с щепоткой соли.\n3. Тонкой струйкой влить яйцо в кипящий бульон, помешивая в одну сторону.\n4. Через 1 минуту снять с огня, посыпать зеленью.","bju":"Б:8,Ж:5,У:1"},
    {"name":"Тунец с огурцом","calories":70,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"тунец консервированный в собственном соку 50 г, огурец 100 г, лимонный сок 5 мл, зелень 5 г","recipe":"1. Из банки слить жидкость, тунец размять вилкой.\n2. Огурец нарезать кубиками.\n3. Смешать тунец, огурец и зелень.\n4. Сбрызнуть лимонным соком, перемешать.","bju":"Б:12,Ж:1,У:3"},
    {"name":"Кефир с отрубями и ягодами","calories":85,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"кефир 0% 150 мл, пшеничные отруби 10 г, замороженные ягоды 40 г","recipe":"1. Отруби залить кипятком на 3 минуты, слить воду.\n2. Смешать кефир с набухшими отрубями.\n3. Добавить ягоды, перемешать.\n4. Подавать сразу.","bju":"Б:6,Ж:1,У:13"},
    {"name":"Салат из фасоли с огурцом","calories":60,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"консервированная белая фасоль 60 г, огурец 100 г, лук красный 10 г, лимонный сок 5 мл, зелень 5 г","recipe":"1. Фасоль промыть от заливки и обсушить.\n2. Огурец нарезать кубиками, лук мелко порубить.\n3. Смешать всё с зеленью.\n4. Заправить лимонным соком, посолить.","bju":"Б:4,Ж:0,У:11"},
    
    {"name":"Запечённая свёкла","calories":62,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"свёкла 150 г, лимонный сок 5 мл, соль, укроп 3 г","recipe":"1. Свёклу тщательно вымыть, не обрезая хвостик.\n2. Завернуть в фольгу.\n3. Запекать при 200 °C 60 минут до мягкости.\n4. Остудить, очистить и нарезать ломтиками.\n5. Сбрызнуть лимонным соком, посолить, посыпать укропом.","bju":"Б:2,Ж:0,У:13"},
    {"name":"Квашеная капуста домашняя","calories":28,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"капуста 100 г, морковь 10 г, соль 2 г","recipe":"1. Капусту тонко нашинковать, морковь натереть.\n2. Посолить и хорошо размять руками до выделения сока.\n3. Плотно утрамбовать в банку, сок должен покрывать капусту.\n4. Оставить при комнатной температуре на 3 дня, ежедневно прокалывая до дна палочкой.\n5. Убрать в холодильник, порция — 100 г.","bju":"Б:1,Ж:0,У:5"},
    {"name":"Маринованная морковь","calories":52,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"морковь 150 г, чеснок 1 зубчик, уксус 6% 10 мл, вода 30 мл, кориандр, соль, перец","recipe":"1. Морковь натереть на корейской тёрке, добавить измельчённый чеснок.\n2. Смешать уксус, воду, соль, кориандр и перец, довести до кипения.\n3. Горячим маринадом залить морковь и перемешать.\n4. Накрыть и мариновать в холодильнике минимум 3 часа.","bju":"Б:1,Ж:0,У:11"},
    {"name":"Запечённый кабачок с чесноком","calories":55,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"кабачок 250 г, чеснок 2 зубчика, зелень 5 г, соль, перец","recipe":"1. Кабачок нарезать кружками толщиной 1 см.\n2. Выложить на пергамент, посолить и поперчить.\n3. Сверху распределить тонко нарезанный чеснок.\n4. Запекать при 180 °C 50 минут, перевернув на 25-й минуте.\n5. Посыпать зеленью.","bju":"Б:2,Ж:0,У:12"},
    {"name":"Тыквенный суп-пюре на воде","calories":65,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"тыква 200 г, лук 30 г, вода 300 мл, соль, мускатный орех","recipe":"1. Тыкву очистить и нарезать кубиками, лук мелко порезать.\n2. Залить водой и варить на малом огне 45 минут до полной мягкости.\n3. Измельчить блендером до пюре.\n4. Посолить, добавить щепотку мускатного ореха, прогреть 2 минуты.","bju":"Б:2,Ж:0,У:13"},
    {"name":"Яблоко, запечённое с корицей","calories":72,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"яблоко 150 г, корица 1 г","recipe":"1. Яблоко вымыть, вырезать сердцевину, не прорезая дно.\n2. Внутрь насыпать корицу.\n3. Выложить на противень, влить 2 ст. л. воды.\n4. Запекать при 180 °C 45 минут до мягкости.\n5. Подавать тёплым.","bju":"Б:0,Ж:0,У:18"},
    
    {"name":"Чечевичный суп на воде","calories":78,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"красная чечевица сухая 15 г, морковь 50 г, лук 30 г, вода 300 мл, куркума, соль","recipe":"1. Чечевицу промыть, овощи мелко нарезать.\n2. Залить водой, довести до кипения.\n3. Варить на слабом огне 45–50 минут, пока чечевица не разварится.\n4. Добавить куркуму и соль, взбить блендером для густоты.","bju":"Б:4,Ж:0,У:15"},
    {"name":"Постный куриный студень","calories":75,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"куриное филе 60 г, желатин 5 г, вода 150 мл, морковь 20 г, чеснок 1 зубчик, лавровый лист, соль","recipe":"1. Филе сварить с лавровым листом и морковью 30 минут, мясо мелко порезать.\n2. Желатин замочить в 50 мл холодной воды на 10 минут.\n3. Горячий процеженный бульон (100 мл) смешать с набухшим желатином до растворения.\n4. Мясо и чеснок разложить по формочке, залить бульоном.\n5. Охладить в холодильнике минимум 6 часов.","bju":"Б:16,Ж:1,У:0"},
    {"name":"Тушёная капуста с морковью","calories":73,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"капуста 200 г, морковь 40 г, томатная паста 10 г, вода 50 мл, соль, перец","recipe":"1. Капусту нашинковать, морковь натереть.\n2. Выложить в сотейник с водой, накрыть крышкой.\n3. Тушить на слабом огне 30 минут.\n4. Добавить томатную пасту, соль, перец и тушить ещё 30 минут до мягкости.","bju":"Б:3,Ж:0,У:15"},
    {"name":"Фасолевая похлёбка","calories":83,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"сухая фасоль 20 г, морковь 30 г, лук 20 г, вода 300 мл, лавровый лист, соль","recipe":"1. Фасоль замочить в воде на ночь, слить воду.\n2. Залить свежей водой, варить 60 минут до мягкости.\n3. Добавить нарезанные морковь и лук, лавровый лист.\n4. Варить ещё 20 минут, посолить.","bju":"Б:5,Ж:0,У:15"},
    {"name":"Перловка на воде с луком","calories":85,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"перловая крупа 25 г, лук 20 г, вода 150 мл, соль, зелень 3 г","recipe":"1. Перловку промыть и замочить на 3 часа.\n2. Слить воду, залить свежей (150 мл), довести до кипения.\n3. Варить на малом огне 50 минут до мягкости.\n4. Лук мелко нарезать и притушить в 2 ст. л. воды 5 минут, добавить в кашу.\n5. Посолить, посыпать зеленью.","bju":"Б:3,Ж:0,У:18"},
    {"name":"Запечённый нут с паприкой","calories":80,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"сухой нут 25 г (≈50 г варёного), паприка 2 г, чеснок гранулированный 1 г, соль","recipe":"1. Нут замочить на ночь, сварить 60 минут до мягкости.\n2. Слить воду, обсушить полотенцем.\n3. Смешать с паприкой, чесноком и солью.\n4. Запекать при 200 °C 25 минут, встряхивая один раз.","bju":"Б:4,Ж:1,У:13"},
    
    {"name":"Суп с цветной капустой","calories":62,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"цветная капуста 100 г, морковь 30 г, картофель 30 г, вода 300 мл, зелень 3 г, соль","recipe":"1. Картофель нарезать кубиками и отварить 8 минут.\n2. Добавить морковь кружками и соцветия капусты.\n3. Варить 15 минут до готовности овощей.\n4. Посолить, посыпать зеленью.","bju":"Б:3,Ж:0,У:12"},
    {"name":"Постные щи из свежей капусты","calories":70,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"капуста 100 г, морковь 30 г, лук 20 г, картофель 30 г, вода 300 мл, лавровый лист, соль","recipe":"1. Картофель нарезать кубиками, опустить в кипящую воду на 7 минут.\n2. Добавить нашинкованную капусту и варить 10 минут.\n3. Положить тёртую морковь и нарезанный лук, лавровый лист.\n4. Варить ещё 10 минут, посолить.","bju":"Б:2,Ж:0,У:15"},
    {"name":"Кабачки, тушёные с томатом","calories":56,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"кабачок 200 г, помидор 80 г, чеснок 1 зубчик, вода 30 мл, зелень 3 г, соль","recipe":"1. Кабачок нарезать кубиками, помидор — дольками.\n2. Выложить в сотейник, добавить воду.\n3. Тушить под крышкой 20 минут на слабом огне.\n4. Добавить чеснок, соль, зелень, прогреть 2 минуты.","bju":"Б:2,Ж:0,У:12"},
    {"name":"Морковное пюре","calories":65,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"морковь 200 г, вода для варки, соль, мускатный орех","recipe":"1. Морковь очистить и нарезать кружками.\n2. Варить в подсоленной воде 20 минут до мягкости.\n3. Слить воду, оставив 3 ст. л.\n4. Пробить блендером до пюре, добавить щепотку мускатного ореха.","bju":"Б:2,Ж:0,У:14"},
    {"name":"Томатный суп-пюре","calories":60,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"помидоры 250 г, лук 30 г, чеснок 1 зубчик, вода 100 мл, базилик сушёный 1 г, соль","recipe":"1. Помидоры надрезать крестом, залить кипятком на 1 минуту, снять кожицу.\n2. Лук и помидоры нарезать, тушить с водой 15 минут.\n3. Добавить чеснок и базилик.\n4. Пробить блендером, посолить и прогреть 3 минуты.","bju":"Б:3,Ж:0,У:12"},
    {"name":"Запечённый баклажан с чесноком","calories":50,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"баклажан 200 г, чеснок 1 зубчик, лимонный сок 5 мл, зелень 3 г, соль","recipe":"1. Баклажан разрезать вдоль пополам, сделать надрезы сеточкой.\n2. Посолить, оставить на 10 минут, промокнуть.\n3. Запекать при 200 °C 25 минут срезом вверх.\n4. Посыпать чесноком и зеленью, сбрызнуть лимонным соком.","bju":"Б:2,Ж:0,У:10"},
    
    {"name":"Яйцо, фаршированное творогом","calories":95,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"яйцо 1 шт., творог обезжиренный 20 г, зелёный лук 5 г, соль","recipe":"1. Яйцо сварить вкрутую (10 минут), остудить в холодной воде.\n2. Очистить, разрезать пополам, вынуть желток.\n3. Желток растереть с творогом, зелёным луком и солью.\n4. Начинить половинки белка полученной массой.","bju":"Б:9,Ж:6,У:1"},
    {"name":"Куриный суп с зеленью","calories":72,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"куриное филе 50 г, морковь 30 г, лук 20 г, вода 300 мл, зелень 5 г, лавровый лист, соль","recipe":"1. Филе залить холодной водой, довести до кипения, снять пену.\n2. Варить 15 минут, добавить морковь и лук.\n3. Варить ещё 10 минут, филе достать и нарезать.\n4. Вернуть мясо в суп, добавить лавровый лист, соль и зелень.","bju":"Б:11,Ж:1,У:4"},
    {"name":"Уха из минтая","calories":90,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"филе минтая 80 г, картофель 30 г, морковь 20 г, лук 15 г, вода 300 мл, лавровый лист, соль","recipe":"1. Картофель нарезать кубиками, варить в кипящей воде 8 минут.\n2. Добавить морковь и лук, варить 5 минут.\n3. Положить кусочки минтая и лавровый лист.\n4. Варить 8 минут, посолить.","bju":"Б:13,Ж:1,У:7"},
    {"name":"Паровая куриная котлета","calories":85,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"куриная грудка 70 г, лук 10 г, яичный белок 1 шт., соль, перец","recipe":"1. Грудку и лук пропустить через мясорубку.\n2. Добавить белок, соль и перец, хорошо вымесить.\n3. Сформировать котлету влажными руками.\n4. Готовить на пару 20 минут.","bju":"Б:18,Ж:1,У:2"},
    {"name":"Стручковая фасоль с яйцом","calories":80,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"стручковая фасоль 150 г, яйцо 1/2 шт., чеснок 1 зубчик, соль","recipe":"1. Фасоль (свежую или замороженную) отварить 7 минут.\n2. Яйцо взбить с солью.\n3. Фасоль выложить на антипригарную сковороду с чесноком, прогреть 2 минуты.\n4. Влить яйцо, помешивая, готовить 3 минуты.","bju":"Б:7,Ж:3,У:6"},
    {"name":"Лёгкий гороховый суп-пюре","calories":80,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"колотый горох 20 г, морковь 30 г, лук 15 г, вода 300 мл, соль","recipe":"1. Горох промыть, залить водой, довести до кипения.\n2. Варить 25 минут на слабом огне.\n3. Добавить нарезанные морковь и лук, варить 12 минут.\n4. Взбить блендером до пюре, посолить.","bju":"Б:5,Ж:0,У:14"},
    
    {"name":"Салат с авокадо и огурцом","calories":75,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"авокадо 30 г, огурец 100 г, помидор 80 г, лимонный сок 5 мл, соль","recipe":"1. Огурец и помидор нарезать кубиками.\n2. Авокадо очистить и нарезать кубиками, сбрызнуть лимонным соком.\n3. Аккуратно смешать, посолить.","bju":"Б:1,Ж:5,У:6"},
    {"name":"Рукола с черри и бальзамиком","calories":82,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"рукола 50 г, помидоры черри 100 г, бальзамический уксус 5 мл, оливковое масло 5 г, соль","recipe":"1. Руколу вымыть и обсушить.\n2. Черри разрезать пополам.\n3. Смешать масло с бальзамиком и солью.\n4. Заправить салат, перемешать и подавать.","bju":"Б:2,Ж:5,У:7"},
    {"name":"Томатный салат с моцареллой","calories":82,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"помидор 150 г, моцарелла 20 г, базилик 3 г, соль, перец","recipe":"1. Помидор нарезать кружками.\n2. Моцареллу нарезать тонкими ломтиками.\n3. Выложить чередуя, посыпать рваным базиликом.\n4. Посолить и поперчить.","bju":"Б:5,Ж:4,У:6"},
    {"name":"Салат из стручковой фасоли с миндалём","calories":60,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"стручковая фасоль 100 г, миндаль 5 г, лимонный сок 5 мл, соль","recipe":"1. Фасоль отварить 5 минут в кипящей подсоленной воде, остудить в ледяной воде.\n2. Миндаль обжарить на сухой сковороде 2 минуты и порубить.\n3. Смешать фасоль с миндалём, добавить лимонный сок.","bju":"Б:3,Ж:3,У:4"},
    {"name":"Салат со шпинатом и грейпфрутом","calories":65,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"шпинат 50 г, грейпфрут 100 г, кедровые орехи 3 г, соль","recipe":"1. Грейпфрут очистить от плёнок и нарезать дольками.\n2. Шпинат вымыть и выложить на тарелку.\n3. Сверху разложить грейпфрут, посыпать орехами.\n4. Сок, оставшийся после нарезки, использовать как заправку.","bju":"Б:2,Ж:2,У:9"},
    {"name":"Салат из сельдерея и яблока","calories":65,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"стебель сельдерея 100 г, яблоко 80 г, греческий йогурт 20 г, лимонный сок 5 мл","recipe":"1. Сельдерей нарезать тонкими полукольцами.\n2. Яблоко нарезать соломкой, сбрызнуть лимонным соком.\n3. Смешать с йогуртом и подавать.","bju":"Б:2,Ж:1,У:13"},
    
    {"name":"Отварные креветки с лимоном","calories":75,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"очищенные креветки 80 г, лимон 1 долька, лавровый лист, соль","recipe":"1. В кипящую подсоленную воду с лавровым листом опустить креветки.\n2. Варить 3 минуты (замороженные — 5), слить воду.\n3. Подавать с долькой лимона.","bju":"Б:16,Ж:1,У:0"},
    {"name":"Куриное филе на пару с брокколи","calories":93,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"куриное филе 60 г, брокколи 80 г, соль, перец","recipe":"1. Филе нарезать тонкими пластинами, посолить и поперчить.\n2. Брокколи разобрать на соцветия.\n3. Выложить в пароварку и готовить 12 минут.","bju":"Б:17,Ж:1,У:4"},
    {"name":"Салат с тунцом и яйцом","calories":87,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"тунец в собственном соку 40 г, яйцо варёное 1/2 шт., салатные листья 50 г, лимонный сок 5 мл","recipe":"1. Листья салата порвать руками.\n2. Яйцо нарезать дольками, тунец размять вилкой.\n3. Всё смешать, сбрызнуть лимонным соком.","bju":"Б:13,Ж:3,У:2"},
    {"name":"Творог с огурцом и редисом","calories":88,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"творог 0–1% 100 г, редис 50 г, огурец 50 г, зелёный лук 5 г, соль","recipe":"1. Редис и огурец нарезать мелкими кубиками.\n2. Лук порубить.\n3. Смешать с творогом и солью до однородности.","bju":"Б:16,Ж:1,У:4"},
    {"name":"Омлет с индейкой","calories":80,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"яичные белки 2 шт., фарш из индейки 40 г, зелень 3 г, соль, перец","recipe":"1. Фарш обжарить на антипригарной сковороде 3 минуты.\n2. Белки взбить с солью и перцем.\n3. Влить в сковороду, готовить под крышкой 4 минуты.\n4. Посыпать зеленью.","bju":"Б:14,Ж:2,У:1"},
    {"name":"Рулетики из огурца с лососем","calories":88,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"огурец 100 г, слабосолёный лосось 30 г, творожный сыр лайт 10 г, укроп 2 г","recipe":"1. Огурец нарезать лентами овощечисткой.\n2. На ленту намазать творожный сыр, положить тонкий ломтик лосося.\n3. Свернуть рулетиком, закрепить шпажкой.\n4. Украсить укропом.","bju":"Б:8,Ж:5,У:3"},
    
    {"name":"Запечённые томаты с травами","calories":75,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"помидоры 250 г, оливковое масло 3 г, чеснок 2 зубчика, тимьян 1 г, соль","recipe":"1. Помидоры разрезать пополам, выложить срезом вверх.\n2. Посыпать чесноком, тимьяном и солью, капнуть маслом.\n3. Запекать при 160 °C 60 минут до карамелизации краёв.","bju":"Б:2,Ж:3,У:8"},
    {"name":"Суп-пюре из брокколи","calories":80,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"брокколи 150 г, лук 30 г, сливки 10% 20 мл, овощной бульон 250 мл, соль","recipe":"1. Лук нарезать, тушить в 2 ст. л. бульона 5 минут.\n2. Добавить брокколи и остальной бульон.\n3. Варить на слабом огне 45 минут (томление для глубокого вкуса).\n4. Измельчить блендером, влить сливки, прогреть.","bju":"Б:5,Ж:2,У:9"},
    {"name":"Лёгкий рататуй","calories":95,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"кабачок 70 г, баклажан 70 г, перец 60 г, помидоры 100 г, оливковое масло 3 г, чеснок 1 зубчик, тимьян, соль","recipe":"1. Все овощи нарезать кружками и кубиками.\n2. Помидоры измельчить, смешать с чесноком, маслом и тимьяном, выложить на дно формы.\n3. Сверху выложить овощи кружками по спирали.\n4. Накрыть фольгой, запекать при 180 °C 60 минут.","bju":"Б:3,Ж:3,У:13"},
    {"name":"Фаршированный запечённый перец (овощной)","calories":70,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"болгарский перец 200 г, оливковое масло 2 г, чеснок 1 зубчик, зелень 3 г, соль","recipe":"1. Перец запекать целиком при 220 °C 45 минут, переворачивая.\n2. Горячим переложить в пакет на 10 минут.\n3. Снять кожицу, удалить семена.\n4. Заправить маслом, чесноком и зеленью.","bju":"Б:2,Ж:2,У:10"},
    {"name":"Холодный свекольник на кефире","calories":72,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"свёкла 80 г, кефир 0% 100 мл, огурец 50 г, укроп 5 г, соль","recipe":"1. Свёклу сварить 45 минут, остудить и натереть.\n2. Огурец нарезать кубиками, укроп порубить.\n3. Смешать всё с кефиром и солью.\n4. Охладить в холодильнике 1 час.","bju":"Б:4,Ж:1,У:12"},
    {"name":"Запечённая баклажанная икра","calories":80,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"баклажан 200 г, помидор 30 г, лук 20 г, оливковое масло 2 г, чеснок 1 зубчик, соль","recipe":"1. Баклажан запекать целиком при 200 °C 45 минут до мягкости.\n2. Очистить от кожицы, мякоть мелко порубить.\n3. Лук и помидор нарезать, притушить 5 минут.\n4. Смешать всё с маслом, чесноком и солью.","bju":"Б:2,Ж:2,У:11"},
    
    {"name":"Заливное из судака","calories":88,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"филе судака 100 г, желатин 5 г, морковь 20 г, лимон 1 долька, лавровый лист, соль, вода 150 мл","recipe":"1. Рыбу сварить с лавровым листом и морковью 15 минут, остудить.\n2. Желатин замочить в 50 мл холодной воды на 10 минут.\n3. Горячий процеженный бульон (100 мл) смешать с желатином.\n4. Рыбу и морковь выложить в форму, добавить дольку лимона и залить бульоном.\n5. Охладить минимум 6 часов.","bju":"Б:19,Ж:1,У:0"},
    {"name":"Маринованная запечённая куриная грудка","calories":88,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"куриная грудка 80 г, лимонный сок 10 мл, чеснок 1 зубчик, паприка 2 г, соль","recipe":"1. Грудку смешать с лимонным соком, чесноком, паприкой и солью.\n2. Мариновать в холодильнике 3 часа.\n3. Запекать в фольге при 190 °C 25 минут.\n4. Дать отдохнуть 5 минут, нарезать.","bju":"Б:18,Ж:1,У:1"},
    {"name":"Прозрачный говяжий бульон с мясом","calories":70,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"говядина постная 40 г, морковь 20 г, лук 15 г, вода 350 мл, лавровый лист, соль","recipe":"1. Мясо залить холодной водой, довести до кипения, снять пену.\n2. Добавить целые морковь и лук.\n3. Варить на минимальном огне 2 часа, не давая бурлить.\n4. Процедить, мясо нарезать, посолить.","bju":"Б:11,Ж:2,У:2"},
    {"name":"Тушёная индейка с кабачком","calories":94,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"филе индейки 60 г, кабачок 100 г, лук 15 г, вода 50 мл, соль, перец","recipe":"1. Индейку нарезать кубиками, залить водой, тушить под крышкой 40 минут.\n2. Добавить нарезанные кабачок и лук.\n3. Тушить ещё 20 минут, посолить и поперчить.","bju":"Б:17,Ж:1,У:4"},
    {"name":"Хек, запечённый в фольге","calories":98,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"филе хека 100 г, помидор 30 г, лук 20 г, лимонный сок 5 мл, зелень, соль","recipe":"1. Рыбу посолить, сбрызнуть лимонным соком, оставить мариноваться на 30 минут.\n2. На кусок фольги выложить лук и помидор кружками, сверху рыбу.\n3. Плотно завернуть и запекать при 200 °C 25 минут.\n4. Посыпать зеленью.","bju":"Б:17,Ж:2,У:3"},
    {"name":"Тушёный кролик в томате","calories":88,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"мясо кролика 40 г, помидор 60 г, лук 10 г, вода 50 мл, лавровый лист, соль","recipe":"1. Кролика нарезать порционными кусочками.\n2. Выложить в сотейник с водой и тушить 40 минут.\n3. Добавить натёртый помидор, лук, лавровый лист.\n4. Тушить ещё 30 минут до мягкости, посолить.","bju":"Б:9,Ж:4,У:4"},
    
    {"name":"Суп из шпината с яйцом","calories":60,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"овощной бульон 250 мл, шпинат 80 г, яйцо 1/2 шт., соль, мускатный орех","recipe":"1. Бульон довести до кипения, добавить шпинат на 5 минут.\n2. Взбить блендером до гладкости.\n3. Яйцо взбить с щепоткой соли, тонкой струйкой влить в суп.\n4. Добавить мускатный орех и прогреть 2 минуты.","bju":"Б:5,Ж:3,У:3"},
    {"name":"Лёгкий мисо-суп","calories":60,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"мисо-паста 15 г, тофу 40 г, водоросли вакамэ 2 г, зелёный лук 5 г, вода 250 мл","recipe":"1. Воду нагреть до 80 °C, не кипятить.\n2. Вакамэ замочить на 5 минут.\n3. Мисо развести в небольшом количестве воды и влить в кастрюлю.\n4. Добавить кубики тофу и водоросли, прогреть 5 минут.\n5. Посыпать луком.","bju":"Б:4,Ж:2,У:5"},
    {"name":"Спаржа на пару с лимоном","calories":45,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"зелёная спаржа 200 г, лимон 1 долька, соль, перец","recipe":"1. У спаржи обломить жёсткие концы.\n2. Выложить в пароварку, готовить 8–10 минут.\n3. Посолить, поперчить, сбрызнуть лимоном.","bju":"Б:4,Ж:0,У:7"},
    {"name":"Цукини-лапша с томатным соусом","calories":66,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"цукини 200 г, помидоры 100 г, чеснок 1 зубчик, базилик 3 г, соль","recipe":"1. Цукини нарезать спиралью или тонкой соломкой.\n2. Помидоры натереть, тушить с чесноком 10 минут до соуса.\n3. Добавить цукини, прогреть 3 минуты.\n4. Посыпать базиликом.","bju":"Б:3,Ж:0,У:13"},
    {"name":"Грибной суп из шампиньонов","calories":70,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"шампиньоны 150 г, лук 30 г, картофель 30 г, вода 300 мл, зелень, соль","recipe":"1. Грибы нарезать пластинами, лук — кубиками.\n2. Картофель нарезать кубиками, варить 8 минут.\n3. Добавить лук и грибы, варить 15 минут.\n4. Посолить, посыпать зеленью.","bju":"Б:4,Ж:1,У:11"},
    {"name":"Овощи-гриль","calories":77,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"кабачок 70 г, перец 60 г, баклажан 70 г, оливковое масло 3 г, соль, травы","recipe":"1. Овощи нарезать толстыми ломтями.\n2. Слегка смазать маслом, посолить.\n3. Жарить на сухой сковороде-гриль по 4–5 минут с каждой стороны.\n4. Посыпать травами.","bju":"Б:2,Ж:3,У:10"},
    
    {"name":"Куриный суп с вермишелью","calories":92,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"куриное филе 40 г, тонкая вермишель 10 г, морковь 20 г, лук 15 г, вода 300 мл, зелень, соль","recipe":"1. Филе сварить 15 минут, достать и нарезать.\n2. В бульон добавить морковь и лук, варить 8 минут.\n3. Всыпать вермишель, варить 3 минуты.\n4. Вернуть мясо, посолить, посыпать зеленью.","bju":"Б:8,Ж:1,У:13"},
    {"name":"Паровые рыбные тефтели из трески","calories":70,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"филе трески 80 г, яичный белок 1/2 шт., лук 10 г, укроп 2 г, соль","recipe":"1. Треску и лук пропустить через мясорубку.\n2. Добавить белок, укроп, соль, вымесить.\n3. Сформировать шарики, готовить на пару 15 минут.","bju":"Б:14,Ж:1,У:2"},
    {"name":"Омлет с грибами","calories":82,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"яичные белки 2 шт., яйцо 1/2 шт., шампиньоны 50 г, зелень, соль","recipe":"1. Грибы нарезать, обжарить на сухой сковороде 5 минут.\n2. Белки и яйцо взбить с солью.\n3. Залить грибы, накрыть крышкой и готовить 5 минут.\n4. Посыпать зеленью.","bju":"Б:10,Ж:4,У:2"},
    {"name":"Куриные рулетики со шпинатом","calories":84,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"куриное филе 70 г, шпинат 30 г, чеснок 1 зубчик, соль, перец","recipe":"1. Филе разрезать вдоль, раскрыть и отбить.\n2. Посолить, поперчить, выложить шпинат с чесноком.\n3. Свернуть рулетом, закрепить нитью или шпажкой.\n4. Готовить на пару 25 минут.","bju":"Б:18,Ж:1,У:1"},
    {"name":"Тушёная красная фасоль с томатом","calories":70,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"красная фасоль консервированная 60 г, помидор 80 г, лук 15 г, чеснок 1 зубчик, зелень, соль","recipe":"1. Лук нарезать, тушить с водой 3 минуты.\n2. Добавить натёртый помидор, тушить 10 минут.\n3. Положить фасоль и чеснок, прогреть 8 минут.\n4. Посолить, посыпать зеленью.","bju":"Б:5,Ж:0,У:13"},
    {"name":"Суп с индейкой и овощами","calories":86,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"филе индейки 50 г, морковь 30 г, цветная капуста 50 г, вода 300 мл, зелень, соль","recipe":"1. Индейку залить водой, варить 20 минут, нарезать.\n2. В бульон добавить овощи, варить 12 минут.\n3. Вернуть мясо, посолить, посыпать зеленью.","bju":"Б:12,Ж:2,У:5"},
    
    {"name":"Устрицы с лимоном","calories":35,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"устрицы 3 шт. (60 г), лимон 1 долька, красный винный уксус 5 мл","recipe":"1. Устрицы вскрыть специальным ножом, отделить мякоть.\n2. Выложить на колотый лёд.\n3. Подавать с лимоном или уксусом.","bju":"Б:4,Ж:1,У:2"},
    {"name":"Карпаччо из гребешка с лаймом","calories":75,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"морской гребешок 60 г, лайм 1/2 шт., оливковое масло 3 г, морская соль, розовый перец","recipe":"1. Гребешок на 15 минут положить в морозилку, чтобы легче резать.\n2. Нарезать тончайшими пластинами.\n3. Выложить на тарелку, сбрызнуть лаймом и маслом.\n4. Посыпать солью и перцем.","bju":"Б:11,Ж:3,У:1"},
    {"name":"Тартар из тунца","calories":70,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"свежий тунец 50 г, авокадо 15 г, соевый соус 3 мл, лайм 1/4 шт., кунжут 1 г","recipe":"1. Тунец и авокадо нарезать мелкими кубиками.\n2. Смешать с соевым соусом и соком лайма.\n3. Выложить формой, посыпать кунжутом.","bju":"Б:12,Ж:2,У:1"},
    {"name":"Канапе с красной икрой","calories":42,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"красная икра 10 г, огурец 100 г, укроп 2 г","recipe":"1. Огурец нарезать толстыми кружками, мякоть из центра слегка выбрать.\n2. Выложить в ямку икру.\n3. Украсить веточкой укропа.","bju":"Б:3,Ж:2,У:3"},
    {"name":"Крабовое мясо с грейпфрутом","calories":78,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"мясо краба 60 г, грейпфрут 80 г, салат 20 г, лимонный сок 3 мл","recipe":"1. Грейпфрут очистить от плёнок.\n2. Краба разобрать на волокна.\n3. Выложить на листья салата, добавить дольки грейпфрута.\n4. Сбрызнуть лимонным соком.","bju":"Б:11,Ж:1,У:6"},
    {"name":"Салат с тигровыми креветками и рукколой","calories":68,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"тигровые креветки 60 г, рукола 40 г, лимонный сок 5 мл, соль, перец","recipe":"1. Креветки отварить 4 минуты в подсоленной воде, остудить.\n2. Руколу выложить на тарелку.\n3. Сверху креветки, сбрызнуть лимонным соком.\n4. Поперчить.","bju":"Б:12,Ж:1,У:2"},
    
    {"name":"Гребешки на антипригарной сковороде","calories":88,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"морской гребешок 100 г, лимон 1 долька, соль, перец","recipe":"1. Гребешки обсушить бумажным полотенцем, посолить и поперчить.\n2. Разогреть антипригарную сковороду без масла до сильного нагрева.\n3. Жарить по 1,5 минуты с каждой стороны до золотистой корочки.\n4. Подавать с лимоном.","bju":"Б:17,Ж:1,У:3"},
    {"name":"Стейк из тунца (сэр)","calories":77,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"свежий тунец 70 г, соль, чёрный перец, лимон","recipe":"1. Тунца обсушить, посолить и обвалять в перце.\n2. Раскалить сухую антипригарную сковороду.\n3. Обжарить по 1 минуте с каждой стороны, середина остаётся розовой.\n4. Нарезать и сбрызнуть лимоном.","bju":"Б:17,Ж:1,У:0"},
    {"name":"Тигровые креветки на гриле","calories":85,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"тигровые креветки 90 г, чеснок 1 зубчик, лимон, паприка 1 г, соль","recipe":"1. Креветки очистить, посолить, посыпать паприкой и чесноком.\n2. Нагреть сковороду-гриль.\n3. Жарить по 2 минуты с каждой стороны.\n4. Подавать с лимоном.","bju":"Б:19,Ж:1,У:0"},
    {"name":"Омлет с крабом","calories":70,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"яичные белки 2 шт., мясо краба 40 г, зелёный лук 3 г, соль","recipe":"1. Краба разобрать на волокна.\n2. Белки взбить с солью.\n3. Выложить краба на сковороду, залить белками.\n4. Готовить под крышкой 4 минуты, посыпать луком.","bju":"Б:14,Ж:1,У:1"},
    {"name":"Тонкий стейк из говяжьей вырезки","calories":82,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"говяжья вырезка 50 г, соль, перец, розмарин","recipe":"1. Вырезку нарезать тонким медальоном (1,5 см), отбить.\n2. Посолить, поперчить, добавить розмарин.\n3. Жарить на сухой раскалённой сковороде по 1,5 минуты с каждой стороны.\n4. Дать отдохнуть 2 минуты.","bju":"Б:11,Ж:4,У:0"},
    {"name":"Форель на пару","calories":84,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"филе форели 60 г, лимон 1 долька, укроп 2 г, соль","recipe":"1. Филе посолить, сбрызнуть лимоном.\n2. Выложить в пароварку.\n3. Готовить 12 минут.\n4. Посыпать укропом.","bju":"Б:12,Ж:4,У:0"},
    
    {"name":"Отварной артишок с лимоном","calories":55,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"артишок 1 шт. (120 г), лимон 1/2 шт., соль","recipe":"1. Артишок промыть, обрезать верхушку и жёсткие кончики листьев.\n2. Варить в подсоленной воде с лимоном 45–50 минут до мягкой мякоти.\n3. Подавать, обмакивая листья в лимонный сок.","bju":"Б:3,Ж:0,У:10"},
    {"name":"Грибной консоме с трюфельным маслом","calories":40,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"сушёные белые грибы 10 г, лук 20 г, морковь 20 г, вода 400 мл, трюфельное масло 1 г, соль","recipe":"1. Грибы промыть, залить водой, довести до кипения.\n2. Добавить лук и морковь, томить 2 часа на минимальном огне.\n3. Тщательно процедить через марлю.\n4. Подать горячим, капнуть трюфельным маслом.","bju":"Б:3,Ж:1,У:4"},
    {"name":"Севиче из морского окуня","calories":75,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"филе морского окуня 80 г, лайм 1 шт., огурец 30 г, красный лук 10 г, кинза 3 г, соль","recipe":"1. Рыбу нарезать небольшими кубиками.\n2. Залить соком лайма, посолить.\n3. Убрать в холодильник на 1,5–2 часа.\n4. Добавить мелко нарезанные огурец, лук и кинзу.","bju":"Б:12,Ж:2,У:2"},
    {"name":"Томлёная спаржа с белыми грибами","calories":70,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"белая спаржа 100 г, белые грибы 100 г, оливковое масло 2 г, тимьян, соль","recipe":"1. Спаржу очистить от жёсткой кожицы, грибы нарезать.\n2. Сложить в сотейник с 50 мл воды и тимьяном.\n3. Тушить на минимальном огне 50 минут под крышкой.\n4. Заправить маслом, посолить.","bju":"Б:5,Ж:2,У:6"},
    {"name":"Желе из малины и черники","calories":60,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"малина 50 г, черника 30 г, желатин 3 г, вода 100 мл, заменитель сахара по вкусу","recipe":"1. Желатин замочить в 30 мл холодной воды на 10 минут.\n2. Ягоды довести до кипения с оставшейся водой, процедить.\n3. Горячий сок смешать с желатином до растворения.\n4. Разлить по формам и охладить минимум 4 часа.","bju":"Б:2,Ж:0,У:12"},
    {"name":"Рыбный консоме из морского окуня","calories":38,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"голова и кости морского окуня 150 г, морковь 20 г, сельдерей 20 г, лимон, вода 500 мл, соль","recipe":"1. Рыбные кости залить холодной водой, довести до кипения и снять пену.\n2. Добавить морковь, сельдерей, томить 2 часа.\n3. Процедить дважды через марлю.\n4. Подать с долькой лимона.","bju":"Б:6,Ж:1,У:1"},
    
    {"name":"Вырезка су-вид","calories":90,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"говяжья вырезка 60 г, соль, перец, тимьян","recipe":"1. Мясо посолить, поперчить, добавить тимьян, запаять в вакуумный пакет.\n2. Готовить в водяной бане при 56 °C 2 часа.\n3. Достать, обсушить, быстро обжарить на сухой сковороде 30 секунд с каждой стороны.","bju":"Б:13,Ж:4,У:0"},
    {"name":"Запечённая утиная грудка без кожи","calories":75,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"утиная грудка без кожи 60 г, апельсиновый сок 10 мл, розмарин, соль","recipe":"1. Мясо замариновать с апельсиновым соком и розмарином на 3 часа.\n2. Запекать в фольге при 180 °C 35 минут.\n3. Дать отдохнуть 5 минут и нарезать.","bju":"Б:14,Ж:2,У:0"},
    {"name":"Томлёная телятина","calories":65,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"телячья вырезка 70 г, морковь 20 г, лук 15 г, вода 100 мл, лавровый лист, соль","recipe":"1. Мясо нарезать крупными кусками.\n2. Выложить в сотейник с водой, овощами и лавровым листом.\n3. Тушить на минимальном огне 90 минут.\n4. Посолить и подавать.","bju":"Б:14,Ж:1,У:0"},
    {"name":"Томлёный осьминог","calories":82,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"осьминог 100 г, лимон 1/2 шт., лавровый лист, чёрный перец горошком, соль","recipe":"1. Осьминога промыть, опустить в кипяток с лавровым листом и перцем.\n2. Варить на слабом огне 60 минут до мягкости.\n3. Остудить в бульоне, нарезать кружками.\n4. Подавать с лимонным соком.","bju":"Б:16,Ж:1,У:2"},
    {"name":"Заливное из лосося","calories":85,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"филе лосося 40 г, желатин 5 г, лимон 1 долька, укроп 2 г, вода 150 мл, соль","recipe":"1. Лосося сварить 10 минут, остудить и нарезать.\n2. Желатин замочить в 50 мл воды на 10 минут.\n3. Бульон (100 мл) смешать с желатином.\n4. Рыбу выложить в форму с лимоном и укропом, залить.\n5. Охладить минимум 6 часов.","bju":"Б:10,Ж:5,У:0"},
    {"name":"Запечённая перепёлка без кожи","calories":80,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"мясо перепёлки 60 г, чеснок 1 зубчик, тимьян, лимонный сок 5 мл, соль","recipe":"1. Мясо натереть чесноком, тимьяном, лимонным соком и солью.\n2. Мариновать 3 часа в холодильнике.\n3. Запекать в рукаве при 190 °C 35 минут.","bju":"Б:13,Ж:3,У:0"},
    
    {"name":"Тартар из лосося с авокадо","calories":86,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"лосось слабосолёный 30 г, авокадо 15 г, огурец 30 г, лайм 1/4 шт., укроп 2 г","recipe":"1. Лосось и авокадо нарезать мелкими кубиками.\n2. Огурец нарезать так же.\n3. Смешать с соком лайма и укропом.\n4. Выложить кольцом на тарелку и охладить 15 минут.","bju":"Б:7,Ж:6,У:1"},
    {"name":"Суп из белых грибов","calories":58,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"свежие белые грибы 150 г, картофель 20 г, лук 15 г, вода 300 мл, укроп, соль","recipe":"1. Грибы нарезать, залить водой, варить 15 минут.\n2. Добавить картофель и лук.\n3. Варить ещё 12 минут.\n4. Посолить, посыпать укропом.","bju":"Б:4,Ж:1,У:8"},
    {"name":"Паровые гребешки с имбирём","calories":55,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"морской гребешок 60 г, имбирь 3 г, зелёный лук 3 г, соевый соус 2 мл","recipe":"1. Гребешки выложить на тарелку, сверху тонкие пластины имбиря.\n2. Готовить на пару 6–8 минут.\n3. Полить соевым соусом, посыпать луком.","bju":"Б:11,Ж:0,У:2"},
    {"name":"Салат с крабом и авокадо","calories":75,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"мясо краба 40 г, авокадо 20 г, огурец 60 г, лимонный сок 5 мл","recipe":"1. Краба разобрать на волокна.\n2. Авокадо и огурец нарезать кубиками.\n3. Смешать, добавить лимонный сок.\n4. Охладить 10 минут.","bju":"Б:7,Ж:4,У:3"},
    {"name":"Запечённые устрицы с лимоном и травами","calories":40,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"устрицы 3 шт. (60 г), лимон 1/4 шт., петрушка 2 г, чеснок 1/2 зубчика","recipe":"1. Устрицы вскрыть, оставить в створке.\n2. Посыпать петрушкой и чесноком.\n3. Запекать при 220 °C 6–8 минут.\n4. Подавать с лимоном.","bju":"Б:5,Ж:1,У:3"},
    {"name":"Шиитаке со спаржей","calories":65,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"зелёная спаржа 150 г, шиитаке 80 г, соевый соус 3 мл, имбирь 2 г, кунжут 1 г","recipe":"1. Спаржу нарезать на 3–4 части, грибы — ломтиками.\n2. В раскалённую антипригарную сковороду выложить грибы, обжарить 5 минут.\n3. Добавить спаржу и имбирь, жарить 4 минуты.\n4. Полить соевым соусом, посыпать кунжутом.","bju":"Б:5,Ж:1,У:9"},
    
    {"name":"Тигровые креветки в томатно-чесночном соусе","calories":86,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"тигровые креветки 80 г, помидор 50 г, чеснок 1 зубчик, базилик 2 г, соль","recipe":"1. Помидор натереть, тушить с чесноком 8 минут до соуса.\n2. Добавить очищенные креветки.\n3. Тушить под крышкой 5 минут.\n4. Посыпать базиликом.","bju":"Б:16,Ж:1,У:3"},
    {"name":"Тунец с кунжутом","calories":90,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"свежий тунец 70 г, кунжут 2 г, соевый соус 3 мл, имбирь 2 г","recipe":"1. Тунца замариновать в соевом соусе с имбирём на 15 минут.\n2. Обвалять в кунжуте.\n3. Обжарить на раскалённой сухой сковороде по 1 минуте с каждой стороны.\n4. Нарезать ломтиками.","bju":"Б:17,Ж:2,У:1"},
    {"name":"Филе утки без кожи на гриле","calories":85,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"утиное филе без кожи 60 г, апельсиновый сок 10 мл, розмарин, соль","recipe":"1. Мясо замариновать с апельсиновым соком и розмарином на 20 минут.\n2. Обжаривать на сковороде-гриль по 5 минут с каждой стороны.\n3. Дать отдохнуть 3 минуты и нарезать.","bju":"Б:14,Ж:3,У:0"},
    {"name":"Говяжий тартар из вырезки","calories":90,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"говяжья вырезка 60 г, каперсы 5 г, лук красный 10 г, горчица 3 г, перепелиный желток 1 шт.","recipe":"1. Вырезку очень мелко нарубить ножом.\n2. Смешать с рубленым луком, каперсами и горчицей.\n3. Выложить кольцом, сверху желток.\n4. Подавать сразу.","bju":"Б:12,Ж:5,У:0"},
    {"name":"Гребешок со шпинатом","calories":80,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"морской гребешок 80 г, шпинат 50 г, чеснок 1 зубчик, соль","recipe":"1. Гребешки обсушить, посолить.\n2. Шпинат тушить на сковороде с чесноком 2 минуты, выложить.\n3. Гребешки обжарить на сухой сковороде по 2 минуты с каждой стороны.\n4. Подавать на шпинате.","bju":"Б:16,Ж:1,У:2"},
    {"name":"Мидии на пару с зеленью","calories":92,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"мидии в раковинах 120 г (мякоть), чеснок 1 зубчик, петрушка 3 г, лимон 1 долька, вода 50 мл","recipe":"1. Мидии промыть, удалить «бородки», выбросить открытые.\n2. Положить в кастрюлю с водой и чесноком.\n3. Варить под крышкой 5–7 минут до раскрытия створок.\n4. Выбросить нераскрывшиеся, посыпать петрушкой, подать с лимоном.","bju":"Б:14,Ж:2,У:4"},

    {"name":"Овощной салат с растительным маслом","calories":125,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"огурец 150 г, помидор 150 г, лук 20 г, подсолнечное масло 8 г, соль","recipe":"1. Огурец и помидор нарезать дольками, лук — тонкими полукольцами.\n2. Смешать в миске.\n3. Заправить маслом, посолить и сразу подавать.","bju":"Б:2,Ж:8,У:11"},
    {"name":"Банан с кефиром","calories":150,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"банан 100 г, кефир 1% 150 мл","recipe":"1. Банан очистить и нарезать кружками.\n2. Залить кефиром.\n3. Слегка размять вилкой или взбить блендером и подавать.","bju":"Б:6,Ж:2,У:27"},
    {"name":"Яблоко с творогом","calories":170,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"яблоко 150 г, творог 5% 80 г, корица 1 г","recipe":"1. Яблоко нарезать тонкими дольками.\n2. Творог выложить в пиалу, сверху разложить яблоко.\n3. Посыпать корицей.","bju":"Б:14,Ж:4,У:20"},
    {"name":"Бутерброд с творогом и огурцом","calories":135,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"цельнозерновой хлеб 25 г, творог 50 г, огурец 40 г, укроп 3 г, соль","recipe":"1. Творог смешать с рубленым укропом и щепоткой соли.\n2. Намазать на хлеб.\n3. Сверху выложить кружки огурца.","bju":"Б:9,Ж:3,У:19"},
    {"name":"Овсянка быстрого приготовления на воде","calories":110,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"овсяные хлопья быстрого приготовления 30 г, вода 120 мл, корица 1 г, соль","recipe":"1. Хлопья залить кипятком (120 мл), добавить щепотку соли.\n2. Накрыть крышкой на 3 минуты.\n3. Перемешать, посыпать корицей.","bju":"Б:4,Ж:2,У:20"},
    {"name":"Салат из капусты с яблоком","calories":115,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"капуста 120 г, яблоко 80 г, подсолнечное масло 5 г, лимонный сок 5 мл, соль","recipe":"1. Капусту тонко нашинковать, посолить и размять руками.\n2. Яблоко натереть на крупной тёрке.\n3. Смешать, добавить масло и лимонный сок.","bju":"Б:2,Ж:5,У:14"},
    
    {"name":"Яичница из двух яиц с помидором","calories":160,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"яйца 2 шт., помидор 20 г, соль, зелень 3 г","recipe":"1. Помидор мелко нарезать.\n2. Разогреть антипригарную сковороду, выложить помидор на 1 минуту.\n3. Разбить яйца, посолить, готовить под крышкой 3–4 минуты.\n4. Посыпать зеленью.","bju":"Б:13,Ж:11,У:2"},
    {"name":"Бутерброд с тунцом","calories":125,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"цельнозерновой хлеб 25 г, тунец в собственном соку 50 г, огурец 40 г, зелень 3 г","recipe":"1. Тунец размять вилкой.\n2. Выложить на хлеб.\n3. Сверху огурец кружками и зелень.","bju":"Б:13,Ж:2,У:14"},
    {"name":"Творог с бананом","calories":165,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"творог 5% 100 г, банан 50 г","recipe":"1. Банан нарезать кружками.\n2. Смешать с творогом.\n3. При желании слегка размять вилкой.","bju":"Б:17,Ж:5,У:12"},
    {"name":"Яйцо-пашот на тосте","calories":130,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"яйцо 1 шт., цельнозерновой хлеб 25 г, уксус 5 мл, соль","recipe":"1. Хлеб подсушить в тостере или на сухой сковороде.\n2. В кипящую воду с уксусом сделать воронку, влить яйцо.\n3. Варить 3 минуты, достать шумовкой.\n4. Выложить на хлеб, посолить.","bju":"Б:8,Ж:5,У:14"},
    {"name":"Гречка с кефиром","calories":140,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"готовая гречка 80 г, кефир 1% 100 мл, зелень 3 г, соль","recipe":"1. Разогреть готовую гречку 1 минуту в микроволновке.\n2. Залить кефиром.\n3. Посолить, посыпать зеленью.","bju":"Б:6,Ж:2,У:24"},
    {"name":"Хлебцы с творогом и зеленью","calories":160,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"хлебцы 2 шт. (20 г), творог 5% 100 г, укроп 3 г, огурец 30 г, соль","recipe":"1. Творог смешать с рубленым укропом и солью.\n2. Выложить на хлебцы.\n3. Украсить огурцом.","bju":"Б:16,Ж:5,У:14"},
    
    {"name":"Запечённая тыква с мёдом","calories":120,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"тыква 350 г, мёд 8 г, корица 1 г","recipe":"1. Тыкву очистить, нарезать крупными дольками.\n2. Выложить на пергамент, посыпать корицей.\n3. Запекать при 190 °C 50 минут до мягкости.\n4. Полить мёдом.","bju":"Б:3,Ж:0,У:27"},
    {"name":"Постный борщ","calories":140,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"свёкла 60 г, капуста 60 г, картофель 60 г, морковь 30 г, лук 20 г, томатная паста 10 г, подсолнечное масло 3 г, вода 350 мл, соль","recipe":"1. Свёклу, морковь и лук нарезать, потушить с маслом и томатной пастой 10 минут.\n2. В кипящую воду положить картофель, через 10 минут капусту.\n3. Добавить зажарку, варить 40 минут на слабом огне.\n4. Посолить, дать настояться 15 минут.","bju":"Б:3,Ж:3,У:25"},
    {"name":"Овощное рагу","calories":155,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"картофель 100 г, кабачок 100 г, морковь 50 г, помидор 50 г, подсолнечное масло 3 г, вода 50 мл, соль","recipe":"1. Все овощи нарезать кубиками.\n2. Сначала тушить картофель и морковь с водой и маслом 20 минут.\n3. Добавить кабачок и помидор.\n4. Тушить под крышкой ещё 35 минут, посолить.","bju":"Б:4,Ж:3,У:27"},
    {"name":"Запечённая груша с мёдом","calories":115,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"груша 200 г, мёд 10 г, корица 1 г","recipe":"1. Грушу разрезать пополам, удалить сердцевину.\n2. Выложить срезом вверх, в углубление положить мёд и корицу.\n3. Запекать при 180 °C 50 минут.","bju":"Б:1,Ж:0,У:27"},
    {"name":"Суп-пюре из чечевицы с овощами","calories":130,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"красная чечевица 30 г, морковь 50 г, лук 30 г, вода 350 мл, куркума 1 г, соль","recipe":"1. Чечевицу промыть, овощи нарезать.\n2. Залить водой, варить на слабом огне 50 минут.\n3. Добавить куркуму и соль.\n4. Взбить блендером до пюре.","bju":"Б:8,Ж:1,У:22"},
    {"name":"Овощной суп с перловкой","calories":120,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"перловка 20 г, картофель 50 г, морковь 30 г, лук 20 г, вода 350 мл, зелень, соль","recipe":"1. Перловку замочить на 2 часа, слить воду.\n2. Залить свежей водой, варить 40 минут.\n3. Добавить картофель, морковь и лук, варить 20 минут.\n4. Посолить, посыпать зеленью.","bju":"Б:3,Ж:1,У:25"},
    
    {"name":"Гороховый суп","calories":170,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"колотый горох 40 г, картофель 50 г, морковь 30 г, лук 20 г, вода 400 мл, лавровый лист, соль","recipe":"1. Горох замочить на 2 часа, слить воду.\n2. Варить 50 минут до мягкости.\n3. Добавить картофель, морковь, лук, лавровый лист.\n4. Варить 25 минут, посолить.","bju":"Б:10,Ж:1,У:30"},
    {"name":"Фасоль, тушёная в томате","calories":155,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"сухая фасоль 40 г, томатная паста 15 г, лук 30 г, чеснок 1 зубчик, лавровый лист, соль","recipe":"1. Фасоль замочить на ночь, сварить 60 минут до мягкости.\n2. Лук потушить 5 минут с небольшим количеством воды.\n3. Добавить томатную пасту, чеснок и фасоль с 100 мл отвара.\n4. Тушить 20 минут, посолить.","bju":"Б:8,Ж:1,У:27"},
    {"name":"Пшённая каша с тыквой","calories":128,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"пшено 30 г, тыква 100 г, вода 200 мл, соль","recipe":"1. Пшено промыть кипятком.\n2. Тыкву нарезать кубиками, залить водой и варить 15 минут.\n3. Добавить пшено и варить 30 минут на слабом огне.\n4. Накрыть и настоять 15 минут.","bju":"Б:4,Ж:1,У:25"},
    {"name":"Тушёные куриные желудки с овощами","calories":145,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"куриные желудки 100 г, лук 20 г, морковь 20 г, вода 100 мл, лавровый лист, соль","recipe":"1. Желудки промыть, удалить плёнки.\n2. Залить водой, варить 30 минут.\n3. Добавить лук, морковь, лавровый лист.\n4. Тушить под крышкой ещё 30 минут до мягкости.","bju":"Б:21,Ж:6,У:3"},
    {"name":"Тушёные куриные сердечки","calories":135,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"куриные сердечки 80 г, лук 20 г, морковь 20 г, вода 80 мл, соль, лавровый лист","recipe":"1. Сердечки промыть, удалить жир и сгустки.\n2. Залить водой, довести до кипения, слить воду.\n3. Налить свежую воду, добавить овощи и лавровый лист.\n4. Тушить 45 минут, посолить.","bju":"Б:13,Ж:8,У:3"},
    {"name":"Печень в сметане","calories":170,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"куриная печень 100 г, лук 20 г, сметана 10% 20 г, вода 50 мл, соль","recipe":"1. Печень замочить в молоке или воде на 30 минут, промыть.\n2. Лук нарезать, потушить 5 минут.\n3. Добавить печень и воду, тушить 10 минут.\n4. Влить сметану, тушить ещё 10 минут, посолить.","bju":"Б:20,Ж:8,У:5"},
    
    {"name":"Овощной суп с вермишелью","calories":110,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"вермишель 15 г, картофель 50 г, морковь 30 г, лук 15 г, вода 350 мл, зелень, соль","recipe":"1. Картофель нарезать кубиками, варить 10 минут.\n2. Добавить морковь и лук, варить 8 минут.\n3. Всыпать вермишель, варить 4 минуты.\n4. Посолить, посыпать зеленью.","bju":"Б:3,Ж:1,У:22"},
    {"name":"Рисовый суп с овощами","calories":130,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"рис 20 г, картофель 40 г, морковь 30 г, подсолнечное масло 3 г, вода 350 мл, зелень, соль","recipe":"1. Рис промыть, залить кипящей водой.\n2. Через 10 минут добавить картофель и морковь.\n3. Варить 15 минут, влить масло.\n4. Посолить, посыпать зеленью.","bju":"Б:3,Ж:3,У:22"},
    {"name":"Отварной картофель с укропом","calories":138,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"картофель 150 г, сливочное масло 3 г, укроп 5 г, соль","recipe":"1. Картофель очистить, нарезать крупными кусками.\n2. Варить в подсоленной воде 20 минут.\n3. Слить воду, добавить масло и рубленый укроп.","bju":"Б:3,Ж:3,У:25"},
    {"name":"Винегрет","calories":117,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"свёкла 60 г, картофель 40 г, морковь 30 г, солёный огурец 30 г, подсолнечное масло 5 г, лук 10 г","recipe":"1. Свёклу, картофель и морковь отварить, остудить и нарезать кубиками (заранее).\n2. Огурец и лук мелко нарезать.\n3. Смешать, заправить маслом.","bju":"Б:2,Ж:5,У:16"},
    {"name":"Овсяная каша на молоке","calories":150,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"овсяные хлопья 30 г, молоко 1,5% 100 мл, вода 80 мл, соль","recipe":"1. Смешать молоко и воду, довести до кипения.\n2. Всыпать хлопья, посолить.\n3. Варить 12 минут на слабом огне, помешивая.","bju":"Б:6,Ж:3,У:25"},
    {"name":"Кабачковые оладьи","calories":150,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"кабачок 150 г, мука 20 г, яйцо 1/2 шт., подсолнечное масло 2 г, соль","recipe":"1. Кабачок натереть, посолить, отжать лишний сок.\n2. Смешать с яйцом и мукой.\n3. Жарить столовой ложкой на слегка смазанной сковороде по 3 минуты с каждой стороны.","bju":"Б:5,Ж:5,У:20"},
    
    {"name":"Куриная грудка с гречкой","calories":140,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"куриная грудка 60 г, готовая гречка 60 г, соль, перец","recipe":"1. Грудку нарезать кусочками, посолить и поперчить.\n2. Обжарить на антипригарной сковороде 8 минут.\n3. Подавать с гречкой.","bju":"Б:17,Ж:2,У:14"},
    {"name":"Куриная котлета с картофелем","calories":146,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"фарш куриный 70 г, картофель 60 г, лук 10 г, соль","recipe":"1. Фарш смешать с луком и солью, сформировать котлету.\n2. Готовить на пару или в духовке при 200 °C 20 минут.\n3. Картофель отварить 15 минут, подавать вместе.","bju":"Б:16,Ж:4,У:11"},
    {"name":"Запечённая котлета из минтая","calories":110,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"филе минтая 100 г, манка 8 г, лук 10 г, соль","recipe":"1. Рыбу и лук пропустить через мясорубку.\n2. Добавить манку и соль, дать постоять 10 минут.\n3. Сформировать котлеты, запекать при 190 °C 20 минут.","bju":"Б:15,Ж:2,У:8"},
    {"name":"Омлет с картофелем","calories":135,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"яйцо 1 шт., картофель 60 г, молоко 30 мл, соль","recipe":"1. Картофель отварить и нарезать кубиками.\n2. Яйцо взбить с молоком и солью.\n3. Картофель выложить на сковороду, залить яйцом.\n4. Готовить под крышкой 6 минут.","bju":"Б:8,Ж:6,У:13"},
    {"name":"Куриные тефтели в томатном соусе","calories":145,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"куриное филе (фарш) 80 г, рис варёный 20 г, томатная паста 15 г, лук 10 г, вода 80 мл, соль","recipe":"1. Фарш смешать с рисом, луком и солью, скатать шарики.\n2. Томатную пасту развести водой.\n3. Выложить тефтели в соус и тушить под крышкой 20 минут.","bju":"Б:17,Ж:4,У:10"},
    {"name":"Ленивые голубцы","calories":142,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"капуста 100 г, фарш куриный 60 г, рис 8 г (сухой), томатная паста 10 г, вода 80 мл, соль","recipe":"1. Капусту мелко порубить, ошпарить кипятком.\n2. Смешать с фаршем, рисом и солью, сформировать котлетки.\n3. Выложить в сотейник, залить томатной пастой с водой.\n4. Тушить под крышкой 30 минут.","bju":"Б:12,Ж:5,У:12"},
    
    {"name":"Салат «Цезарь» лайт","calories":118,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"куриная грудка варёная 50 г, салат ромэн 50 г, пармезан 10 г, греческий йогурт 20 г, чеснок, лимонный сок","recipe":"1. Заправку сделать из йогурта, чеснока и лимонного сока.\n2. Салат порвать, грудку нарезать, пармезан натереть.\n3. Смешать с заправкой.","bju":"Б:12,Ж:6,У:4"},
    {"name":"Салат с фасолью и кукурузой","calories":145,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"консервированная фасоль 50 г, кукуруза 40 г, помидор 100 г, оливковое масло 5 г, зелень","recipe":"1. Фасоль и кукурузу промыть, обсушить.\n2. Помидор нарезать кубиками.\n3. Смешать, заправить маслом.","bju":"Б:5,Ж:5,У:19"},
    {"name":"Греческий салат","calories":135,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"помидор 100 г, огурец 100 г, фета 30 г, оливки 15 г, красный лук 10 г, орегано","recipe":"1. Овощи нарезать крупными кусочками.\n2. Добавить оливки и кубики феты.\n3. Посыпать орегано.","bju":"Б:5,Ж:10,У:7"},
    {"name":"Салат с горошком и яйцом","calories":122,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"зелёный горошек 50 г, яйцо варёное 1 шт., огурец 100 г, греческий йогурт 30 г, зелень","recipe":"1. Яйцо и огурец нарезать кубиками.\n2. Смешать с горошком.\n3. Заправить йогуртом и зеленью.","bju":"Б:9,Ж:6,У:8"},
    {"name":"Салат с грушей, рукколой и орехом","calories":135,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"груша 100 г, рукола 40 г, грецкий орех 8 г, пармезан 8 г, бальзамический уксус 5 мл","recipe":"1. Грушу нарезать тонкими дольками.\n2. Руколу выложить на тарелку, сверху грушу.\n3. Посыпать орехами и стружкой пармезана, сбрызнуть уксусом.","bju":"Б:4,Ж:8,У:12"},
    {"name":"Сэндвич с авокадо","calories":150,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"цельнозерновой хлеб 30 г, авокадо 50 г, помидор 30 г, лимонный сок, соль","recipe":"1. Авокадо размять вилкой с лимонным соком и солью.\n2. Намазать на хлеб.\n3. Сверху ломтики помидора.","bju":"Б:4,Ж:8,У:16"},
    
    {"name":"Омлет с ветчиной из индейки и сыром","calories":157,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"яйцо 1 шт., яичный белок 1 шт., ветчина из индейки 30 г, сыр 10 г, зелень","recipe":"1. Яйцо и белок взбить.\n2. Ветчину нарезать кубиками, выложить на сковороду.\n3. Залить яйцом, посыпать сыром.\n4. Накрыть крышкой на 4 минуты.","bju":"Б:16,Ж:10,У:1"},
    {"name":"Куриная грудка на гриле с салатом","calories":150,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"куриная грудка 100 г, салатные листья 50 г, огурец 50 г, оливковое масло 3 г, соль, перец","recipe":"1. Грудку разрезать пополам вдоль, отбить, посолить и поперчить.\n2. Жарить на гриле по 4 минуты с каждой стороны.\n3. Салат с огурцом заправить маслом, подать с курицей.","bju":"Б:23,Ж:4,У:4"},
    {"name":"Креветки с чесноком","calories":135,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"очищенные креветки 100 г, сливочное масло 5 г, чеснок 1 зубчик, петрушка","recipe":"1. Растопить масло, обжарить чеснок 30 секунд.\n2. Добавить креветки.\n3. Жарить 3–4 минуты, посыпать петрушкой.","bju":"Б:19,Ж:6,У:1"},
    {"name":"Творожная запеканка в микроволновке","calories":175,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"творог 5% 100 г, яйцо 1/2 шт., манка 5 г, ванилин","recipe":"1. Смешать все ингредиенты до однородности.\n2. Выложить в керамическую форму.\n3. Готовить в микроволновке 4 минуты на средней мощности.","bju":"Б:19,Ж:8,У:8"},
    {"name":"Бутерброд с лососем","calories":180,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"цельнозерновой хлеб 30 г, слабосолёный лосось 40 г, творожный сыр 10 г, огурец 30 г, укроп","recipe":"1. Хлеб намазать творожным сыром.\n2. Сверху огурец и ломтики лосося.\n3. Украсить укропом.","bju":"Б:11,Ж:9,У:14"},
    {"name":"Скрэмбл с индейкой","calories":178,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"яйца 2 шт., ветчина из индейки 30 г, зелёный лук 3 г, соль","recipe":"1. Яйца взбить с солью.\n2. Индейку нарезать кубиками, прогреть на сковороде.\n3. Влить яйца, помешивая лопаткой, готовить 3 минуты.","bju":"Б:17,Ж:12,У:1"},
    
    {"name":"Гювеч из овощей","calories":170,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"баклажан 100 г, перец 70 г, кабачок 100 г, помидор 100 г, картофель 50 г, оливковое масло 5 г, чеснок, соль","recipe":"1. Все овощи нарезать крупными кубиками.\n2. Выложить в глиняный горшок или форму, посолить, добавить чеснок и масло.\n3. Накрыть крышкой или фольгой.\n4. Запекать при 180 °C 80 минут.","bju":"Б:5,Ж:5,У:25"},
    {"name":"Запечённые овощи с фетой","calories":160,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"кабачок 100 г, перец 80 г, помидор 70 г, фета 25 г, оливковое масло 3 г, орегано","recipe":"1. Овощи нарезать крупными кусками, смешать с маслом и орегано.\n2. Запекать при 200 °C 45 минут.\n3. Сверху выложить крошёную фету, запекать ещё 10 минут.","bju":"Б:6,Ж:9,У:12"},
    {"name":"Гаспачо","calories":170,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"помидоры 250 г, огурец 80 г, перец 50 г, оливковое масло 8 г, хлеб 10 г, чеснок, уксус 3 мл, соль","recipe":"1. Все овощи и хлеб измельчить блендером с чесноком и уксусом.\n2. Постепенно влить масло.\n3. Посолить и охладить минимум 3 часа.","bju":"Б:4,Ж:8,У:19"},
    {"name":"Яблоко, запечённое с творогом","calories":145,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"яблоко 150 г, творог 5% 50 г, мёд 5 г, корица 1 г","recipe":"1. У яблока вырезать сердцевину.\n2. Творог смешать с мёдом и корицей, нафаршировать яблоко.\n3. Запекать при 180 °C 50 минут.","bju":"Б:8,Ж:3,У:21"},
    {"name":"Запечённый батат","calories":130,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"батат 150 г, корица 1 г, морская соль","recipe":"1. Батат вымыть, проколоть вилкой.\n2. Запекать при 200 °C 60 минут до мягкости.\n3. Разрезать, посыпать корицей или солью.","bju":"Б:2,Ж:0,У:30"},
    {"name":"Тыквенный крем-суп со сливками","calories":150,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"тыква 200 г, картофель 40 г, лук 20 г, сливки 10% 30 мл, вода 250 мл, соль, мускатный орех","recipe":"1. Овощи нарезать, варить в воде 45 минут до мягкости.\n2. Пробить блендером.\n3. Влить сливки, посолить, добавить мускатный орех, прогреть.","bju":"Б:3,Ж:6,У:21"},
    
    {"name":"Запечённая куриная грудка с овощами","calories":135,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"куриная грудка 100 г, брокколи 50 г, морковь 30 г, лимонный сок 5 мл, чеснок, соль","recipe":"1. Грудку замариновать с лимонным соком и чесноком на 1 час.\n2. Выложить в форму с овощами.\n3. Накрыть фольгой, запекать при 190 °C 45 минут.","bju":"Б:24,Ж:2,У:5"},
    {"name":"Тушёная говядина с овощами","calories":150,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"говядина 60 г, морковь 50 г, лук 30 г, картофель 40 г, томатная паста 10 г, вода 100 мл, соль","recipe":"1. Мясо нарезать кубиками, потушить с водой 60 минут.\n2. Добавить морковь, лук и томатную пасту.\n3. Через 15 минут добавить картофель.\n4. Тушить 25 минут, посолить.","bju":"Б:13,Ж:4,У:14"},
    {"name":"Треска, запечённая с картофелем","calories":165,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"филе трески 100 г, картофель 80 г, лук 20 г, подсолнечное масло 3 г, лимонный сок, соль","recipe":"1. Картофель нарезать ломтиками, запекать при 200 °C 25 минут.\n2. Сверху положить посоленную треску и лук, сбрызнуть лимоном.\n3. Запекать ещё 25 минут.","bju":"Б:18,Ж:4,У:14"},
    {"name":"Холодец из индейки","calories":125,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"индейка 100 г, желатин 5 г, морковь 20 г, чеснок 1 зубчик, лавровый лист, вода 250 мл, соль","recipe":"1. Индейку варить 90 минут с морковью и лавровым листом.\n2. Мясо разобрать на волокна.\n3. Желатин замочить, растворить в горячем процеженном бульоне (150 мл).\n4. Мясо выложить в форму, залить бульоном.\n5. Охладить 6 часов.","bju":"Б:15,Ж:7,У:0"},
    {"name":"Тушёная индейка с овощами","calories":145,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"филе индейки 100 г, морковь 40 г, лук 30 г, томатная паста 10 г, вода 100 мл, соль","recipe":"1. Индейку нарезать кусками, тушить с водой 40 минут.\n2. Добавить морковь, лук и томатную пасту.\n3. Тушить 30 минут, посолить.","bju":"Б:22,Ж:3,У:8"},
    {"name":"Куриное бедро без кожи с чесноком","calories":140,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"куриное бедро без кожи 110 г, чеснок 2 зубчика, паприка 2 г, лимонный сок 5 мл, соль","recipe":"1. Бедро смешать с чесноком, паприкой, лимонным соком и солью.\n2. Мариновать 3 часа.\n3. Запекать при 190 °C 40 минут.","bju":"Б:19,Ж:7,У:1"},
    
    {"name":"Крем-суп из шампиньонов","calories":135,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"шампиньоны 150 г, лук 30 г, картофель 40 г, сливки 10% 50 мл, вода 200 мл, соль","recipe":"1. Лук и грибы обжарить на сухой сковороде 8 минут.\n2. Добавить картофель и воду, варить 15 минут.\n3. Пробить блендером, влить сливки, прогреть.","bju":"Б:5,Ж:6,У:13"},
    {"name":"Рыбный суп из трески","calories":120,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"филе трески 70 г, картофель 70 г, морковь 20 г, лук 15 г, вода 350 мл, лавровый лист, соль","recipe":"1. Картофель, морковь и лук варить 12 минут.\n2. Добавить кусочки трески и лавровый лист.\n3. Варить 10 минут, посолить.","bju":"Б:13,Ж:1,У:14"},
    {"name":"Салат с булгуром","calories":140,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"булгур 25 г (сухой), помидор 80 г, огурец 80 г, оливковое масло 5 г, лимонный сок, мята, соль","recipe":"1. Булгур залить кипятком (1:2) на 20 минут.\n2. Овощи нарезать мелко.\n3. Смешать, добавить лимон, масло и мяту.","bju":"Б:3,Ж:5,У:19"},
    {"name":"Лёгкий куриный суп с лапшой","calories":135,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"куриное филе 50 г, лапша 20 г, морковь 20 г, лук 15 г, вода 350 мл, зелень, соль","recipe":"1. Филе сварить 15 минут, нарезать.\n2. В бульон добавить морковь и лук, варить 8 минут.\n3. Всыпать лапшу, варить 5 минут.\n4. Вернуть мясо, посолить.","bju":"Б:10,Ж:2,У:19"},
    {"name":"Спагетти с томатным соусом","calories":125,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"спагетти 30 г (сухие), томатный соус 60 г, чеснок, базилик, соль","recipe":"1. Спагетти отварить до состояния аль денте (8 минут).\n2. Соус прогреть с чесноком 5 минут.\n3. Смешать с пастой, посыпать базиликом.","bju":"Б:5,Ж:1,У:25"},
    {"name":"Овощной омлет в духовке","calories":125,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"яйцо 1 шт., яичный белок 1 шт., болгарский перец 40 г, помидор 50 г, молоко 30 мл, соль","recipe":"1. Яйца взбить с молоком и солью.\n2. Овощи нарезать, выложить в форму.\n3. Залить яйцом.\n4. Запекать при 180 °C 20 минут.","bju":"Б:10,Ж:7,У:5"},
    
    {"name":"Куриная грудка с булгуром","calories":150,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"куриная грудка 70 г, булгур 25 г (сухой), зелень, соль, перец","recipe":"1. Булгур залить кипятком (1:2) на 20 минут.\n2. Грудку нарезать, посолить и обжарить 8 минут.\n3. Подавать вместе.","bju":"Б:18,Ж:2,У:16"},
    {"name":"Хек с рисом","calories":150,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"филе хека 100 г, рис отварной 50 г, лимон, укроп, соль","recipe":"1. Хек посолить, сбрызнуть лимоном.\n2. Готовить на пару 15 минут.\n3. Подавать с отварным рисом и укропом.","bju":"Б:18,Ж:2,У:14"},
    {"name":"Индейка с гречкой","calories":150,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"филе индейки 70 г, готовая гречка 60 г, зелень, соль","recipe":"1. Индейку нарезать кусочками, посолить.\n2. Жарить на антипригарной сковороде 10 минут.\n3. Подавать с гречкой.","bju":"Б:16,Ж:2,У:15"},
