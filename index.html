    {"name":"Крем-суп из брокколи с сыром","calories":606,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"брокколи, картофель, сливки, сыр, хлеб, лук","recipe":"1. Обжарить лук и добавить 150 г картофеля и 200 г брокколи.\n2. Залить 500 мл воды, варить 25 минут.\n3. Пробить блендером, добавить 80 мл сливок и 40 г сыра.\n4. Подать с гренками.","bju":"Б:24,Ж:30,У:60"},
    {"name":"Рататуй с моцареллой и хлебом","calories":638,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"баклажан, кабачок, помидоры, перец, моцарелла, масло, хлеб","recipe":"1. Нарезать овощи кубиками (по 100 г каждого).\n2. Обжарить 10 минут в 2 ст. л. масла.\n3. Тушить под крышкой 40 минут.\n4. Добавить 60 г моцареллы на 3 минуты, подать с хлебом.","bju":"Б:22,Ж:30,У:70"},
    {"name":"Чечевичный суп с паприкой и йогуртом","calories":620,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"чечевица, морковь, лук, копчёная паприка, йогурт, лепёшка","recipe":"1. Обжарить лук и морковь с 1 ч. л. паприки.\n2. Добавить 120 г чечевицы и 700 мл воды.\n3. Варить 35 минут и частично пробить блендером.\n4. Подать с 2 ст. л. йогурта и лепёшкой.","bju":"Б:30,Ж:20,У:80"},
    {"name":"Перцы, фаршированные индейкой и рисом","calories":632,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"болгарский перец, фарш из индейки, рис, лук, томатный соус","recipe":"1. Смешать 150 г фарша, 80 г варёного риса и лук.\n2. Нафаршировать 2 крупных перца.\n3. Залить 200 мл томатного соуса.\n4. Тушить или запекать 50 минут.","bju":"Б:38,Ж:20,У:75"},
    {"name":"Минестроне с пармезаном и хлебом","calories":614,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"фасоль, макароны, цукини, морковь, сельдерей, пармезан, хлеб","recipe":"1. Обжарить нарезанные овощи 8 минут.\n2. Добавить 100 г фасоли, 700 мл воды и томаты.\n3. Варить 30 минут, добавить 40 г макарон на последние 8 минут.\n4. Подать с пармезаном и хлебом.","bju":"Б:26,Ж:22,У:78"},

    // ===== Средне, медленно, сытное =====
    {"name":"Говядина тушёная с картофелем","calories":628,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"говядина, картофель, морковь, лук, томатная паста","recipe":"1. Обжарить 200 г говядины кубиками 10 минут.\n2. Добавить лук, морковь и 1 ст. л. томатной пасты.\n3. Залить водой, тушить 1,5 часа.\n4. Добавить картофель (200 г) и тушить ещё 25 минут.","bju":"Б:46,Ж:28,У:48"},
    {"name":"Лазанья","calories":672,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"листы лазаньи, фарш, томатный соус, бешамель, сыр","recipe":"1. Приготовить болоньезе: обжарить 150 г фарша с томатным соусом 20 минут.\n2. Выложить слоями листы, мясо и бешамель.\n3. Посыпать 50 г сыра.\n4. Запекать 40 минут при 190 °C.","bju":"Б:38,Ж:32,У:58"},
    {"name":"Плов с бараниной","calories":680,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"баранина, рис, морковь, лук, чеснок, зира","recipe":"1. Обжарить 150 г баранины 10 минут.\n2. Добавить лук и морковь, жарить 10 минут.\n3. Всыпать 90 г риса и 1 ч. л. зиры.\n4. Залить водой, тушить 40 минут с чесноком.","bju":"Б:36,Ж:32,У:62"},
    {"name":"Запечённые куриные бёдра с рисом","calories":644,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"куриные бёдра, рис, чеснок, паприка, масло","recipe":"1. Натереть 2 бедра паприкой, солью и чесноком.\n2. Запекать 45 минут при 200 °C.\n3. Отварить 80 г риса.\n4. Подать вместе с соком из формы.","bju":"Б:40,Ж:28,У:58"},
    {"name":"Гуляш с гречкой","calories":632,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"говядина, гречка, лук, паприка, томатная паста, мука","recipe":"1. Обжарить 180 г говядины с луком 10 минут.\n2. Добавить паприку, 1 ст. л. томатной пасты и 1 ч. л. муки.\n3. Залить 300 мл воды, тушить 1,5 часа.\n4. Подать с гречкой (80 г сухой).","bju":"Б:44,Ж:24,У:60"},
    {"name":"Свинина тушёная с капустой и картофелем","calories":618,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"свинина, капуста, картофель, морковь, лук","recipe":"1. Обжарить 150 г свинины 10 минут.\n2. Добавить лук, морковь и 250 г капусты.\n3. Залить 100 мл воды, тушить 40 минут.\n4. Добавить картофель (150 г), тушить 20 минут.","bju":"Б:38,Ж:34,У:40"},

    // ===== Средне, средне, лёгкое =====
    {"name":"Куриная грудка с киноа и овощами","calories":636,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"куриная грудка, киноа, брокколи, морковь, оливковое масло","recipe":"1. Отварить 80 г киноа 15 минут.\n2. Запечь 200 г грудки 20 минут при 200 °C.\n3. Приготовить овощи на пару 8 минут.\n4. Подать, полив 1 ст. л. масла.","bju":"Б:46,Ж:20,У:68"},
    {"name":"Салат с булгуром, фетой и нутом","calories":644,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"булгур, фета, нут, огурец, помидор, оливковое масло, мята","recipe":"1. Залить 80 г булгура кипятком на 15 минут.\n2. Смешать с 100 г нута и овощами.\n3. Добавить 50 г феты и мяту.\n4. Заправить 2 ст. л. масла и лимонным соком.","bju":"Б:26,Ж:28,У:72"},
    {"name":"Рыба на пару с рисом и соусом","calories":626,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"филе минтая или хека, рис, имбирь, соевый соус, огурец","recipe":"1. Отварить 90 г риса.\n2. Выложить 250 г рыбы в пароварку на 15 минут.\n3. Смешать 1 ст. л. соевого соуса, имбирь и масло.\n4. Подать рыбу с рисом и соусом.","bju":"Б:38,Ж:18,У:78"},
    {"name":"Паста с овощами гриль и сыром","calories":656,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"паста, кабачок, баклажан, перец, сыр, оливковое масло","recipe":"1. Нарезать овощи и обжарить на гриле или сковороде 12 минут.\n2. Отварить 100 г пасты.\n3. Смешать с овощами.\n4. Посыпать 40 г тёртого сыра.","bju":"Б:24,Ж:24,У:86"},
    {"name":"Запечённые баклажаны с сыром и кус-кусом","calories":652,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"баклажаны, моцарелла, томатный соус, кус-кус, базилик","recipe":"1. Разрезать 2 баклажана вдоль, запекать 20 минут при 200 °C.\n2. Полить томатным соусом и посыпать 70 г сыра.\n3. Запекать ещё 10 минут.\n4. Подать с кус-кусом (70 г сухого).","bju":"Б:24,Ж:28,У:76"},
    {"name":"Тайский суп с курицей и лапшой","calories":606,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"куриное филе, рисовая лапша, кокосовое молоко, паста карри, лайм","recipe":"1. Обжарить 1 ст. л. пасты карри 1 минуту.\n2. Влить 200 мл кокосового молока и 300 мл воды.\n3. Добавить 150 г курицы и варить 10 минут.\n4. Добавить лапшу (60 г) на 4 минуты, затем сок лайма.","bju":"Б:34,Ж:22,У:68"},

    // ===== Средне, средне, сытное =====
    {"name":"Котлеты из индейки с пюре","calories":610,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"фарш из индейки, картофель, лук, яйцо, молоко","recipe":"1. Смешать 200 г фарша, лук и яйцо.\n2. Сформировать котлеты, жарить по 6 минут с каждой стороны.\n3. Отварить 250 г картофеля 20 минут.\n4. Размять с молоком и маслом.","bju":"Б:44,Ж:26,У:50"},
    {"name":"Курица в сливочном соусе с рисом","calories":658,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"куриное филе, сливки, рис, чеснок, лук","recipe":"1. Обжарить 200 г филе кусочками 7 минут.\n2. Добавить лук и чеснок.\n3. Влить 100 мл сливок, тушить 10 минут.\n4. Подать с 80 г варёного риса.","bju":"Б:44,Ж:26,У:62"},
    {"name":"Тефтели в томатном соусе с пастой","calories":664,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"говяжий фарш, рис, паста, томатный соус, лук","recipe":"1. Смешать 180 г фарша, 30 г варёного риса и лук.\n2. Сформировать 6 тефтелей.\n3. Тушить в 200 мл томатного соуса 25 минут.\n4. Подать с 90 г отварной пасты.","bju":"Б:40,Ж:24,У:72"},
    {"name":"Шницель с картофельным салатом","calories":632,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"свиная отбивная, сухари, яйцо, картофель, огурец, майонез","recipe":"1. Отбить 150 г мяса, обмакнуть в яйцо и сухари.\n2. Жарить по 4–5 минут с каждой стороны.\n3. Отварить 250 г картофеля, нарезать, смешать с огурцом.\n4. Заправить 1 ст. л. майонеза.","bju":"Б:40,Ж:32,У:46"},
    {"name":"Рыбные котлеты с гречкой","calories":614,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"филе белой рыбы, гречка, лук, хлеб, яйцо","recipe":"1. Прокрутить 250 г рыбы с луком и хлебом.\n2. Добавить яйцо, соль и сформировать котлеты.\n3. Жарить по 5 минут с каждой стороны.\n4. Подать с гречкой (80 г сухой).","bju":"Б:38,Ж:22,У:66"},
    {"name":"Фритата с картофелем, ветчиной и сыром","calories":634,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"яйца, картофель, ветчина, сыр, лук","recipe":"1. Обжарить 150 г картофеля с луком 10 минут.\n2. Добавить 60 г ветчины.\n3. Залить 4 яйцами, посыпать 40 г сыра.\n4. Запекать 12 минут при 180 °C.","bju":"Б:38,Ж:34,У:44"},

    // ===== Дорого, быстро, лёгкое =====
    {"name":"Салат с креветками и авокадо","calories":630,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"креветки, авокадо, руккола, помидоры черри, оливковое масло, лимон, хлеб","recipe":"1. Обжарить 180 г креветок 3 минуты.\n2. Нарезать авокадо и черри.\n3. Смешать с рукколой и креветками.\n4. Заправить маслом и лимоном, подать с тостом.","bju":"Б:32,Ж:38,У:40"},
    {"name":"Тартин с копчёным лососем и авокадо","calories":618,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"хлеб, лосось, авокадо, лимон, зелень","recipe":"1. Поджарить 2 ломтя хлеба.\n2. Размять 1/2 авокадо с лимонным соком.\n3. Намазать на хлеб.\n4. Выложить 100 г лосося и зелень.","bju":"Б:28,Ж:34,У:50"},
    {"name":"Поке с лососем","calories":646,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"рис, сырой лосось, авокадо, эдамаме, соевый соус, кунжут","recipe":"1. Отварить 100 г риса для суши.\n2. Нарезать 120 г лосося кубиками, смешать с соевым соусом.\n3. Выложить в миску рис, лосось, авокадо и эдамаме.\n4. Посыпать кунжутом.","bju":"Б:36,Ж:22,У:76"},
    {"name":"Салат со стейком тунца и киноа","calories":616,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"тунец, киноа, огурец, эдамаме, кунжут, соевый соус","recipe":"1. Отварить 70 г киноа.\n2. Обжарить 150 г тунца по 1–2 минуты с каждой стороны.\n3. Смешать киноа с овощами.\n4. Выложить ломтики тунца и заправить соевым соусом с кунжутным маслом.","bju":"Б:42,Ж:24,У:58"},
    {"name":"Карпаччо из говядины с рукколой","calories":602,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"говяжья вырезка, руккола, пармезан, оливковое масло, лимон, хлеб","recipe":"1. Нарезать 120 г вырезки тонкими ломтиками.\n2. Выложить на тарелку.\n3. Добавить рукколу и стружку пармезана (30 г).\n4. Полить маслом и лимоном, подать с хлебом.","bju":"Б:34,Ж:34,У:40"},
    {"name":"Боул с гребешками и рисом","calories":644,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"гребешки, рис, спаржа, сливочное масло, лимон","recipe":"1. Обжарить 150 г гребешков по 2 минуты с каждой стороны на масле.\n2. Отварить 100 г риса.\n3. Спаржу обжарить 4 минуты.\n4. Собрать боул и сбрызнуть лимоном.","bju":"Б:36,Ж:20,У:80"},

    // ===== Дорого, быстро, сытное =====
    {"name":"Стейк рибай с жареным картофелем","calories":624,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"стейк рибай, картофель, розмарин, чеснок, масло","recipe":"1. Нарезать картофель (150 г) и жарить 12 минут.\n2. Обжарить 180 г стейка по 3–4 минуты с каждой стороны с чесноком и розмарином.\n3. Дать мясу отдохнуть 3 минуты.\n4. Подать с картофелем.","bju":"Б:46,Ж:40,У:20"},
    {"name":"Лосось на сковороде с пюре","calories":626,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"филе лосося, картофель, сливочное масло, молоко, лимон","recipe":"1. Отварить 250 г картофеля 15 минут и размять с молоком.\n2. Обжарить 150 г лосося по 4 минуты с каждой стороны.\n3. Сбрызнуть лимоном.\n4. Подать с пюре.","bju":"Б:42,Ж:34,У:38"},
    {"name":"Паста с креветками в сливочном соусе","calories":686,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"спагетти, креветки, сливки, чеснок, пармезан","recipe":"1. Отварить 100 г спагетти.\n2. Обжарить 150 г креветок с чесноком 3 минуты.\n3. Влить 100 мл сливок, готовить 3 минуты.\n4. Смешать с пастой и посыпать пармезаном.","bju":"Б:36,Ж:30,У:68"},
    {"name":"Утиная грудка с картофелем","calories":606,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"утиная грудка, картофель, тимьян, соль, перец","recipe":"1. Надрезать кожу 180 г грудки и начать жарить кожей вниз 7 минут.\n2. Перевернуть и жарить 4 минуты.\n3. Картофель (150 г) обжарить на вытопленном жире.\n4. Дать мясу отдохнуть 5 минут и нарезать.","bju":"Б:38,Ж:38,У:28"},
    {"name":"Тальятелле с лососем","calories":668,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"тальятелле, лосось, сливки, укроп, лимон","recipe":"1. Отварить 100 г пасты.\n2. Обжарить 130 г лосося кубиками 4 минуты.\n3. Влить 80 мл сливок и дать загустеть 2 минуты.\n4. Смешать с пастой, добавить укроп и лимон.","bju":"Б:38,Ж:28,У:66"},
    {"name":"Бургер с говяжьей котлетой и беконом","calories":668,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"булочка, говяжий фарш, бекон, сыр чеддер, салат, соус","recipe":"1. Сформировать котлету из 160 г фарша.\n2. Обжарить 2 ломтика бекона 3 минуты.\n3. Жарить котлету по 4 минуты с каждой стороны, добавить сыр.\n4. Собрать бургер с салатом и соусом.","bju":"Б:44,Ж:36,У:42"},

    // ===== Дорого, медленно, лёгкое =====
    {"name":"Запечённая дорада с овощами","calories":624,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"дорада, картофель, лимон, помидоры черри, оливковое масло, тимьян","recipe":"1. Нарезать 250 г картофеля дольками и запекать 20 минут при 200 °C.\n2. Положить 1 дораду (350 г с костями), начинить лимоном и тимьяном.\n3. Добавить черри и полить 1 ст. л. масла.\n4. Запекать 25 минут.","bju":"Б:44,Ж:24,У:58"},
    {"name":"Том ям с креветками и рисом","calories":614,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"креветки, грибы, паста том ям, кокосовое молоко, лайм, рис","recipe":"1. Довести до кипения 500 мл воды с 2 ст. л. пасты том ям.\n2. Добавить грибы и варить 10 минут.\n3. Добавить 180 г креветок и 100 мл кокосового молока, варить 5 минут.\n4. Подать с 80 г варёного риса и соком лайма.","bju":"Б:34,Ж:22,У:70"},
    {"name":"Фаршированные кальмары с рисом","calories":612,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"тушки кальмара, рис, лук, морковь, сметана","recipe":"1. Отварить 70 г риса и смешать с обжаренными луком и морковью.\n2. Нафаршировать 2 тушки (250 г) и заколоть зубочистками.\n3. Тушить в 100 г сметаны с 100 мл воды 30 минут.\n4. Нарезать кружками.","bju":"Б:36,Ж:20,У:72"},
    {"name":"Уха из сёмги с картофелем","calories":626,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"сёмга, картофель, морковь, лук, лавровый лист, укроп, хлеб","recipe":"1. Довести до кипения 800 мл воды с луком и морковью.\n2. Добавить 250 г картофеля, варить 15 минут.\n3. Положить 200 г сёмги и варить 10 минут с лавровым листом.\n4. Добавить укроп, подать с хлебом.","bju":"Б:40,Ж:26,У:58"},
    {"name":"Осьминог с картофелем и паприкой","calories":600,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"осьминог, картофель, паприка, оливковое масло, чеснок","recipe":"1. Варить 250 г осьминога 50 минут до мягкости.\n2. Отварить 250 г картофеля и нарезать кружками.\n3. Нарезать осьминога на кусочки и выложить на картофель.\n4. Полить 1,5 ст. л. масла, посыпать паприкой и солью.","bju":"Б:42,Ж:24,У:54"},
    {"name":"Бульябес с морепродуктами","calories":630,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"рыба, креветки, мидии, томаты, лук-порей, шафран, хлеб","recipe":"1. Обжарить лук-порей и чеснок 5 минут.\n2. Добавить 200 г томатов и 500 мл воды, варить 15 минут.\n3. Положить 100 г рыбы, 80 г креветок и 80 г мидий, варить 10 минут.\n4. Подать с хлебом.","bju":"Б:46,Ж:22,У:62"},

    // ===== Дорого, медленно, сытное =====
    {"name":"Говяжьи щёчки в вине с пюре","calories":634,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"говяжьи щёчки, красное вино, морковь, лук, картофель, масло","recipe":"1. Обжарить 200 г щёчек 10 минут до корочки.\n2. Добавить овощи и 150 мл вина.\n3. Тушить 2,5 часа под крышкой.\n4. Подать с картофельным пюре (200 г).","bju":"Б:46,Ж:34,У:36"},
    {"name":"Запечённая баранья нога с картофелем","calories":618,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"баранина, картофель, чеснок, розмарин, оливковое масло","recipe":"1. Натереть 250 г баранины чесноком, розмарином и маслом.\n2. Выложить в форму с 200 г картофеля.\n3. Запекать 20 минут при 220 °C, затем 1,5 часа при 160 °C.\n4. Дать отдохнуть 10 минут.","bju":"Б:48,Ж:34,У:30"},
    {"name":"Утка с яблоками и гречкой","calories":630,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"утиная ножка, яблоки, гречка, мёд, горчица","recipe":"1. Натереть ножку солью и горчицей.\n2. Запекать с яблоками 1,5 часа при 180 °C.\n3. За 10 минут до конца полить мёдом.\n4. Подать с гречкой (70 г сухой).","bju":"Б:40,Ж:38,У:32"},
    {"name":"Оссобуко с ризотто","calories":668,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"телячья голень, рис арборио, томаты, белое вино, лук, пармезан","recipe":"1. Обжарить 250 г голени 10 минут.\n2. Добавить лук, томаты и 100 мл вина, тушить 2 часа.\n3. Сварить ризотто из 70 г риса с бульоном 20 минут.\n4. Добавить пармезан и подать с мясом.","bju":"Б:44,Ж:28,У:60"},
    {"name":"Свиные рёбра BBQ с кукурузой","calories":648,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"свиные рёбра, соус барбекю, кукуруза, паприка, мёд","recipe":"1. Натереть 300 г рёбер паприкой и солью.\n2. Запекать 2 часа при 150 °C в фольге.\n3. Смазать соусом BBQ и запекать 15 минут.\n4. Отварить початок кукурузы 20 минут.","bju":"Б:42,Ж:40,У:30"},
    {"name":"Свиная рулька с тушёной капустой","calories":614,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"свиная рулька, квашеная капуста, лук, тмин, пиво","recipe":"1. Варить 300 г рульки 1 час.\n2. Запекать 40 минут при 200 °C.\n3. Тушить 250 г капусты с луком, тмином и 50 мл пива 30 минут.\n4. Подать вместе.","bju":"Б:48,Ж:38,У:20"},

    // ===== Дорого, средне, лёгкое =====
    {"name":"Запечённый лосось с киноа и спаржей","calories":628,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"лосось, киноа, спаржа, лимон, оливковое масло","recipe":"1. Запекать 150 г лосося 15 минут при 200 °C.\n2. Отварить 70 г киноа 15 минут.\n3. Обжарить спаржу 5 минут.\n4. Подать с лимоном и 1 ч. л. масла.","bju":"Б:42,Ж:28,У:52"},
    {"name":"Тунец гриль с рисом и овощами","calories":602,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"стейк тунца, рис, цукини, перец, соевый соус","recipe":"1. Отварить 100 г риса.\n2. Обжарить овощи на гриле 8 минут.\n3. Жарить 180 г тунца по 2 минуты с каждой стороны.\n4. Подать с соевым соусом.","bju":"Б:44,Ж:18,У:66"},
    {"name":"Креветки с цукини-лапшой и орехами","calories":618,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"креветки, цукини, кедровые орехи, чеснок, оливковое масло, пармезан","recipe":"1. Нарезать 2 цукини спиралью.\n2. Обжарить 200 г креветок с чесноком 4 минуты.\n3. Добавить цукини на 2 минуты.\n4. Посыпать орехами (20 г) и пармезаном.","bju":"Б:36,Ж:34,У:42"},
    {"name":"Форель с картофелем и зеленью","calories":618,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"форель, картофель, укроп, лимон, оливковое масло","recipe":"1. Запекать 250 г картофеля 20 минут при 200 °C.\n2. Добавить 200 г филе форели.\n3. Полить маслом и лимоном.\n4. Запекать 15 минут, посыпать укропом.","bju":"Б:42,Ж:26,У:54"},
    {"name":"Куриная грудка с сыром, вялеными томатами и булгуром","calories":632,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"куриная грудка, вяленые томаты, моцарелла, булгур, базилик","recipe":"1. Сделать надрез на 200 г грудки и вложить томаты и сыр.\n2. Запекать 25 минут при 190 °C.\n3. Залить 70 г булгура кипятком на 15 минут.\n4. Подать с базиликом.","bju":"Б:46,Ж:24,У:58"},
    {"name":"Гребешки с кус-кусом","calories":608,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"гребешки, кус-кус, горошек, сливочное масло, лимон","recipe":"1. Залить 80 г кус-куса кипятком на 5 минут.\n2. Добавить горошек и 10 г масла.\n3. Обжарить 180 г гребешков по 2 минуты с каждой стороны.\n4. Подать с лимоном.","bju":"Б:36,Ж:24,У:62"},

    // ===== Дорого, средне, сытное =====
    {"name":"Стейк говяжий с грибным соусом и пюре","calories":652,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"говяжий стейк, шампиньоны, сливки, картофель, масло","recipe":"1. Отварить 200 г картофеля и размять в пюре.\n2. Обжарить 160 г стейка по 4 минуты с каждой стороны.\n3. Обжарить 100 г грибов и добавить 50 мл сливок.\n4. Подать стейк с соусом и пюре.","bju":"Б:46,Ж:36,У:36"},
    {"name":"Лосось в сливочном соусе с рисом","calories":664,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"лосось, сливки, рис, укроп, чеснок","recipe":"1. Отварить 80 г риса.\n2. Обжарить 160 г лосося 8 минут.\n3. Влить 100 мл сливок с чесноком, тушить 7 минут.\n4. Подать с рисом и укропом.","bju":"Б:42,Ж:32,У:52"},
    {"name":"Ризотто с креветками","calories":674,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"рис арборио, креветки, бульон, белое вино, пармезан, лук","recipe":"1. Обжарить лук и 90 г риса 2 минуты.\n2. Влить 50 мл вина и постепенно 400 мл бульона, помешивая 18 минут.\n3. Добавить 150 г креветок на последние 4 минуты.\n4. Вмешать 30 г пармезана.","bju":"Б:34,Ж:26,У:76"},
    {"name":"Свиная корейка с запечённым картофелем","calories":634,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"свиная корейка, картофель, чеснок, розмарин, масло","recipe":"1. Обжарить 180 г корейки по 3 минуты с каждой стороны.\n2. Переложить в форму с 200 г картофеля, чесноком и розмарином.\n3. Запекать 25 минут при 190 °C.\n4. Дать отдохнуть 5 минут.","bju":"Б:44,Ж:34,У:38"},
    {"name":"Утиная грудка с гречкой и ягодным соусом","calories":634,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"утиная грудка, гречка, клюква, мёд, лук","recipe":"1. Жарить 180 г грудки кожей вниз 8 минут, затем 4 минуты с другой стороны.\n2. Отварить 70 г гречки.\n3. В сковороде с жиром потомить 50 г ягод с 1 ч. л. мёда 5 минут.\n4. Подать мясо с соусом и гречкой.","bju":"Б:42,Ж:34,У:40"},
    {"name":"Паста с говяжьей вырезкой и пармезаном","calories":692,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"паста, говяжья вырезка, пармезан, руккола, помидоры, оливковое масло","recipe":"1. Отварить 100 г пасты.\n2. Обжарить 150 г нарезанной вырезки 5 минут.\n3. Добавить помидоры, смешать с пастой.\n4. Посыпать пармезаном (25 г) и рукколой.","bju":"Б:44,Ж:28,У:66"},

        
    // ===== ДЁШЕВО · БЫСТРО · ЛЁГКОЕ =====
    {"name":"Омлет с овощами и сыром","calories":720,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"яйца 4 шт., сыр 40 г, помидор 100 г, болгарский перец 50 г, масло 15 г, хлеб 2 ломтика (60 г), соль, перец","recipe":"1. Яйца взбить с солью и перцем, добавить 30 мл воды.\n2. Помидор и перец нарезать кубиками.\n3. Разогреть масло, обжарить овощи 2 минуты.\n4. Залить яйцами, готовить под крышкой на слабом огне 5 минут.\n5. Посыпать тёртым сыром, дать растаять 1 минуту, подать с хлебом.","bju":"Б:38,Ж:52,У:25"},
    {"name":"Паста с томатом и чесноком","calories":718,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"макароны 150 г, томатная паста 30 г, масло 20 г, чеснок 3 зубчика, базилик, соль","recipe":"1. Макароны отварить в подсоленной воде 9–10 минут до состояния аль денте.\n2. Чеснок мелко нарезать и обжарить в масле 1 минуту.\n3. Добавить томатную пасту и 100 мл воды из-под макарон, тушить 3 минуты.\n4. Смешать пасту с соусом, прогреть 1 минуту.\n5. Посыпать зеленью и подать.","bju":"Б:18,Ж:22,У:112"},
    {"name":"Гречка с яйцами и огурцом","calories":705,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"гречка 100 г, яйца 3 шт., масло сливочное 15 г, огурец 150 г, зелень, соль","recipe":"1. Гречку промыть, залить 200 мл кипятка, варить 15 минут под крышкой.\n2. Яйца сварить вкрутую (8 минут), остудить, почистить.\n3. В готовую гречку добавить масло и соль.\n4. Огурец нарезать полукольцами, смешать с зеленью.\n5. Подать гречку с яйцами и огурцом.","bju":"Б:32,Ж:33,У:70"},
    {"name":"Картофельные оладьи со сметаной","calories":722,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"картофель 400 г, яйцо 1 шт., мука 30 г, масло 20 г, сметана 40 г, лук 30 г, соль","recipe":"1. Картофель и лук натереть на мелкой тёрке, слегка отжать сок.\n2. Добавить яйцо, муку, соль, перемешать.\n3. Разогреть масло на сковороде.\n4. Выкладывать ложкой оладьи, жарить по 3 минуты с каждой стороны до румяной корочки.\n5. Подать со сметаной.","bju":"Б:15,Ж:38,У:80"},
    {"name":"Жареный рис с яйцом и овощами","calories":723,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"рис 100 г (сухой), яйца 2 шт., зелёный горошек 50 г, морковь 50 г, масло 20 г, соевый соус 15 мл","recipe":"1. Рис отварить до готовности (15 минут), промыть и обсушить.\n2. Морковь натереть, обжарить в масле 2 минуты с горошком.\n3. Сдвинуть овощи, вбить яйца, перемешать до загустения.\n4. Добавить рис и соевый соус, жарить 3 минуты на сильном огне.\n5. Подать горячим.","bju":"Б:23,Ж:31,У:88"},
    {"name":"Бутерброды с яичной пастой и огурцом","calories":732,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"хлеб 3 ломтика (90 г), яйца 3 шт., майонез 25 г, сыр 20 г, огурец 100 г, зелень","recipe":"1. Яйца сварить вкрутую 8 минут, остудить и почистить.\n2. Яйца измельчить вилкой, добавить майонез, тёртый сыр, зелень.\n3. Хлеб слегка подсушить на сухой сковороде.\n4. Намазать пасту на хлеб, сверху выложить кружочки огурца.\n5. Подать сразу.","bju":"Б:34,Ж:44,У:50"},

    // ===== ДЁШЕВО · БЫСТРО · СЫТНОЕ =====
    {"name":"Макароны по-флотски","calories":749,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"макароны 120 г, фарш говяжий 120 г, лук 50 г, масло 5 г, соль, перец","recipe":"1. Макароны отварить 10 минут в подсоленной воде.\n2. Лук мелко нарезать, обжарить в масле 2 минуты.\n3. Добавить фарш, жарить 8 минут, разбивая комочки, посолить и поперчить.\n4. Макароны слить, смешать с фаршем.\n5. Прогреть 1 минуту и подать.","bju":"Б:36,Ж:29,У:86"},
    {"name":"Жареная картошка с яйцами","calories":752,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"картофель 400 г, яйца 3 шт., масло 25 г, лук 40 г, зелень, соль","recipe":"1. Картофель нарезать тонкой соломкой, промыть и обсушить.\n2. Жарить в масле на сильном огне 12 минут, помешивая.\n3. Добавить нарезанный лук, жарить ещё 3 минуты.\n4. Вбить яйца, посолить, накрыть крышкой на 3 минуты.\n5. Посыпать зеленью и подать.","bju":"Б:27,Ж:40,У:71"},
    {"name":"Быстрый плов с курицей","calories":762,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"рис 100 г, бёдра куриные без кожи 150 г, морковь 80 г, лук 50 г, масло 10 г, специи для плова","recipe":"1. Курицу нарезать кусочками 2 см, лук и морковь – соломкой.\n2. Обжарить курицу в масле 5 минут.\n3. Добавить лук и морковь, жарить 3 минуты.\n4. Всыпать промытый рис, специи, соль, залить 220 мл кипятка.\n5. Накрыть крышкой, готовить на слабом огне 15 минут.","bju":"Б:35,Ж:30,У:88"},
    {"name":"Сосиски с картофельным пюре и горошком","calories":714,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"картофель 350 г, сосиски 2 шт. (100 г), молоко 50 мл, масло 10 г, зелёный горошек 50 г","recipe":"1. Картофель нарезать мелкими кубиками, варить 12 минут.\n2. Слить воду, размять с горячим молоком и маслом.\n3. Сосиски отварить 5 минут или обжарить.\n4. Горошек прогреть в кипятке 2 минуты.\n5. Подать пюре с сосисками и горошком.","bju":"Б:21,Ж:38,У:72"},
    {"name":"Гречка с грибами и сыром","calories":750,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"гречка 100 г, шампиньоны 200 г, сыр 50 г, масло 15 г, лук 40 г, соль","recipe":"1. Гречку залить 200 мл кипятка, варить 15 минут.\n2. Шампиньоны нарезать пластинами, лук – кубиками.\n3. Обжарить лук и грибы в масле 8 минут до испарения влаги.\n4. Смешать гречку с грибами.\n5. Посыпать тёртым сыром, накрыть на 1 минуту.","bju":"Б:32,Ж:38,У:70"},
    {"name":"Яичная лапша с курицей","calories":713,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"яичная лапша 120 г, куриная грудка 120 г, масло 15 г, лук 40 г, соевый соус 20 мл","recipe":"1. Грудку нарезать полосками, лук – полукольцами.\n2. Обжарить курицу в масле 6 минут до золотистого цвета.\n3. Добавить лук, жарить 2 минуты.\n4. Лапшу отварить 5 минут, слить воду.\n5. Смешать лапшу с курицей и соевым соусом, прогреть 2 минуты.","bju":"Б:43,Ж:21,У:88"},

    // ===== ДЁШЕВО · МЕДЛЕННО · ЛЁГКОЕ =====
    {"name":"Овощное рагу с фасолью","calories":708,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"картофель 300 г, кабачок 150 г, фасоль консервированная 150 г, морковь 80 г, лук 60 г, масло 30 г, томатная паста 20 г","recipe":"1. Овощи нарезать кубиками.\n2. Лук и морковь обжарить в масле 5 минут, добавить томатную пасту.\n3. Добавить картофель и 200 мл воды, тушить 20 минут.\n4. Добавить кабачок и фасоль, тушить ещё 25 минут под крышкой.\n5. Посолить, настоять 10 минут и подать.","bju":"Б:17,Ж:32,У:88"},
    {"name":"Тушёная капуста с рисом и яйцом","calories":768,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"капуста 400 г, рис 80 г, яйца 2 шт., масло 25 г, томатная паста 20 г, лук 50 г","recipe":"1. Капусту нашинковать, лук нарезать.\n2. Обжарить лук в масле, добавить капусту, жарить 10 минут.\n3. Добавить томатную пасту и 100 мл воды, тушить под крышкой 40 минут.\n4. Рис отварить 15 минут, яйца сварить вкрутую.\n5. Подать капусту с рисом и нарезанными яйцами.","bju":"Б:25,Ж:36,У:86"},
    {"name":"Гороховый суп с гренками","calories":747,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"горох колотый 100 г, картофель 100 г, морковь 60 г, масло 20 г, хлеб 50 г, лук 40 г","recipe":"1. Горох замочить на 2 часа, промыть.\n2. Варить горох в 800 мл воды 50 минут.\n3. Добавить кубики картофеля, варить ещё 15 минут.\n4. Лук и морковь обжарить в 15 г масла, добавить в суп.\n5. Хлеб нарезать кубиками, подсушить в оставшемся масле, подать с супом.","bju":"Б:29,Ж:23,У:106"},
    {"name":"Постный борщ с фасолью","calories":740,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"свёкла 100 г, капуста 150 г, картофель 150 г, фасоль сухая 60 г, масло 25 г, хлеб 40 г, томатная паста 20 г","recipe":"1. Фасоль замочить на ночь, отварить 60 минут.\n2. Свёклу натереть, обжарить в масле с томатной пастой 8 минут.\n3. В бульон с фасолью добавить картофель, через 10 минут – капусту.\n4. Добавить зажарку, варить 15 минут.\n5. Дать настояться 10 минут, подать с хлебом.","bju":"Б:21,Ж:28,У:101"},
    {"name":"Перловая каша на молоке с тыквой","calories":723,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"перловка 100 г, молоко 300 мл, тыква 200 г, масло 15 г, вода 200 мл","recipe":"1. Перловку замочить на 4 часа, промыть.\n2. Варить в воде 40 минут до полуготовности.\n3. Добавить тыкву кубиками и горячее молоко.\n4. Томить на слабом огне 25 минут, помешивая.\n5. Добавить масло, настоять 10 минут.","bju":"Б:21,Ж:27,У:99"},
    {"name":"Запечённые баклажаны с картофелем и сыром","calories":721,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"баклажаны 300 г, картофель 300 г, сыр 50 г, масло 25 г, чеснок 2 зубчика, зелень","recipe":"1. Баклажаны и картофель нарезать кружками 1 см.\n2. Смешать с маслом, чесноком и солью.\n3. Выложить на противень, запекать при 200 °C 45 минут, перевернув один раз.\n4. Посыпать сыром, запекать ещё 10 минут.\n5. Подать с зеленью.","bju":"Б:21,Ж:41,У:67"},

    // ===== ДЁШЕВО · МЕДЛЕННО · СЫТНОЕ =====
    {"name":"Плов с говядиной","calories":759,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"рис 100 г, говядина 150 г, морковь 100 г, лук 60 г, масло 15 г, чеснок 2 зубчика, зира, барбарис","recipe":"1. Говядину нарезать кубиками 2 см, обжарить в масле 10 минут.\n2. Добавить лук и морковь, жарить 8 минут.\n3. Влить 150 мл воды, тушить мясо 60 минут под крышкой.\n4. Добавить специи, промытый рис, чеснок, залить кипятком на 1 см выше риса.\n5. Варить 20 минут на слабом огне, настоять 10 минут.","bju":"Б:37,Ж:31,У:83"},
    {"name":"Ленивые голубцы","calories":760,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"фарш говяжий 120 г, рис 60 г, капуста 200 г, яйцо 1 шт., мука 20 г, сметана 30 г, томатная паста 20 г","recipe":"1. Рис отварить до полуготовности (10 минут).\n2. Капусту мелко нашинковать, ошпарить, отжать.\n3. Смешать фарш, рис, капусту, яйцо, муку, соль, сформировать котлеты.\n4. Обжарить котлеты по 3 минуты с каждой стороны.\n5. Залить соусом из сметаны, пасты и 200 мл воды, тушить 45 минут.","bju":"Б:37,Ж:36,У:72"},
    {"name":"Картофельная запеканка с фаршем","calories":769,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"картофель 350 г, фарш 120 г, лук 50 г, молоко 50 мл, сыр 30 г, масло 10 г","recipe":"1. Картофель сварить 20 минут и сделать пюре с молоком.\n2. Лук обжарить с фаршем 12 минут, посолить.\n3. В форму выложить половину пюре, фарш, затем остальное пюре.\n4. Посыпать сыром, сбрызнуть маслом.\n5. Запекать при 200 °C 30 минут.","bju":"Б:37,Ж:41,У:63"},
    {"name":"Гороховый суп с копчёными рёбрышками","calories":725,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"горох 70 г, копчёные рёбрышки 100 г, картофель 120 г, лук 40 г, морковь 40 г, хлеб 40 г","recipe":"1. Горох замочить на 3 часа.\n2. Рёбрышки залить 900 мл воды, варить 30 минут.\n3. Добавить горох, варить 40 минут.\n4. Добавить картофель, лук и морковь, варить 20 минут.\n5. Подать с хлебом.","bju":"Б:36,Ж:29,У:80"},
    {"name":"Тефтели с гречкой в томатном соусе","calories":751,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"фарш 100 г, рис 30 г, гречка 90 г, томатная паста 30 г, лук 50 г, масло 10 г","recipe":"1. Рис отварить 8 минут, смешать с фаршем и тёртым луком.\n2. Сформировать шарики по 30 г.\n3. Обжарить в масле 5 минут.\n4. Залить соусом из пасты и 250 мл воды, тушить 45 минут.\n5. Гречку сварить 15 минут и подать с тефтелями.","bju":"Б:32,Ж:31,У:86"},
    {"name":"Тушёная курица с картофелем","calories":730,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"куриные бёдра 200 г (мясо), картофель 300 г, морковь 80 г, лук 60 г, масло 10 г","recipe":"1. Курицу нарезать порциями, обжарить в масле 8 минут.\n2. Добавить лук и морковь, жарить 5 минут.\n3. Добавить картофель кубиками и 200 мл воды.\n4. Тушить под крышкой 60 минут.\n5. Посолить, добавить лавровый лист, настоять 10 минут.","bju":"Б:42,Ж:34,У:64"},

    // ===== ДЁШЕВО · СРЕДНЕ · ЛЁГКОЕ =====
    {"name":"Курица с картофелем и овощами в духовке","calories":753,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"куриная грудка 150 г, картофель 300 г, морковь 80 г, перец 60 г, масло 20 г, сметана 40 г","recipe":"1. Грудку нарезать кусками, овощи – кубиками.\n2. Смешать с маслом, солью и специями.\n3. Выложить в форму, запекать при 200 °C 40 минут.\n4. За 10 минут до готовности полить сметаной.\n5. Подать горячим.","bju":"Б:41,Ж:37,У:64"},
    {"name":"Запеканка из минтая с рисом","calories":722,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"минтай 250 г, рис 80 г, морковь 60 г, лук 40 г, масло 20 г, сыр 20 г","recipe":"1. Рис отварить 15 минут.\n2. Лук и морковь обжарить в масле 5 минут.\n3. В форму выложить рис, овощи и кусочки рыбы.\n4. Залить 100 мл воды, посыпать сыром.\n5. Запекать при 190 °C 30 минут.","bju":"Б:53,Ж:30,У:60"},
    {"name":"Овощной суп-пюре с сыром и гренками","calories":734,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"картофель 200 г, морковь 100 г, лук 50 г, сливки 70 мл, сыр 30 г, хлеб 50 г, масло 15 г","recipe":"1. Овощи нарезать, варить в 600 мл воды 25 минут.\n2. Взбить блендером до гладкости.\n3. Добавить сливки и сыр, прогреть 3 минуты.\n4. Хлеб нарезать кубиками, обжарить в масле 3 минуты.\n5. Подать суп с гренками.","bju":"Б:18,Ж:38,У:80"},
    {"name":"Кабачковые оладьи со сметаной","calories":723,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"кабачок 400 г, яйца 2 шт., мука 60 г, масло 20 г, сметана 40 г, чеснок 1 зубчик","recipe":"1. Кабачок натереть, посолить, через 10 минут отжать.\n2. Добавить яйца, муку, чеснок, перемешать.\n3. Жарить оладьи в масле по 4 минуты с каждой стороны.\n4. Выложить на бумажное полотенце.\n5. Подать со сметаной.","bju":"Б:22,Ж:43,У:62"},
    {"name":"Макароны с тыквой и сыром","calories":756,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"макароны 110 г, тыква 200 г, сыр 50 г, масло 15 г, чеснок 2 зубчика","recipe":"1. Тыкву нарезать кубиками, запечь 25 минут при 200 °C.\n2. Размять половину тыквы вилкой с чесноком и маслом.\n3. Макароны отварить 10 минут.\n4. Смешать макароны с пюре и оставшейся тыквой.\n5. Посыпать сыром и подать.","bju":"Б:26,Ж:32,У:91"},
    {"name":"Запечённый рис с овощами и яйцом","calories":754,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"рис 100 г, овощная смесь 200 г, яйца 2 шт., сыр 30 г, масло 10 г","recipe":"1. Рис отварить 12 минут до полуготовности.\n2. Смешать рис с овощами и маслом.\n3. Выложить в форму, сделать углубления и вбить яйца.\n4. Посыпать сыром.\n5. Запекать при 190 °C 25 минут.","bju":"Б:31,Ж:30,У:90"},

    {"name":"Куриные котлеты с пюре","calories":726,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"фарш куриный 150 г, хлеб 20 г, лук 30 г, картофель 300 г, молоко 60 мл, масло 20 г","recipe":"1. Хлеб замочить в молоке, смешать с фаршем и луком.\n2. Сформировать котлеты, обжарить по 5 минут с каждой стороны.\n3. Довести до готовности под крышкой 10 минут.\n4. Картофель сварить 20 минут, размять с молоком и маслом.\n5. Подать котлеты с пюре.","bju":"Б:40,Ж:34,У:65"},

    {"name":"Творожный десерт с бананом, мёдом и орехами","calories":840,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"творог 5% 250 г, банан 2 шт., мёд 30 г, грецкие орехи 40 г, изюм 30 г","recipe":"1. Творог выложить в миску и слегка размять вилкой.\n2. Бананы нарезать кружками.\n3. Орехи измельчить ножом.\n4. Смешать всё с мёдом и изюмом, подавать охлаждённым.","bju":"Б:47,Ж:30,У:96"},
    {"name":"Рисовая лапша с овощами и арахисовым соусом","calories":850,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"рисовая лапша 120 г, морковь 1 шт., огурец 1 шт., арахисовая паста 40 г, соевый соус 20 мл, масло 10 мл","recipe":"1. Лапшу залить кипятком на 5–7 минут, откинуть.\n2. Морковь и огурец нарезать соломкой.\n3. Смешать арахисовую пасту, соевый соус и 2 ст. ложки горячей воды.\n4. Соединить лапшу, овощи и соус, перемешать.","bju":"Б:22,Ж:26,У:128"},
    {"name":"Кускус с курагой, изюмом и мёдом","calories":860,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"кускус 150 г, курага 60 г, изюм 40 г, мёд 25 г, сливочное масло 15 г, миндаль 30 г","recipe":"1. Кускус залить равным объёмом кипятка, накрыть на 5 минут.\n2. Курагу нарезать, изюм ополоснуть.\n3. Добавить в кускус масло, сухофрукты и миндаль.\n4. Полить мёдом, перемешать вилкой.","bju":"Б:24,Ж:24,У:138"},

    // ===== Дёшево, быстро, сытное =====
    {"name":"Омлет с сыром и картофелем","calories":820,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"яйца 4 шт., картофель варёный 200 г, сыр 50 г, масло 15 мл, молоко 50 мл","recipe":"1. Картофель нарезать кубиками и обжарить 5 минут на масле.\n2. Яйца взбить с молоком и солью.\n3. Залить картофель, посыпать сыром.\n4. Готовить под крышкой 5–6 минут на слабом огне.","bju":"Б:42,Ж:50,У:46"},
    {"name":"Макароны с яйцом и сыром","calories":840,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"макароны 150 г, яйца 2 шт., сыр 60 г, масло 15 г, чеснок 1 зубчик","recipe":"1. Макароны сварить 8–9 минут в подсоленной воде.\n2. На сковороде растопить масло, добавить чеснок.\n3. Добавить макароны и вбить яйца, быстро перемешать.\n4. Посыпать тёртым сыром и подавать.","bju":"Б:38,Ж:34,У:96"},
    {"name":"Гречка с жареными яйцами и луком","calories":830,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"гречка варёная 300 г, яйца 3 шт., лук 1 шт., масло 20 мл","recipe":"1. Лук нарезать и обжарить до золотистого цвета.\n2. Добавить готовую гречку и прогреть 3 минуты.\n3. Отдельно пожарить яйца.\n4. Выложить яйца на гречку и подавать.","bju":"Б:36,Ж:36,У:86"},
    {"name":"Бутерброды с сыром и яйцом","calories":850,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"хлеб 4 ломтика, сыр 80 г, яйца 3 шт., масло сливочное 15 г, помидор 1 шт.","recipe":"1. Яйца сварить вкрутую (10 минут).\n2. Хлеб подсушить, намазать маслом.\n3. Сверху положить сыр, ломтики яйца и помидор.\n4. Запечь 3 минуты в духовке или микроволновке.","bju":"Б:44,Ж:42,У:68"},
    {"name":"Пельмени со сметаной","calories":860,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"пельмени 300 г, сметана 60 г, масло сливочное 10 г, зелень 10 г","recipe":"1. Воду посолить, довести до кипения.\n2. Опустить пельмени и варить 7–8 минут после всплытия.\n3. Откинуть, добавить масло.\n4. Подавать со сметаной и зеленью.","bju":"Б:34,Ж:42,У:84"},
    {"name":"Жареный рис с яйцом и овощами","calories":870,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"варёный рис 300 г, яйца 3 шт., морковь 1 шт., горошек 60 г, масло 20 мл, соевый соус 20 мл","recipe":"1. Морковь натереть и обжарить 2 минуты на масле.\n2. Добавить горошек и рис, жарить 4 минуты.\n3. Сдвинуть в сторону, вбить яйца и перемешать.\n4. Влить соевый соус, прогреть 1 минуту.","bju":"Б:32,Ж:34,У:104"},

    // ===== Дёшево, медленно, лёгкое =====
    {"name":"Тыквенная каша с пшеном, изюмом и мёдом","calories":810,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"тыква 300 г, пшено 120 г, молоко 400 мл, изюм 40 г, мёд 30 г, масло сливочное 15 г","recipe":"1. Тыкву нарезать кубиками, пшено промыть.\n2. Тыкву тушить с молоком 20 минут.\n3. Добавить пшено, варить на слабом огне 40 минут.\n4. Затем выдержать в духовке 30 минут при 150 °C.\n5. Добавить изюм, масло и мёд.","bju":"Б:24,Ж:22,У:130"},
    {"name":"Яблочный пирог на кефире","calories":820,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"яблоки 400 г, мука 150 г, кефир 200 мл, яйца 2 шт., сахар 100 г, масло 40 г","recipe":"1. Яйца взбить с сахаром.\n2. Добавить кефир, растопленное масло и муку, замесить жидкое тесто.\n3. Яблоки нарезать дольками, выложить в форму.\n4. Залить тестом.\n5. Выпекать 50 минут при 180 °C, остудить 30 минут.","bju":"Б:22,Ж:26,У:128"},
    {"name":"Рисовая запеканка с яблоками и корицей","calories":830,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"рис 120 г, яблоки 300 г, молоко 300 мл, яйцо 1 шт., сахар 50 г, изюм 40 г, корица 3 г","recipe":"1. Рис отварить в молоке до густоты (30 минут).\n2. Яблоки натереть, смешать с рисом, яйцом, сахаром, изюмом и корицей.\n3. Выложить в форму.\n4. Запекать 40 минут при 180 °C.\n5. Остудить 20 минут.","bju":"Б:24,Ж:20,У:140"},
    {"name":"Овсяная каша на молоке с сухофруктами, томлёная","calories":840,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"овсяные хлопья 120 г, молоко 500 мл, курага 40 г, чернослив 40 г, мёд 25 г, масло 10 г","recipe":"1. Хлопья залить молоком, довести до кипения.\n2. Варить 10 минут, добавить нарезанные сухофрукты.\n3. Перелить в горшочек и томить в духовке 60 минут при 130 °C.\n4. Добавить мёд и масло.","bju":"Б:30,Ж:24,У:130"},
    {"name":"Морковный пирог с орехами","calories":850,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"морковь 250 г, мука 150 г, яйца 2 шт., сахар 100 г, масло растительное 60 мл, грецкие орехи 50 г","recipe":"1. Морковь натереть на мелкой тёрке.\n2. Яйца взбить с сахаром и маслом.\n3. Добавить муку, разрыхлитель, морковь и орехи.\n4. Выпекать 55 минут при 180 °C.\n5. Остудить перед подачей 30 минут.","bju":"Б:20,Ж:38,У:110"},
    {"name":"Печёные яблоки с творогом и мёдом","calories":860,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"яблоки 4 шт., творог 250 г, мёд 40 г, изюм 40 г, грецкие орехи 30 г, сахар 30 г","recipe":"1. У яблок вырезать сердцевину.\n2. Творог смешать с изюмом, орехами и сахаром.\n3. Начинить яблоки.\n4. Запекать 50 минут при 180 °C.\n5. Полить мёдом и остудить 15 минут.","bju":"Б:36,Ж:26,У:122"},

    // ===== Дёшево, медленно, сытное =====
    {"name":"Тушёная капуста с мясом и картофелем","calories":820,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"свинина 200 г, капуста 300 г, картофель 250 г, морковь 1 шт., лук 1 шт., томатная паста 30 г","recipe":"1. Мясо нарезать кубиками и обжарить 10 минут.\n2. Добавить лук и морковь, жарить 5 минут.\n3. Добавить капусту, картофель, томатную пасту и 150 мл воды.\n4. Тушить под крышкой 80 минут.","bju":"Б:38,Ж:42,У:68"},
    {"name":"Гороховый суп с копчёностями","calories":830,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"горох 120 г, копчёные рёбра 150 г, картофель 200 г, морковь 1 шт., лук 1 шт., вода 700 мл","recipe":"1. Горох замочить на 4 часа.\n2. Рёбра залить водой, варить 40 минут.\n3. Добавить горох, варить ещё 40 минут.\n4. Добавить картофель, морковь и лук, варить 25 минут.\n5. Посолить, подавать с зеленью.","bju":"Б:42,Ж:38,У:76"},
    {"name":"Плов со свининой","calories":840,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"рис 150 г, свинина 200 г, морковь 2 шт., лук 1 шт., масло 30 мл, чеснок 3 зубчика, специи","recipe":"1. Мясо нарезать и обжарить в казане 10 минут.\n2. Добавить лук и морковь, жарить 10 минут.\n3. Залить водой, тушить зирвак 40 минут.\n4. Добавить промытый рис и чеснок.\n5. Варить под крышкой 25 минут и настоять 15 минут.","bju":"Б:36,Ж:40,У:84"},
    {"name":"Запечённая курица с картофелем","calories":850,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"куриные бёдра 3 шт., картофель 400 г, чеснок 3 зубчика, масло 20 мл, паприка 5 г","recipe":"1. Картофель нарезать дольками.\n2. Бёдра натереть солью, паприкой и чесноком.\n3. Выложить в форму с картофелем, полить маслом.\n4. Запекать 80 минут при 190 °C, переворачивая.","bju":"Б:48,Ж:42,У:62"},
    {"name":"Голубцы ленивые в томатном соусе","calories":860,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"фарш 200 г, капуста 250 г, рис 80 г, лук 1 шт., томатная паста 40 г, сметана 40 г","recipe":"1. Капусту мелко нашинковать, лук нарезать.\n2. Смешать с фаршем и отварённым рисом.\n3. Сформировать котлеты, обжарить по 2 минуты с каждой стороны.\n4. Залить водой с пастой и сметаной.\n5. Тушить 60 минут.","bju":"Б:40,Ж:40,У:78"},
    {"name":"Борщ с говядиной и сметаной","calories":870,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"говядина 200 г, свёкла 1 шт., капуста 150 г, картофель 200 г, морковь 1 шт., сметана 60 г, хлеб 2 ломтика","recipe":"1. Говядину варить 90 минут, снимая пену.\n2. Свёклу, морковь и лук обжарить 10 минут.\n3. В бульон добавить картофель и капусту, варить 15 минут.\n4. Добавить зажарку и варить 10 минут.\n5. Подавать со сметаной и хлебом.","bju":"Б:44,Ж:36,У:80"},

    // ===== Дёшево, средне, лёгкое =====
    {"name":"Овсяные блины с бананом и мёдом","calories":810,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"овсяные хлопья 100 г, банан 2 шт., яйца 2 шт., молоко 150 мл, мёд 30 г, масло 10 мл","recipe":"1. Хлопья измельчить в блендере.\n2. Добавить яйца, молоко и 1 банан, взбить.\n3. Жарить тонкие блины 2 минуты с каждой стороны.\n4. Начинить нарезанным бананом и полить мёдом.","bju":"Б:28,Ж:24,У:116"},
    {"name":"Сырники с изюмом и йогуртом","calories":820,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"творог 300 г, яйцо 1 шт., мука 50 г, сахар 30 г, изюм 30 г, йогурт 100 г, масло 15 мл","recipe":"1. Творог смешать с яйцом, мукой, сахаром и изюмом.\n2. Сформировать сырники.\n3. Обжарить на масле по 4 минуты с каждой стороны.\n4. Подавать с йогуртом.","bju":"Б:50,Ж:26,У:92"},
    {"name":"Банановые оладьи с творогом","calories":830,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"банан 2 шт., мука 100 г, яйцо 1 шт., творог 150 г, молоко 80 мл, мёд 25 г, масло 10 мл","recipe":"1. Бананы размять, смешать с яйцом и молоком.\n2. Добавить муку, замесить тесто.\n3. Жарить оладьи по 3 минуты с каждой стороны.\n4. Подать с творогом и мёдом.","bju":"Б:32,Ж:20,У:132"},
    {"name":"Рисовая каша с тыквой и курагой","calories":840,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"рис 130 г, тыква 250 г, молоко 400 мл, курага 50 г, масло 15 г, сахар 25 г","recipe":"1. Тыкву нарезать мелкими кубиками.\n2. Рис с молоком довести до кипения.\n3. Добавить тыкву и курагу, варить 30 минут.\n4. Добавить масло и сахар, настоять 5 минут.","bju":"Б:22,Ж:24,У:138"},
    {"name":"Фруктовые вареники с вишней","calories":850,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"мука 200 г, вишня без косточек 250 г, сахар 50 г, яйцо 1 шт., сметана 60 г","recipe":"1. Замесить тесто из муки, яйца и 80 мл воды, отдохнуть 15 минут.\n2. Раскатать и вырезать кружки.\n3. Выложить вишню с сахаром, защипнуть.\n4. Варить 5 минут после всплытия.\n5. Подавать со сметаной.","bju":"Б:24,Ж:20,У:150"},
    {"name":"Манник с яблоками","calories":860,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"манка 150 г, кефир 250 мл, яйца 2 шт., сахар 100 г, яблоки 250 г, масло 30 г","recipe":"1. Манку замочить в кефире на 20 минут.\n2. Добавить яйца, сахар и масло, перемешать.\n3. Яблоки нарезать и добавить в тесто.\n4. Выпекать 40 минут при 180 °C.","bju":"Б:26,Ж:26,У:130"},

    // ===== Дёшево, средне, сытное =====
    {"name":"Макароны по-флотски","calories":820,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"макароны 160 г, фарш 200 г, лук 1 шт., масло 15 мл, томатная паста 20 г","recipe":"1. Лук мелко нарезать, обжарить 5 минут.\n2. Добавить фарш и жарить 15 минут.\n3. Добавить томатную пасту.\n4. Макароны сварить 9 минут, смешать с фаршем.","bju":"Б:42,Ж:36,У:80"},
    {"name":"Картофельная запеканка с фаршем","calories":830,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"картофель 400 г, фарш 200 г, лук 1 шт., сыр 50 г, молоко 80 мл, масло 15 г","recipe":"1. Картофель сварить и сделать пюре с молоком и маслом.\n2. Фарш с луком обжарить 12 минут.\n3. В форму выложить половину пюре, фарш, затем остальное пюре.\n4. Посыпать сыром и запекать 25 минут при 190 °C.","bju":"Б:44,Ж:38,У:78"},
    {"name":"Куриный суп с лапшой и яйцом","calories":840,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"курица 250 г, лапша 100 г, картофель 200 г, морковь 1 шт., яйца 2 шт., хлеб 2 ломтика","recipe":"1. Курицу варить 25 минут.\n2. Добавить картофель и морковь, варить 15 минут.\n3. Добавить лапшу и варить 7 минут.\n4. Яйца сварить отдельно и добавить в тарелку.","bju":"Б:56,Ж:28,U:82"},
    {"name":"Котлеты с пюре","calories":850,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"фарш 220 г, лук 1 шт., хлеб 30 г, картофель 350 г, молоко 80 мл, масло 20 г","recipe":"1. Фарш смешать с луком, хлебом, замоченным в молоке, солью.\n2. Сформировать котлеты, жарить по 6 минут с каждой стороны.\n3. Картофель сварить 20 минут, сделать пюре с маслом.\n4. Подавать вместе.","bju":"Б:42,Ж:42,У:68"},
    {"name":"Ленивые вареники с маслом","calories":860,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"творог 350 г, мука 100 г, яйцо 1 шт., сахар 30 г, масло сливочное 25 г, сметана 50 г","recipe":"1. Творог смешать с яйцом, мукой и сахаром.\n2. Раскатать колбаски и нарезать кусочки.\n3. Варить 4 минуты после всплытия.\n4. Подавать с маслом и сметаной.","bju":"Б:54,Ж:36,У:82"},
    {"name":"Гуляш из свинины с гречкой","calories":870,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"свинина 200 г, гречка 100 г, лук 1 шт., томатная паста 30 г, мука 10 г, масло 10 мл","recipe":"1. Мясо нарезать и обжарить 10 минут.\n2. Добавить лук, пасту, муку и 200 мл воды.\n3. Тушить 35 минут.\n4. Гречку сварить 15 минут и подавать с гуляшом.","bju":"Б:46,Ж:40,У:78"},

    // ===== Средне, быстро, лёгкое =====
    {"name":"Боул с лососем, рисом и огурцом","calories":810,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"лосось 150 г, рис варёный 200 г, огурец 1 шт., нори 1 лист, соевый соус 20 мл, кунжут 10 г","recipe":"1. Рис выложить в миску.\n2. Лосось обжарить 3 минуты с каждой стороны.\n3. Огурец нарезать, нори измельчить.\n4. Собрать боул, полить соусом, посыпать кунжутом.","bju":"Б:42,Ж:34,У:80"},
    {"name":"Греческий салат с хлебом и сыром","calories":820,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"фета 120 г, помидоры 2 шт., огурец 1 шт., маслины 40 г, оливковое масло 30 мл, хлеб 2 ломтика","recipe":"1. Овощи нарезать крупными кусками.\n2. Добавить маслины и фету кубиками.\n3. Заправить маслом и солью.\n4. Подавать с хлебом.","bju":"Б:24,Ж:56,У:52"},
    {"name":"Салат с тунцом, фасолью и яйцом","calories":830,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"тунец консервированный 150 г, фасоль 150 г, яйца 2 шт., лук красный 0.5 шт., оливковое масло 30 мл, хлеб 2 ломтика","recipe":"1. Яйца сварить 9 минут.\n2. Смешать тунец с фасолью и луком.\n3. Добавить яйца и масло.\n4. Подавать с хлебом.","bju":"Б:58,Ж:38,У:52"},
    {"name":"Тарелка хумуса с питой и овощами","calories":840,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"хумус 200 г, пита 2 шт., огурец 1 шт., морковь 1 шт., оливки 40 г, оливковое масло 20 мл","recipe":"1. Овощи нарезать брусками.\n2. Питу подогреть 1 минуту.\n3. Хумус выложить на тарелку, полить маслом.\n4. Подать с овощами и оливками.","bju":"Б:28,Ж:42,У:88"},
    {"name":"Креветки с авокадо и рисом","calories":850,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"креветки 150 г, авокадо 1 шт., рис варёный 200 г, лайм 0.5 шт., масло 10 мл, соевый соус 15 мл","recipe":"1. Креветки обжарить 3 минуты.\n2. Авокадо нарезать ломтиками.\n3. Рис выложить в миску.\n4. Добавить креветки, авокадо, сок лайма и соус.","bju":"Б:38,Ж:38,У:84"},
    {"name":"Йогуртовая чаша с ягодами, орехами и гранолой","calories":860,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"греческий йогурт 300 г, ягоды 150 г, гранола 80 г, миндаль 30 г, мёд 25 г, банан 1 шт.","recipe":"1. Йогурт выложить в глубокую миску.\n2. Банан нарезать, ягоды промыть.\n3. Добавить гранолу, орехи и фрукты.\n4. Полить мёдом.","bju":"Б:38,Ж:34,У:96"},

    // ===== Средне, быстро, сытное =====
    {"name":"Стейк из курицы с картофельным пюре","calories":820,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"куриное филе 250 г, картофельное пюре 300 г, сливочное масло 15 г, оливковое масло 10 мл, зелень 10 г","recipe":"1. Филе разрезать вдоль на два пласта и отбить.\n2. Обжарить по 5 минут с каждой стороны.\n3. Пюре подогреть, добавить масло.\n4. Подавать с зеленью.","bju":"Б:62,Ж:34,У:62"},
    {"name":"Паста карбонара","calories":830,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"спагетти 150 г, бекон 80 г, яйца 2 шт., пармезан 40 г, чеснок 1 зубчик, перец","recipe":"1. Спагетти сварить 9 минут.\n2. Бекон обжарить 5 минут с чесноком.\n3. Яйца смешать с пармезаном.\n4. Соединить пасту с беконом и снять с огня.\n5. Добавить яичную смесь и перемешать.","bju":"Б:42,Ж:36,У:86"},
    {"name":"Бургер с говяжьей котлетой и сыром","calories":840,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"булочка 1 шт., говяжий фарш 180 г, сыр 40 г, помидор 1 шт., салат 20 г, соус 20 г","recipe":"1. Из фарша сформировать котлету, посолить.\n2. Жарить по 4 минуты с каждой стороны, добавить сыр.\n3. Булочку подрумянить.\n4. Собрать бургер с овощами и соусом.","bju":"Б:46,Ж:42,У:58"},
    {"name":"Лосось на сковороде с кускусом","calories":850,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"лосось 200 г, кускус 120 г, сливочное масло 15 г, лимон 0.5 шт., оливковое масло 15 мл","recipe":"1. Кускус залить кипятком, накрыть на 5 минут.\n2. Лосось посолить и жарить 4 минуты с каждой стороны.\n3. Добавить масло и лимонный сок.\n4. Подавать с кускусом.","bju":"Б:52,Ж:40,У:58"},
    {"name":"Лапша удон с курицей и овощами","calories":860,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"лапша удон 200 г, куриное филе 150 г, перец болгарский 1 шт., морковь 1 шт., соевый соус 30 мл, масло 15 мл","recipe":"1. Курицу нарезать полосками и обжарить 5 минут.\n2. Добавить овощи, жарить 4 минуты.\n3. Добавить лапшу и соус.\n4. Прогреть 3 минуты.","bju":"Б:48,Ж:26,У:106"},
    {"name":"Кесадилья с курицей и сыром","calories":870,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"тортильи 2 шт., куриное филе 150 г, сыр 80 г, перец 1 шт., сметана 40 г, масло 10 мл","recipe":"1. Курицу нарезать и обжарить 6 минут.\n2. Выложить на тортилью с перцем и сыром.\n3. Накрыть второй тортильей.\n4. Жарить по 3 минуты с каждой стороны.\n5. Подавать со сметаной.","bju":"Б:56,Ж:38,У:68"},

    // ===== Средне, медленно, лёгкое =====
    {"name":"Запечённая форель с картофелем и овощами","calories":810,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"форель 250 г, картофель 300 г, кабачок 150 г, лимон 0.5 шт., оливковое масло 20 мл","recipe":"1. Картофель и кабачок нарезать, выложить в форму.\n2. Запекать картофель 30 минут при 200 °C.\n3. Добавить рыбу с лимоном и маслом.\n4. Запекать ещё 25 минут.\n5. Дать отдохнуть 10 минут.","bju":"Б:52,Ж:34,У:62"},
    {"name":"Тушёные овощи с индейкой и рисом","calories":820,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"индейка 200 г, рис 100 г, кабачок 200 г, баклажан 150 г, помидоры 2 шт., масло 20 мл","recipe":"1. Индейку нарезать и обжарить 8 минут.\n2. Добавить нарезанные овощи.\n3. Тушить под крышкой 70 минут на слабом огне.\n4. Рис сварить 18 минут и подать с овощами.","bju":"Б:50,Ж:28,У:90"},
    {"name":"Рыбный суп с картофелем и сливками","calories":830,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"красная рыба 200 г, картофель 250 г, морковь 1 шт., сливки 100 мл, лук 1 шт., хлеб 2 ломтика","recipe":"1. Из рыбьих костей сварить бульон 40 минут.\n2. Добавить картофель, морковь и лук, варить 25 минут.\n3. Добавить кусочки рыбы, варить 10 минут.\n4. Влить сливки и настоять 15 минут.","bju":"Б:46,Ж:34,У:76"},
    {"name":"Печёный батат с нутом и йогуртом","calories":840,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"батат 400 г, нут варёный 200 г, йогурт 100 г, оливковое масло 25 мл, паприка 3 г, зелень 10 г","recipe":"1. Батат разрезать пополам.\n2. Запекать 55 минут при 200 °C.\n3. Нут обжарить 5 минут со специями.\n4. Выложить нут на батат, добавить йогурт и зелень.","bju":"Б:28,Ж:30,У:114"},
    {"name":"Овощное рагу с фасолью и сыром","calories":850,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"фасоль 200 г, кабачок 200 г, перец 1 шт., помидоры 3 шт., сыр 70 г, оливковое масло 25 мл","recipe":"1. Овощи нарезать крупно.\n2. Обжарить 10 минут.\n3. Добавить фасоль и помидоры.\n4. Тушить 70 минут.\n5. Посыпать сыром и дать растаять.","bju":"Б:38,Ж:38,У:78"},
    {"name":"Запечённая треска с булгуром","calories":860,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"треска 250 г, булгур 130 г, помидоры черри 150 г, оливковое масло 25 мл, лимон 0.5 шт.","recipe":"1. Булгур запарить в кипятке 25 минут.\n2. Треску выложить в форму с черри и лимоном.\n3. Запекать 40 минут при 190 °C.\n4. Подавать с булгуром.","bju":"Б:56,Ж:28,У:84"},

    // ===== Средне, медленно, сытное =====
    {"name":"Говядина, тушёная с овощами","calories":820,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"говядина 250 г, картофель 250 г, морковь 1 шт., лук 1 шт., томатная паста 30 г, масло 15 мл","recipe":"1. Говядину нарезать кубиками и обжарить 10 минут.\n2. Добавить лук и морковь.\n3. Влить воду и пасту, тушить 90 минут.\n4. Добавить картофель и тушить ещё 30 минут.","bju":"Б:56,Ж:34,У:62"},
    {"name":"Лазанья с мясным соусом","calories":840,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"листы лазаньи 100 г, фарш 180 г, молоко 300 мл, мука 25 г, сыр 80 г, томатный соус 100 г","recipe":"1. Фарш тушить с соусом 30 минут.\n2. Приготовить бешамель из молока, муки и масла.\n3. Собрать слои: листы, фарш, бешамель.\n4. Запекать 45 минут при 190 °C.\n5. Отдохнуть 15 минут.","bju":"Б:48,Ж:42,У:68"},
    {"name":"Свиные рёбрышки с картофелем","calories":850,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"свиные рёбра 350 г, картофель 300 г, мёд 15 г, соевый соус 30 мл, чеснок 3 зубчика","recipe":"1. Рёбра замариновать в соусе, мёде и чесноке на 40 минут.\n2. Картофель нарезать и уложить в форму.\n3. Сверху выложить рёбра.\n4. Запекать 90 минут при 180 °C.","bju":"Б:48,Ж:50,У:56"},
    {"name":"Плов с курицей и барбарисом","calories":860,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"курица 250 г, рис 150 г, морковь 2 шт., лук 1 шт., барбарис 10 г, масло 30 мл","recipe":"1. Курицу обжарить 10 минут.\n2. Добавить лук и морковь, жарить 10 минут.\n3. Залить водой и тушить 30 минут.\n4. Добавить рис и барбарис.\n5. Готовить под крышкой 30 минут и настоять 20 минут.","bju":"Б:48,Ж:34,У:90"},
    {"name":"Картофельный гратен с курицей","calories":870,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"картофель 400 г, куриное филе 200 г, сливки 150 мл, сыр 70 г, чеснок 2 зубчика, масло 10 г","recipe":"1. Картофель нарезать тонкими слайсами.\n2. Курицу нарезать и обжарить 5 минут.\n3. Выложить слоями в форму, заливая сливками с чесноком.\n4. Посыпать сыром.\n5. Запекать 70 минут при 180 °C.","bju":"Б:56,Ж:42,У:58"},
    {"name":"Харчо из говядины","calories":880,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"говядина 250 г, рис 70 г, лук 2 шт., томатная паста 40 г, грецкие орехи 30 г, чеснок 3 зубчика, специи","recipe":"1. Говядину варить 90 минут.\n2. Лук обжарить с томатной пастой 8 минут.\n3. Добавить зажарку и рис в бульон, варить 20 минут.\n4. Добавить орехи, чеснок, специи.\n5. Настоять 15 минут.","bju":"Б:58,Ж:38,У:62"},

    // ===== Средне, средне, лёгкое =====
    {"name":"Куриные рулетики со шпинатом и киноа","calories":810,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"куриное филе 250 г, шпинат 100 г, сыр 40 г, киноа 120 г, оливковое масло 20 мл","recipe":"1. Филе разрезать, отбить.\n2. Выложить шпинат и сыр, свернуть рулет.\n3. Запекать 30 минут при 190 °C.\n4. Киноа сварить 15 минут и подать с рулетом.","bju":"Б:66,Ж:28,У:66"},
    {"name":"Лосось с овощами в духовке","calories":820,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"лосось 220 г, брокколи 200 г, картофель 200 г, масло 20 мл, лимон 0.5 шт.","recipe":"1. Картофель нарезать и запекать 15 минут при 200 °C.\n2. Добавить брокколи и лосось.\n3. Полить маслом и лимонным соком.\n4. Запекать 20 минут.","bju":"Б:52,Ж:40,У:56"},
    {"name":"Салат с курицей, киноа и фетой","calories":830,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"курица 180 г, киноа 120 г, фета 70 г, огурец 1 шт., помидоры 2 шт., оливковое масло 30 мл","recipe":"1. Киноа сварить 15 минут и остудить.\n2. Курицу сварить 20 минут и нарезать.\n3. Овощи нарезать.\n4. Всё смешать, заправить маслом.","bju":"Б:56,Ж:38,У:62"},
    {"name":"Фаршированные кабачки с индейкой и рисом","calories":840,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"кабачки 2 шт., индейка фарш 200 г, рис 80 г, сыр 50 г, помидор 1 шт., масло 15 мл","recipe":"1. Кабачки разрезать, вынуть мякоть.\n2. Смешать фарш, рис, мякоть и помидор.\n3. Начинить кабачки, посыпать сыром.\n4. Запекать 40 минут при 190 °C.","bju":"Б:56,Ж:32,У:68"},
    {"name":"Тортилья с тунцом, фасолью и сыром","calories":850,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"тортильи 2 шт., тунец 150 г, фасоль 120 г, сыр 60 г, огурец 1 шт., йогурт 40 г","recipe":"1. Тунец смешать с фасолью и йогуртом.\n2. Выложить на тортильи с огурцом.\n3. Свернуть и посыпать сыром.\n4. Запекать 10 минут при 190 °C.","bju":"Б:58,Ж:30,У:80"},
    {"name":"Рыбные тефтели с рисом и овощами","calories":860,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"филе рыбы 250 г, рис 100 г, морковь 1 шт., лук 1 шт., яйцо 1 шт., масло 20 мл","recipe":"1. Рыбу измельчить с луком, добавить яйцо.\n2. Сформировать тефтели.\n3. Обжарить 3 минуты и тушить с морковью 20 минут.\n4. Рис сварить 18 минут и подать.","bju":"Б:56,Ж:28,У:88"},

    // ===== Средне, средне, сытное =====
    {"name":"Курица в сливочном соусе с макаронами","calories":820,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"куриное филе 220 г, макароны 130 г, сливки 120 мл, сыр 40 г, чеснок 2 зубчика, масло 10 г","recipe":"1. Макароны сварить 9 минут.\n2. Курицу нарезать и обжарить 8 минут.\n3. Добавить чеснок и сливки, варить 10 минут.\n4. Добавить сыр и макароны, смешать.","bju":"Б:58,Ж:36,У:66"},
    {"name":"Шницель из свинины с картофелем","calories":830,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"свинина 220 г, панировочные сухари 40 г, яйцо 1 шт., картофель 300 г, масло 30 мл","recipe":"1. Мясо отбить, обмакнуть в яйце и сухарях.\n2. Жарить по 5 минут с каждой стороны.\n3. Картофель запечь или отварить 20 минут.\n4. Подавать вместе.","bju":"Б:50,Ж:40,У:62"},
    {"name":"Ризотто с грибами и курицей","calories":840,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"рис арборио 120 г, шампиньоны 150 г, курица 150 г, пармезан 40 г, бульон 500 мл, масло 20 г","recipe":"1. Грибы и курицу обжарить 10 минут.\n2. Добавить рис и жарить 2 минуты.\n3. Подливать горячий бульон по половнику, мешая 20 минут.\n4. Добавить пармезан и масло.","bju":"Б:48,Ж:30,У:92"},
    {"name":"Голубцы в томатном соусе","calories":850,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"капустные листья 5 шт., фарш 200 г, рис 70 г, лук 1 шт., томатный соус 150 г, сметана 40 г","recipe":"1. Капустные листья опустить в кипяток на 5 минут.\n2. Смешать фарш, рис и лук.\n3. Завернуть голубцы.\n4. Залить соусом и тушить 40 минут.","bju":"Б:42,Ж:38,У:76"},
    {"name":"Паста с фрикадельками в томатном соусе","calories":860,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"спагетти 150 г, фарш 200 г, томатный соус 150 г, сыр 30 г, яйцо 1 шт., лук 1 шт.","recipe":"1. Фарш смешать с яйцом, луком, сформировать шарики.\n2. Обжарить 6 минут.\n3. Тушить в соусе 15 минут.\n4. Спагетти сварить 9 минут и подать с сыром.","bju":"Б:50,Ж:34,У:90"},
    {"name":"Жаркое из говядины с картофелем","calories":870,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"говядина 220 г, картофель 350 г, лук 1 шт., морковь 1 шт., масло 20 мл, сметана 40 г","recipe":"1. Мясо нарезать и обжарить 10 минут.\n2. Добавить лук и морковь.\n3. Добавить картофель, воду и сметану.\n4. Тушить 45 минут.","bju":"Б:52,Ж:38,У:66"},

    // ===== Дорого, быстро, лёгкое =====
    {"name":"Стейк тунца с авокадо и рисом","calories":810,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"стейк тунца 200 г, авокадо 1 шт., рис 180 г варёный, соевый соус 20 мл, кунжут 10 г","recipe":"1. Тунец обжарить по 2 минуты с каждой стороны.\n2. Авокадо нарезать.\n3. Рис выложить в миску.\n4. Добавить тунец, авокадо, соус и кунжут.","bju":"Б:56,Ж:34,У:62"},
    {"name":"Тартар из лосося с авокадо и тостами","calories":820,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"филе лосося 180 г, авокадо 1 шт., хлеб 2 ломтика, лайм 0.5 шт., оливковое масло 20 мл, каперсы 10 г","recipe":"1. Лосось мелко нарезать.\n2. Авокадо нарезать кубиками.\n3. Смешать с лаймом, маслом и каперсами.\n4. Подавать на подсушенном хлебе.","bju":"Б:42,Ж:52,У:42"},
    {"name":"Салат с креветками, авокадо и киноа","calories":830,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"креветки 180 г, авокадо 1 шт., киноа 120 г, черри 100 г, оливковое масло 25 мл, лимон 0.5 шт.","recipe":"1. Киноа отварить 15 минут (можно заранее).\n2. Креветки обжарить 3 минуты.\n3. Авокадо и помидоры нарезать.\n4. Всё смешать с маслом и лимонным соком.","bju":"Б:46,Ж:44,У:52"},
    {"name":"Сашими-боул с лососем и манго","calories":840,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"лосось 180 г, рис 180 г варёный, манго 100 г, авокадо 0.5 шт., соевый соус 20 мл, кунжут 10 г","recipe":"1. Рис выложить в миску.\n2. Лосось и манго нарезать кубиками.\n3. Авокадо нарезать ломтиками.\n4. Собрать боул, полить соусом, посыпать кунжутом.","bju":"Б:44,Ж:36,У:84"},
    {"name":"Ролл с угрём и огурцом","calories":850,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"угорь копчёный 120 г, рис для суши 220 г варёный, нори 2 листа, огурец 1 шт., соус унаги 20 мл","recipe":"1. Нори положить на коврик, распределить рис.\n2. Выложить угря и огурец.\n3. Плотно свернуть и нарезать на 8 частей.\n4. Полить соусом.","bju":"Б:34,Ж:30,У:106"},
    {"name":"Тосты с красной икрой и творожным сыром","calories":860,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"хлеб 4 ломтика, красная икра 60 г, творожный сыр 100 г, масло сливочное 20 г, огурец 1 шт.","recipe":"1. Хлеб подсушить в тостере.\n2. Намазать маслом и творожным сыром.\n3. Сверху выложить икру.\n4. Подавать с огурцом.","bju":"Б:34,Ж:46,У:62"},

    // ===== Дорого, быстро, сытное =====
    {"name":"Стейк рибай с жареным картофелем","calories":820,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"стейк рибай 250 г, картофель 250 г, масло сливочное 15 г, чеснок 2 зубчика, розмарин 2 г","recipe":"1. Стейк достать за 15 минут до жарки.\n2. Обжарить по 3–4 минуты с каждой стороны.\n3. Добавить масло, чеснок и розмарин, поливать.\n4. Картофель отдельно обжарить 10 минут. Стейк отдохнёт 5 минут.","bju":"Б:56,Ж:50,У:34"},
    {"name":"Паста с креветками в сливочном соусе","calories":830,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"паста 150 г, креветки 180 г, сливки 120 мл, чеснок 2 зубчика, пармезан 30 г, масло 15 г","recipe":"1. Пасту сварить 9 минут.\n2. Креветки обжарить 3 минуты с чесноком.\n3. Влить сливки, варить 4 минуты.\n4. Добавить пасту и пармезан.","bju":"Б:48,Ж:36,У:82"},
    {"name":"Ягнёнок отбивные с кускусом","calories":840,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"ягнёнок карре 250 г, кускус 120 г, масло 15 мл, чеснок 2 зубчика, мята 5 г","recipe":"1. Отбивные посолить и обмазать чесноком.\n2. Жарить по 4 минуты с каждой стороны.\n3. Кускус запарить 5 минут.\n4. Подавать с мятой.","bju":"Б:50,Ж:42,У:56"},
    {"name":"Лосось терияки с рисом","calories":850,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"лосось 220 г, рис 180 г варёный, соус терияки 40 мл, кунжут 10 г, масло 10 мл","recipe":"1. Лосось обжарить 4 минуты с каждой стороны.\n2. Влить соус терияки и glaze 2 минуты.\n3. Рис выложить на тарелку.\n4. Сверху рыба, кунжут.","bju":"Б:48,Ж:36,У:82"},
    {"name":"Бризоль с грибами и сыром","calories":860,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"говяжья вырезка 220 г, яйца 2 шт., шампиньоны 100 г, сыр 60 г, масло 20 мл","recipe":"1. Говядину нарезать тонко и отбить.\n2. Обмакнуть в яйце и обжарить 3 минуты.\n3. Добавить грибы и сыр.\n4. Накрыть крышкой на 3 минуты.","bju":"Б:62,Ж:48,У:12"},
    {"name":"Фетучини с лососем и сливками","calories":870,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"фетучини 150 г, лосось 180 г, сливки 120 мл, шпинат 50 г, пармезан 30 г","recipe":"1. Пасту сварить 9 минут.\n2. Лосось нарезать и обжарить 4 минуты.\n3. Влить сливки, добавить шпинат.\n4. Смешать с пастой и пармезаном.","bju":"Б:50,Ж:38,У:80"},

    {"name":"Запечённая дорада с овощами","calories":810,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"дорада 350 г, картофель 250 г, помидоры черри 100 г, оливковое масло 30 мл, лимон 0.5 шт.","recipe":"1. Рыбу очистить, посолить, наполнить лимоном.\n2. Картофель нарезать и запекать 25 минут.\n3. Добавить рыбу и черри.\n4. Запекать 40 минут при 190 °C.\n5. Отдохнуть 10 минут.","bju":"Б:54,Ж:34,У:62"},
    {"name":"Телятина тушёная с овощами","calories":820,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"телятина 250 г, цукини 150 г, морковь 1 шт., картофель 200 г, вино 50 мл, масло 20 мл","recipe":"1. Телятину обжарить 10 минут.\n2. Влить вино, дать выпариться.\n3. Добавить овощи и воды.\n4. Тушить 100 минут на слабом огне.","bju":"Б:52,Ж:30,У:68"},
    {"name":"Лосось су-вид с пюре из батата","calories":830,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"лосось 220 г, батат 350 г, масло 20 г, лимон 0.5 шт., укроп 5 г","recipe":"1. Лосось запечатать в пакете с маслом и лимоном.\n2. Готовить 60 минут при 52 °C.\n3. Батат запечь 55 минут.\n4. Сделать пюре, подать с лососем.","bju":"Б:50,Ж:36,У:70"},
    {"name":"Утиная грудка с яблоками и картофелем","calories":840,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"утиная грудка 220 г, яблоки 2 шт., картофель 250 г, мёд 15 г, тимьян 2 г","recipe":"1. На коже грудки сделать надрезы.\n2. Обжарить кожей вниз 10 минут.\n3. Запекать с яблоками 25 минут при 190 °C.\n4. Картофель запечь 50 минут.\n5. Дать мясу отдохнуть 10 минут.","bju":"Б:42,Ж:44,У:72"},
    {"name":"Морской окунь с рисом и овощами на пару","calories":850,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"морской окунь 250 г, рис 120 г, брокколи 150 г, соевый соус 20 мл, имбирь 5 г","recipe":"1. Рыбу замариновать с имбирём на 30 минут.\n2. Рис замочить на 30 минут.\n3. Рис сварить 20 минут.\n4. Рыбу и брокколи готовить на пару 25 минут.","bju":"Б:56,Ж:28,У:84"},
    {"name":"Курица в красном вине с картофелем","calories":860,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"куриные бёдра 300 г, красное вино 100 мл, картофель 250 г, морковь 1 шт., лук 1 шт.","recipe":"1. Курицу замариновать в вине на 60 минут.\n2. Обжарить 10 минут.\n3. Добавить овощи и маринад.\n4. Тушить 60 минут.","bju":"Б:52,Ж:38,У:62"},

    {"name":"Говяжьи щёки в вине с пюре","calories":820,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"говяжьи щёки 300 г, красное вино 150 мл, картофель 300 г, морковь 1 шт., лук 1 шт., масло 20 г","recipe":"1. Щёки обжарить 10 минут.\n2. Добавить лук, морковь и вино.\n3. Тушить 3 часа при 150 °C.\n4. Картофель сварить 20 минут и сделать пюре.\n5. Подавать вместе.","bju":"Б:54,Ж:40,У:56"},
    {"name":"Рулька запечённая с капустой","calories":830,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"свиная рулька 400 г, квашеная капуста 200 г, горчица 20 г, чеснок 3 зубчика, пиво 100 мл","recipe":"1. Рульку натереть горчицей и чесноком.\n2. Залить пивом.\n3. Запекать 2,5 часа при 170 °C.\n4. Капусту потушить 30 минут и подать.","bju":"Б:58,Ж:52,У:20"},

    {"name":"Бефстроганов с картофельным пюре","calories":860,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"говяжья вырезка 250 г, шампиньоны 100 г, сметана 80 г, лук 1 шт., картофель 300 г, масло 20 г","recipe":"1. Мясо нарезать брусочками и быстро обжарить.\n2. Добавить лук, грибы и сметану.\n3. Тушить 90 минут на слабом огне.\n4. Подавать с пюре.","bju":"Б:56,Ж:42,У:56"},
    {"name":"Тушёная баранина с овощами и рисом","calories":870,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"баранина 300 г, рис 100 г, баклажан 150 г, перец 1 шт., помидоры 2 шт., масло 20 мл","recipe":"1. Баранину обжарить 10 минут.\n2. Добавить овощи.\n3. Тушить 120 минут.\n4. Рис сварить 18 минут и подать.","bju":"Б:56,Ж:40,У:62"},

    {"name":"Стейк из говядины с картофельным гратеном","calories":820,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"говяжий стейк 220 г, картофель 250 г, сливки 100 мл, сыр 40 г, чеснок 1 зубчик","recipe":"1. Картофель нарезать слайсами.\n2. Уложить в форму, залить сливками с чесноком.\n3. Посыпать сыром и запекать 40 минут при 180 °C.\n4. Стейк обжарить по 4 минуты.","bju":"Б:56,Ж:44,У:42"},

    {"name":"Лосось в сливочном соусе с пастой","calories":840,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"лосось 200 г, паста 130 г, сливки 120 мл, шпинат 50 г, сыр 30 г, чеснок 1 зубчик","recipe":"1. Пасту сварить 10 минут.\n2. Лосось обжарить 8 минут.\n3. Добавить сливки, шпинат и чеснок, варить 8 минут.\n4. Смешать с пастой и сыром.","bju":"Б:52,Ж:38,У:70"},

    {"name":"Ньокки с грибами и пармезаном","calories":860,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"ньокки 250 г, белые грибы 150 г, сливки 120 мл, пармезан 40 г, масло 15 г","recipe":"1. Грибы обжарить 10 минут.\n2. Влить сливки, варить 8 минут.\n3. Ньокки отварить 3 минуты после всплытия.\n4. Смешать с соусом и пармезаном.","bju":"Б:30,Ж:42,У:88"},
    {"name":"Ягнёнок с картофелем и розмарином","calories":870,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"ягнёнок карре 280 г, картофель 300 г, розмарин 3 г, чеснок 3 зубчика, масло 20 мл","recipe":"1. Мясо обмазать чесноком и розмарином.\n2. Картофель нарезать дольками.\n3. Выложить в форму и запекать 40 минут при 200 °C.\n4. Дать отдохнуть 10 минут.","bju":"Б:56,Ж:44,У:54"},

    {"name":"Банановый смузи с овсянкой и арахисовой пастой","calories":900,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"банан 2 шт. (250 г), овсяные хлопья 60 г, арахисовая паста 40 г, молоко 300 мл","recipe":"1. Все ингредиенты положить в блендер.\n2. Взбить 1 минуту.\n3. Подавать сразу.","bju":"Б:33,Ж:35,У:115"},
    {"name":"Салат из риса с кукурузой и яйцом","calories":940,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"рис варёный 300 г, кукуруза 100 г, яйца 3 шт., майонез 40 г, зелёный лук 20 г","recipe":"1. Яйца сварить вкрутую (10 мин), нарезать.\n2. Смешать с рисом и кукурузой.\n3. Заправить майонезом, посыпать луком.","bju":"Б:30,Ж:50,У:95"},

    {"name":"Яичница с картофелем и салом","calories":980,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"картофель варёный 350 г, яйца 3 шт., сало 50 г, лук 50 г","recipe":"1. Сало растопить, добавить картофель и лук.\n2. Жарить 6 минут.\n3. Залить яйцами и довести до готовности.","bju":"Б:30,Ж:62,У:60"},
