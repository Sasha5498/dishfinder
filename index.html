    {"name":"Говядина тушёная с картофелем","calories":490,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"говядина 140 г, картофель 200 г, лук 60 г, морковь 50 г, томатная паста 15 г, масло 10 г","recipe":"1. Мясо нарезать кусками, обжарить 10 минут.\n2. Добавить лук, морковь и томатную пасту.\n3. Залить водой и тушить 70 минут.\n4. Добавить картофель и тушить 30 минут.","bju":"Б:34,Ж:23,У:36"},
    {"name":"Лазанья с фаршем","calories":500,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"листы лазаньи 50 г, фарш 100 г, томаты в с.с. 100 г, молоко 150 мл, мука 12 г, масло 10 г, сыр 30 г","recipe":"1. Фарш тушить с томатами 25 минут.\n2. Приготовить бешамель из масла, муки и молока.\n3. Собрать слоями: листы, фарш, соус.\n4. Посыпать сыром и запекать при 190 °C 40 минут.","bju":"Б:28,Ж:24,У:42"},
    {"name":"Свиные рёбрышки с картофелем","calories":500,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"свиные рёбра 180 г, картофель 200 г, чеснок 5 г, паприка, масло 5 г","recipe":"1. Рёбра натереть солью, паприкой и чесноком.\n2. Выложить в форму с дольками картофеля.\n3. Накрыть фольгой, запекать при 180 °C 60 минут.\n4. Снять фольгу и запекать ещё 20 минут.","bju":"Б:28,Ж:30,У:30"},
    {"name":"Куриные ножки в сливочном соусе с рисом","calories":500,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"куриные ножки 200 г, сливки 10% 80 мл, лук 40 г, рис 55 г (сухой), масло 8 г","recipe":"1. Ножки обжарить до золотистого цвета 10 минут.\n2. Добавить лук, залить сливками и 100 мл воды.\n3. Тушить под крышкой 50 минут.\n4. Подать с отварным рисом.","bju":"Б:30,Ж:23,У:44"},
    {"name":"Мясной рулет с яйцом и пюре","calories":490,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"фарш 130 г, яйцо 1 шт., лук 30 г, хлеб 20 г, картофель 150 г, молоко 30 мл","recipe":"1. Фарш смешать с луком, размоченным хлебом, солью.\n2. Раскатать пласт, в центр положить яйцо.\n3. Завернуть рулетом.\n4. Запекать при 180 °C 55 минут.\n5. Картофель отварить, сделать пюре, подать с рулетом.","bju":"Б:32,Ж:25,У:34"},
    {"name":"Плов с бараниной","calories":500,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"баранина 100 г, рис 80 г (сухой), морковь 90 г, лук 60 г, масло 10 г, зира, чеснок 5 г","recipe":"1. Мясо обжарить в казане 10 минут.\n2. Добавить лук и морковь, жарить 10 минут.\n3. Залить водой, варить зирвак 40 минут.\n4. Добавить рис, чеснок, зиру, воду на 1 см выше риса.\n5. Томить 30 минут под крышкой.","bju":"Б:26,Ж:19,У:56"},


    {"name":"Куриное филе в йогурте с булгуром","calories":430,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"куриное филе 150 г, йогурт натуральный 50 г, булгур 60 г (сухой), чеснок 5 г, специи, масло 5 г","recipe":"1. Филе замариновать в йогурте с чесноком и специями на 20 минут.\n2. Булгур отварить 12 минут.\n3. Курицу запекать при 200 °C 25 минут.\n4. Подать с булгуром.","bju":"Б:38,Ж:13,У:40"},
    {"name":"Лосось с картофелем и брокколи","calories":450,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"лосось 120 г, картофель 120 г, брокколи 120 г, масло оливковое 8 г, лимон","recipe":"1. Картофель разрезать на дольки, запекать 15 минут при 200 °C.\n2. Добавить брокколи и лосося, посолить.\n3. Запекать ещё 15 минут.\n4. Сбрызнуть лимоном.","bju":"Б:32,Ж:22,У:30"},
    {"name":"Индейка с цветной капустой и рисом","calories":420,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"филе индейки 150 г, цветная капуста 150 г, рис 55 г (сухой), масло 8 г, специи","recipe":"1. Рис отварить 15 минут.\n2. Индейку нарезать кусочками и обжарить 8 минут.\n3. Добавить соцветия капусты и 50 мл воды.\n4. Тушить 15 минут.","bju":"Б:36,Ж:13,У:40"},
    {"name":"Рыбный суп с сёмгой","calories":400,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"сёмга 130 г, картофель 120 г, морковь 50 г, лук 40 г, сливки 10% 50 мл, укроп","recipe":"1. Овощи нарезать и варить в 500 мл воды 15 минут.\n2. Добавить кубики сёмги и варить 8 минут.\n3. Влить сливки, прогреть 2 минуты.\n4. Добавить укроп.","bju":"Б:30,Ж:20,У:24"},
    {"name":"Боул с курицей и нутом","calories":440,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"куриное филе 120 г, нут варёный 100 г, огурец 80 г, помидор 80 г, масло оливковое 8 г, йогурт 30 г","recipe":"1. Курицу запечь или обжарить 15 минут и нарезать.\n2. Овощи нарезать кубиками.\n3. Всё выложить в миску с нутом.\n4. Заправить йогуртом с маслом.","bju":"Б:36,Ж:13,У:44"},
    {"name":"Кабачковые лодочки с фаршем","calories":410,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"кабачок 300 г, фарш индейки 120 г, лук 40 г, сыр 30 г, томат 60 г","recipe":"1. Кабачок разрезать, вынуть мякоть.\n2. Мякоть обжарить с луком и фаршем 10 минут.\n3. Нафаршировать лодочки.\n4. Посыпать сыром, запекать 30 минут при 190 °C.","bju":"Б:30,Ж:22,У:22"},


    {"name":"Куриные рулеты с сыром и ветчиной, пюре","calories":500,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"куриное филе 150 г, ветчина 30 г, сыр 30 г, картофель 150 г, молоко 30 мл, масло 8 г","recipe":"1. Филе разрезать и отбить в пласт.\n2. Выложить ветчину и сыр, свернуть рулетом.\n3. Запекать при 190 °C 30 минут.\n4. Картофель отварить, сделать пюре и подать.","bju":"Б:38,Ж:25,У:30"},
    {"name":"Фрикадельки в сливочном соусе с пастой","calories":500,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"фарш 100 г, лук 30 г, паста 70 г (сухая), сливки 10% 80 мл, масло 8 г","recipe":"1. Фарш смешать с луком, скатать шарики.\n2. Обжарить 6 минут.\n3. Залить сливками, тушить 12 минут.\n4. Подать с отварной пастой.","bju":"Б:28,Ж:20,У:52"},
    {"name":"Запечённая свинина с картофелем","calories":500,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"свинина 130 г, картофель 200 г, лук 50 г, чеснок 5 г, масло 8 г, специи","recipe":"1. Свинину нарезать пластами и слегка отбить.\n2. Картофель и лук нарезать.\n3. Всё выложить в форму, добавить специи и масло.\n4. Запекать при 190 °C 45 минут.","bju":"Б:30,Ж:28,У:32"},
    {"name":"Котлеты по-киевски с гречкой","calories":490,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"куриное филе 140 г, масло сливочное 15 г, зелень, панировка 20 г, яйцо 0,5 шт., гречка 55 г (сухая)","recipe":"1. Филе отбить, в центр положить замороженное масло с зеленью.\n2. Завернуть, обмакнуть в яйцо и панировку.\n3. Запекать при 200 °C 25 минут.\n4. Подать с гречкой.","bju":"Б:30,Ж:24,У:38"},
    {"name":"Жульен с курицей и грибами","calories":470,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"куриное филе 100 г, шампиньоны 100 г, сливки 10% 60 мл, сыр 30 г, лук 40 г, хлеб 40 г","recipe":"1. Курицу и грибы нарезать, обжарить с луком 12 минут.\n2. Влить сливки и тушить 5 минут.\n3. Выложить в формочки, посыпать сыром.\n4. Запекать 15 минут при 190 °C, подать с хлебом.","bju":"Б:30,Ж:26,У:28"},
    {"name":"Сёмга в сливках с рисом","calories":500,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"сёмга 140 г, сливки 20% 70 мл, рис 60 г (сухой), укроп, лимон, масло 5 г","recipe":"1. Рис отварить 15 минут.\n2. Сёмгу обжарить по 3 минуты с каждой стороны.\n3. Влить сливки, тушить 8 минут.\n4. Подать с рисом, лимоном и укропом.","bju":"Б:30,Ж:22,У:46"},


    {"name":"Креветки гриль с авокадо и салатом","calories":420,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"тигровые креветки 150 г, авокадо 100 г, салат микс 60 г, масло оливковое 10 г, лайм","recipe":"1. Креветки обжарить на гриле или сковороде по 2 минуты с каждой стороны.\n2. Авокадо нарезать дольками.\n3. Выложить на салат.\n4. Заправить маслом и лаймом.","bju":"Б:34,Ж:25,У:14"},
    {"name":"Стейк тунца с рисом","calories":450,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"филе тунца 140 г, рис 200 г (варёный), соевый соус 10 мл, кунжут 5 г, масло 5 г","recipe":"1. Тунца обсушить, посолить.\n2. Обжарить на раскалённой сковороде по 1,5 минуты с каждой стороны.\n3. Нарезать ломтиками.\n4. Подать с рисом, соусом и кунжутом.","bju":"Б:40,Ж:14,У:42"},
    {"name":"Тост с авокадо и лососем","calories":460,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"хлеб зерновой 70 г, авокадо 80 г, слабосолёный лосось 60 г, лимон, яйцо 1 шт.","recipe":"1. Хлеб поджарить.\n2. Авокадо размять с лимонным соком и солью.\n3. Намазать на тост, сверху выложить лосось.\n4. Подать с яйцом пашот или варёным.","bju":"Б:28,Ж:24,У:32"},
    {"name":"Салат с морским гребешком и киноа","calories":410,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"гребешки 120 г, киноа варёная 120 г, рукола 40 г, помидоры черри 80 г, масло оливковое 8 г","recipe":"1. Гребешки обсушить и обжарить по 1,5 минуты с каждой стороны.\n2. Смешать киноа, руколу и черри.\n3. Сверху выложить гребешки.\n4. Заправить маслом и лимонным соком.","bju":"Б:30,Ж:16,У:36"},
    {"name":"Карпаччо из говядины с руколой","calories":400,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"говяжья вырезка 120 г, рукола 40 г, пармезан 20 г, масло оливковое 12 г, хлеб 40 г, лимон","recipe":"1. Мясо заморозить на 30 минут и нарезать тончайшими ломтиками.\n2. Выложить на тарелку.\n3. Добавить руколу и стружку пармезана.\n4. Полить маслом и лимоном, подать с хлебом.","bju":"Б:32,Ж:20,У:24"},
    {"name":"Тартар из лосося с авокадо","calories":430,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"свежий лосось 130 г, авокадо 80 г, огурец 40 г, лимонный сок, соевый соус 5 мл, хлебцы 30 г","recipe":"1. Лосось нарезать мелкими кубиками.\n2. Авокадо и огурец нарезать так же.\n3. Смешать с лимонным соком и соевым соусом.\n4. Выложить кольцом и подать с хлебцами.","bju":"Б:30,Ж:29,У:12"},


    {"name":"Стейк рибай с картофелем","calories":500,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"говядина рибай 130 г, картофель 200 г, масло сливочное 10 г, розмарин, соль","recipe":"1. Картофель нарезать дольками и обжарить 12 минут.\n2. Стейк посолить и поперчить.\n3. Жарить по 3 минуты с каждой стороны на сильном огне.\n4. Добавить масло и розмарин, дать отдохнуть 3 минуты.","bju":"Б:38,Ж:26,У:28"},
    {"name":"Паста с креветками в сливочном соусе","calories":500,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"паста 75 г (сухая), креветки 120 г, сливки 20% 60 мл, чеснок 5 г, масло 8 г","recipe":"1. Пасту отварить 9 минут.\n2. На масле обжарить чеснок и креветки 3 минуты.\n3. Влить сливки, греть 3 минуты.\n4. Смешать с пастой.","bju":"Б:28,Ж:19,У:54"},
    {"name":"Филе-миньон с картофельным пюре","calories":490,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"говяжья вырезка 130 г, картофель 170 г, молоко 40 мл, масло сливочное 10 г","recipe":"1. Картофель сварить 12 минут и сделать пюре с молоком.\n2. Вырезку посолить и обжарить по 3 минуты с каждой стороны.\n3. Добавить масло, поливать мясо.\n4. Подать с пюре.","bju":"Б:40,Ж:25,У:26"},
    {"name":"Ризотто с морепродуктами","calories":480,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"рис арборио 65 г, морской коктейль 120 г, лук 30 г, бульон 250 мл, пармезан 15 г, масло 8 г","recipe":"1. Лук обжарить 2 минуты, добавить рис и жарить 1 минуту.\n2. Постепенно подливать горячий бульон, помешивая 15 минут.\n3. Добавить морепродукты, готовить 4 минуты.\n4. Добавить пармезан.","bju":"Б:26,Ж:16,У:58"},
    {"name":"Лосось терияки с рисом","calories":490,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"лосось 130 г, рис варёный 200 г, соус терияки 20 мл, кунжут 5 г, масло 5 г","recipe":"1. Лосось обжарить по 3 минуты с каждой стороны.\n2. Влить соус терияки и карамелизировать 2 минуты.\n3. Подать на рисе, посыпав кунжутом.","bju":"Б:34,Ж:17,У:50"},
    {"name":"Паста с трюфельной пастой и пармезаном","calories":490,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"тальятелле 80 г (сухие), трюфельная паста 15 г, сливки 20% 50 мл, пармезан 25 г, масло 8 г","recipe":"1. Тальятелле отварить 5 минут.\n2. Растопить масло, добавить сливки и трюфельную пасту.\n3. Смешать с пастой.\n4. Посыпать пармезаном.","bju":"Б:20,Ж:21,У:56"},


    {"name":"Запечённая дорада с овощами","calories":410,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"дорада целая 250 г (около 180 г мяса), картофель 100 г, помидоры черри 80 г, лимон, масло оливковое 10 г, травы","recipe":"1. Дораду очистить, посолить, начинить лимоном и травами.\n2. Выложить на противень с дольками картофеля и черри.\n3. Полить маслом.\n4. Запекать при 200 °C 40 минут.","bju":"Б:40,Ж:19,У:20"},
    {"name":"Утиная грудка с яблоками","calories":450,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"утиная грудка 150 г, яблоко 120 г, мёд 5 г, тимьян, листья салата 40 г","recipe":"1. Кожу утки надрезать решёткой, посолить.\n2. Жарить кожей вниз 8 минут на слабом огне, затем 4 минуты с другой стороны.\n3. Довести в духовке при 180 °C 15 минут.\n4. Яблоко запечь с мёдом 25 минут и подать с салатом.","bju":"Б:36,Ж:24,У:22"},
    {"name":"Осьминог с картофелем и овощами","calories":420,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"осьминог 200 г, картофель 120 г, болгарский перец 60 г, масло оливковое 10 г, паприка, лимон","recipe":"1. Осьминога варить 60 минут до мягкости.\n2. Картофель отварить 20 минут.\n3. Осьминога обжарить 3 минуты с каждой стороны.\n4. Подать с картофелем, перцем, маслом, паприкой и лимоном.","bju":"Б:38,Ж:17,У:28"},
    {"name":"Телятина тушёная с овощами","calories":430,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"телятина 170 г, морковь 70 г, лук 50 г, сельдерей 50 г, томаты 100 г, масло 8 г","recipe":"1. Телятину нарезать кубиками, обжарить 8 минут.\n2. Добавить нарезанные овощи и томаты.\n3. Залить 100 мл воды.\n4. Тушить под крышкой 90 минут на слабом огне.","bju":"Б:42,Ж:20,У:20"},
    {"name":"Запечённая форель со спаржей и киноа","calories":440,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"форель 160 г, спаржа 100 г, киноа 60 г (сухая), лимон, масло оливковое 8 г","recipe":"1. Форель посолить и сбрызнуть лимоном.\n2. Спаржу выложить рядом на противень, полить маслом.\n3. Запекать при 190 °C 35 минут.\n4. Киноа отварить 12 минут и подать.","bju":"Б:38,Ж:19,У:30"},
    {"name":"Тушёный кролик в вине с овощами","calories":430,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"кролик 200 г, вино белое сухое 50 мл, лук 50 г, морковь 60 г, чеснок 5 г, масло 8 г","recipe":"1. Кролика нарезать кусками и обжарить 10 минут.\n2. Добавить лук, морковь и чеснок.\n3. Влить вино и выпарить 5 минут.\n4. Добавить 100 мл воды и тушить 80 минут.","bju":"Б:40,Ж:23,У:16"},


    {"name":"Говяжьи щёчки с картофельным пюре","calories":500,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"говяжьи щёчки 150 г, морковь 50 г, лук 50 г, красное вино 50 мл, картофель 150 г, масло 10 г","recipe":"1. Щёчки обжарить со всех сторон 8 минут.\n2. Добавить овощи, вино и 150 мл воды.\n3. Тушить 3 часа на слабом огне или в духовке при 150 °C.\n4. Подать с пюре из картофеля.","bju":"Б:38,Ж:25,У:30"},
    {"name":"Баранья ножка с картофелем","calories":500,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"баранина на кости 200 г, картофель 180 г, чеснок 8 г, розмарин, масло оливковое 8 г","recipe":"1. Мясо натереть солью, чесноком и розмарином.\n2. Выложить на противень с картофелем.\n3. Запекать при 160 °C 2 часа, накрыв фольгой.\n4. Снять фольгу и румянить 15 минут.","bju":"Б:36,Ж:27,У:28"},
    {"name":"Утиная ножка конфи с картофелем","calories":500,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"утиная ножка 200 г, картофель 130 г, чеснок 5 г, тимьян, соль","recipe":"1. Ножку натереть солью, чесноком и тимьяном на 2 часа.\n2. Запекать при 140 °C 2,5 часа под фольгой.\n3. Картофель нарезать и запечь рядом на вытопленном жире 40 минут.\n4. Повысить температуру до 200 °C на 10 минут для корочки.","bju":"Б:30,Ж:32,У:24"},
    {"name":"Оссобуко","calories":490,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"телячья голяшка 220 г, томаты в с.с. 100 г, морковь 50 г, лук 50 г, вино белое 50 мл, мука 10 г, масло 8 г","recipe":"1. Голяшку обвалять в муке и обжарить 10 минут.\n2. Добавить овощи, вино и томаты.\n3. Тушить под крышкой 2,5 часа.\n4. Подать с соусом.","bju":"Б:38,Ж:24,У:30"},
    {"name":"Говядина по-бургундски","calories":490,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"говядина 150 г, красное вино 100 мл, бекон 20 г, шампиньоны 80 г, лук 50 г, морковь 50 г, мука 10 г","recipe":"1. Говядину замариновать в вине на 4 часа.\n2. Обжарить бекон, мясо, лук и морковь.\n3. Добавить вино, муку и воды до покрытия.\n4. Тушить 2,5 часа, добавить грибы за 20 минут до конца.","bju":"Б:36,Ж:28,У:24"},
    {"name":"Свиная вырезка в беконе с картофелем","calories":500,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"свиная вырезка 150 г, бекон 30 г, картофель 180 г, масло 8 г, чеснок 5 г, розмарин","recipe":"1. Вырезку посолить, обернуть беконом.\n2. Обжарить со всех сторон 8 минут.\n3. Запекать с картофелем при 180 °C 50 минут.\n4. Дать мясу отдохнуть 10 минут.","bju":"Б:36,Ж:27,У:28"},


    {"name":"Стейк из тунца с овощами гриль и рисом","calories":430,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"тунец 140 г, цукини 100 г, перец 80 г, рис 55 г (сухой), масло оливковое 8 г","recipe":"1. Овощи нарезать и обжарить на гриле 10 минут.\n2. Рис отварить 15 минут.\n3. Тунца обжарить по 2 минуты с каждой стороны.\n4. Подать вместе.","bju":"Б:42,Ж:14,У:34"},
    {"name":"Сибас с овощами на пару и кускусом","calories":420,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"филе сибаса 160 г, брокколи 100 г, морковь 60 г, кускус 50 г (сухой), лимон, масло 8 г","recipe":"1. Овощи и рыбу выложить в пароварку.\n2. Готовить 15 минут.\n3. Кускус залить кипятком на 5 минут.\n4. Подать с лимоном и маслом.","bju":"Б:36,Ж:14,У:38"},
    {"name":"Лосось со спаржей и картофелем","calories":450,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"лосось 130 г, спаржа 100 г, картофель 120 г, масло оливковое 8 г, лимон","recipe":"1. Картофель нарезать и запекать 15 минут при 200 °C.\n2. Добавить лосось и спаржу, полить маслом.\n3. Запекать 15 минут.\n4. Сбрызнуть лимоном.","bju":"Б:36,Ж:22,У:28"},
    {"name":"Креветки с киноа и овощами карри","calories":410,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"креветки 150 г, киноа 60 г (сухая), кабачок 80 г, перец 60 г, кокосовое молоко 40 мл, карри 3 г","recipe":"1. Киноа сварить 12 минут.\n2. Овощи обжарить 5 минут.\n3. Добавить кокосовое молоко и карри, затем креветки.\n4. Тушить 5 минут, подать с киноа.","bju":"Б:32,Ж:14,У:40"},
    {"name":"Запечённая перепёлка с овощами","calories":430,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"перепёлка 1 тушка (150 г мяса), картофель 100 г, морковь 60 г, лук 40 г, масло 8 г, специи","recipe":"1. Перепёлку натереть солью и специями.\n2. Выложить на противень с овощами.\n3. Запекать при 200 °C 40 минут.\n4. Поливать выделившимся соком.","bju":"Б:38,Ж:23,У:18"},
    {"name":"Телятина с грибами и гречкой","calories":440,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"телятина 140 г, шампиньоны 100 г, лук 40 г, гречка 60 г (сухая), масло 8 г","recipe":"1. Телятину нарезать полосками, обжарить 8 минут.\n2. Добавить лук и грибы, жарить 8 минут.\n3. Тушить 15 минут под крышкой.\n4. Подать с отварной гречкой.","bju":"Б:38,Ж:16,У:36"},


    {"name":"Лосось в сливочном соусе с пастой","calories":500,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"лосось 120 г, паста 70 г (сухая), сливки 20% 60 мл, чеснок 5 г, укроп, масло 5 г","recipe":"1. Пасту отварить 9 минут.\n2. Лосось нарезать кубиками и обжарить 4 минуты.\n3. Влить сливки, греть 5 минут.\n4. Смешать с пастой и укропом.","bju":"Б:34,Ж:21,У:44"},
    {"name":"Стейк говяжий с картофелем гратен","calories":500,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"говяжий стейк 120 г, картофель 150 г, сливки 10% 50 мл, сыр 20 г, чеснок 3 г","recipe":"1. Картофель нарезать тонкими кружками, уложить в форму.\n2. Залить сливками с чесноком, посыпать сыром.\n3. Запекать при 190 °C 35 минут.\n4. Стейк обжарить по 3 минуты с каждой стороны и подать.","bju":"Б:38,Ж:26,У:28"},
    {"name":"Утка с апельсиновым соусом и рисом","calories":500,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"утиная грудка 140 г, апельсин 100 г, мёд 8 г, рис 55 г (сухой), соевый соус 5 мл","recipe":"1. Грудку обжарить кожей вниз 8 минут, перевернуть и жарить 4 минуты.\n2. Запечь 10 минут при 180 °C.\n3. Апельсиновый сок уварить с мёдом и соевым соусом 8 минут.\n4. Подать с рисом.","bju":"Б:30,Ж:24,У:40"},
    {"name":"Ризотто с белыми грибами и пармезаном","calories":480,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"рис арборио 70 г, белые грибы 100 г, лук 30 г, бульон 300 мл, пармезан 20 г, масло 10 г","recipe":"1. Грибы обжарить 6 минут.\n2. Лук и рис обжарить 2 минуты.\n3. Подливать бульон по половнику, помешивая, 18 минут.\n4. Добавить грибы, пармезан и масло.","bju":"Б:16,Ж:19,У:62"},
    {"name":"Бефстроганов с картофельным пюре","calories":500,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"говяжья вырезка 120 г, лук 40 г, сметана 40 г, горчица 5 г, картофель 170 г, молоко 30 мл","recipe":"1. Говядину нарезать брусочками и обжарить 4 минуты.\n2. Добавить лук и жарить 5 минут.\n3. Влить сметану с горчицей, тушить 8 минут.\n4. Подать с пюре.","bju":"Б:34,Ж:24,У:36"},
    {"name":"Креветки и гребешки в сливках с рисом","calories":490,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"креветки 80 г, гребешки 80 г, сливки 20% 60 мл, рис 60 г (сухой), чеснок 5 г, масло 8 г","recipe":"1. Рис отварить 15 минут.\n2. Обжарить чеснок и морепродукты 4 минуты.\n3. Влить сливки, греть 5 минут.\n4. Подать с рисом.","bju":"Б:32,Ж:18,У:50"},


    {"name":"Банановый смузи с овсянкой и арахисовой пастой","calories":538,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"банан 2 шт., овсянка 40 г, арахисовая паста 30 г, молоко 250 мл","recipe":"1. Бананы очистить и нарезать.\n2. Сложить в блендер с овсянкой, пастой и молоком.\n3. Взбить 1 минуту до однородности.\n4. Подавать сразу.","bju":"Б:17,Ж:22,У:68"},
    {"name":"Тосты с арахисовой пастой и бананом","calories":528,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"хлеб 3 ломтика (90 г), арахисовая паста 35 г, банан 1 шт., мёд 10 г","recipe":"1. Хлеб подсушить в тостере.\n2. Намазать арахисовой пастой.\n3. Сверху выложить кружочки банана.\n4. Polить мёдом.","bju":"Б:16,Ж:24,У:62"},
    {"name":"Овсянка на молоке с изюмом и орехами","calories":540,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"овсяные хлопья 70 г, молоко 250 мл, изюм 30 г, грецкие орехи 20 г, мёд 10 г","recipe":"1. Хлопья залить молоком, довести до кипения.\n2. Варить 5 минут на слабом огне, помешивая.\n3. Добавить изюм, поварить 1 минуту.\n4. Посыпать орехами, полить мёдом.","bju":"Б:18,Ж:20,У:72"},
    {"name":"Творог с бананом, мёдом и гранолой","calories":538,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"творог 5% 200 г, банан 1 шт., гранола 50 г, мёд 15 г, арахис 15 г","recipe":"1. Творог выложить в миску.\n2. Банан нарезать кружочками.\n3. Добавить гранолу и арахис.\n4. Полить мёдом.","bju":"Б:32,Ж:18,У:62"},
    {"name":"Йогурт с гранолой и ягодами","calories":528,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"йогурт натуральный 250 г, гранола 80 г, замороженные ягоды 100 г, мёд 10 г","recipe":"1. Ягоды разморозить.\n2. В стакан слоями выложить йогурт, гранолу, ягоды.\n3. Сверху полить мёдом.","bju":"Б:15,Ж:20,У:72"},
    {"name":"Банановые панкейки из овсянки","calories":522,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"банан 2 шт., овсяные хлопья 60 г, яйцо 2 шт., мёд 15 г, масло растительное 5 г","recipe":"1. Бананы размять вилкой, смешать с яйцами и измельчёнными хлопьями.\n2. На сковороде с маслом выпекать небольшие оладьи по 2 минуты с каждой стороны.\n3. Подавать с мёдом.","bju":"Б:20,Ж:18,У:70"},

    {"name":"Яичница с колбасой и хлебом","calories":536,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"яйца 3 шт., варёная колбаса 80 г, хлеб 60 г, масло растительное 10 г","recipe":"1. Колбасу нарезать кубиками, обжарить 2 минуты.\n2. Вбить яйца, посолить.\n3. Жарить под крышкой 4 минуты.\n4. Подавать с хлебом.","bju":"Б:28,Ж:32,У:34"},
    {"name":"Макароны с сыром","calories":548,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"макароны 90 г (сухих), сыр твёрдый 50 г, сливочное масло 10 г, молоко 50 мл","recipe":"1. Макароны отварить 9 минут в подсоленной воде.\n2. Слить воду, добавить масло и молоко.\n3. Посыпать тёртым сыром, перемешать до расплавления.","bju":"Б:22,Ж:20,У:70"},
    {"name":"Омлет с сыром и ветчиной","calories":510,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"яйца 3 шт., ветчина 50 г, сыр 40 г, молоко 50 мл, хлеб 40 г, масло 5 г","recipe":"1. Яйца взбить с молоком и солью.\n2. Ветчину нарезать, выложить на сковороду с маслом.\n3. Залить яйцами, посыпать сыром.\n4. Готовить под крышкой 5 минут, подавать с хлебом.","bju":"Б:32,Ж:30,У:28"},
    {"name":"Гречка с сосисками","calories":570,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"гречка быстрого приготовления 80 г, сосиски 2 шт. (120 г), сливочное масло 10 г","recipe":"1. Гречку залить кипятком, накрыть на 10 минут (по упаковке).\n2. Сосиски отварить или обжарить 5 минут.\n3. Добавить масло к гречке, подавать с сосисками.","bju":"Б:24,Ж:26,У:60"},
    {"name":"Бутерброды с тунцом и яйцом","calories":518,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"хлеб 100 г, тунец консервированный 100 г, яйцо варёное 2 шт., майонез 15 г","recipe":"1. Яйца сварить вкрутую (10 минут), остудить.\n2. Смешать тунец, нарезанные яйца и майонез.\n3. Намазать на хлеб.","bju":"Б:34,Ж:24,У:42"},
    {"name":"Жареный рис с яйцом и овощами","calories":550,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"варёный рис 250 г, яйца 2 шт., замороженная овощная смесь 100 г, соевый соус 15 мл, масло 10 г","recipe":"1. Овощи обжарить 4 минуты на масле.\n2. Добавить рис, прогреть.\n3. Сдвинуть в сторону, вбить яйца, перемешать.\n4. Добавить соевый соус.","bju":"Б:20,Ж:22,У:68"},

    {"name":"Запечённые яблоки с орехами и мёдом","calories":518,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"яблоки 3 шт. (500 г), грецкие орехи 40 г, мёд 30 г, изюм 30 г, корица 2 г","recipe":"1. Из яблок вынуть сердцевину.\n2. Смешать орехи, мёд, изюм, корицу и начинить яблоки.\n3. Запекать при 180°C 60-70 минут.\n4. Подавать тёплыми.","bju":"Б:8,Ж:22,У:72"},
    {"name":"Рисовая молочная каша с тыквой","calories":530,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"рис 70 г, тыква 150 г, молоко 400 мл, сахар 15 г, сливочное масло 10 г","recipe":"1. Тыкву нарезать кубиками, отварить 15 минут.\n2. Добавить рис и молоко.\n3. Томить на слабом огне 50-60 минут, помешивая.\n4. Добавить сахар и масло.","bju":"Б:14,Ж:18,У:78"},
    {"name":"Домашнее овсяное печенье с бананом","calories":518,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"овсяные хлопья 100 г, банан 2 шт., мука 40 г, масло сливочное 30 г, сахар 20 г","recipe":"1. Бананы размять, смешать с остальными ингредиентами.\n2. Сформировать 8 печений.\n3. Выпекать при 180°C 20 минут.\n4. Остудить на решётке (всего около 1,5 часов с остыванием).","bju":"Б:10,Ж:22,У:70"},
    {"name":"Манник на кефире","calories":522,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"манка 100 г, кефир 200 мл, яйцо 2 шт., сахар 50 г, мука 40 г, масло 15 г","recipe":"1. Манку залить кефиром на 30 минут.\n2. Добавить яйца, сахар, муку, разрыхлитель.\n3. Вылить в форму, выпекать 40 минут при 180°C.\n4. Остудить.","bju":"Б:14,Ж:18,У:76"},
    {"name":"Банановый хлеб","calories":516,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"банан 3 шт., мука 120 г, яйцо 1 шт., сахар 40 г, масло 30 г, грецкие орехи 20 г","recipe":"1. Бананы размять, смешать с яйцом, сахаром, маслом.\n2. Добавить муку и разрыхлитель, орехи.\n3. Выпекать в форме при 175°C 50-60 минут.\n4. Остудить, нарезать (порция — 1/2 небольшого кекса).","bju":"Б:10,Ж:20,У:74"},
    {"name":"Шарлотка с яблоками","calories":530,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"яблоки 300 г, яйца 3 шт., сахар 80 г, мука 100 г, сливочное масло 15 г","recipe":"1. Яйца взбить с сахаром 10 минут до густой пены.\n2. Подмешать муку.\n3. Яблоки нарезать, выложить в смазанную форму, залить тестом.\n4. Выпекать 40 минут при 180°C, остудить (всего около 1,5 часа).","bju":"Б:12,Ж:18,У:80"},

    {"name":"Тушёная картошка с куриными бёдрами","calories":520,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"куриные бёдра 200 г, картофель 300 г, лук 1 шт., морковь 1 шт., вода 300 мл","recipe":"1. Курицу обжарить до корочки 8 минут.\n2. Добавить лук и морковь, обжарить 5 минут.\n3. Добавить картофель и воду.\n4. Тушить под крышкой 60 минут.","bju":"Б:34,Ж:24,У:42"},
    {"name":"Плов с курицей","calories":564,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"рис 90 г, куриное филе 150 г, морковь 100 г, лук 60 г, масло 15 г, чеснок 1 зубчик","recipe":"1. Мясо обжарить с луком и морковью 10 минут.\n2. Добавить специи и воду, тушить 30 минут.\n3. Всыпать промытый рис, залить водой на 1 см выше.\n4. Готовить под крышкой 30 минут, дать настояться.","bju":"Б:30,Ж:20,У:66"},
    {"name":"Ленивые голубцы в томатном соусе","calories":528,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"фарш свино-говяжий 150 г, капуста 200 г, рис варёный 60 г, лук 50 г, томатная паста 30 г, сметана 20 г","recipe":"1. Капусту мелко нашинковать, смешать с фаршем, рисом, луком.\n2. Сформировать котлеты, уложить в форму.\n3. Залить водой с томатной пастой.\n4. Тушить или запекать 60-70 минут.","bju":"Б:28,Ж:24,У:50"},
    {"name":"Гороховый суп с копчёностями","calories":558,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"горох 100 г, копчёные рёбрышки 100 г, картофель 150 г, морковь 50 г, лук 50 г, вода 600 мл","recipe":"1. Горох замочить на 3 часа.\n2. Варить с рёбрышками 60 минут.\n3. Добавить картофель, морковь, лук.\n4. Варить ещё 25 минут, посолить.","bju":"Б:32,Ж:22,У:58"},
    {"name":"Тушёная капуста с мясом и картофелем","calories":530,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"свинина 150 г, капуста 250 г, картофель 150 г, лук 50 г, томатная паста 20 г","recipe":"1. Мясо обжарить 10 минут.\n2. Добавить лук, капусту, томатную пасту.\n3. Тушить 40 минут.\n4. Добавить картофель, тушить ещё 25 минут.","bju":"Б:30,Ж:26,У:44"},
    {"name":"Макароны по-флотски запечённые","calories":576,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"макароны 100 г, фарш 150 г, лук 50 г, сыр 30 г, масло 10 г","recipe":"1. Макароны отварить до полуготовности.\n2. Фарш обжарить с луком 15 минут.\n3. Смешать, выложить в форму, посыпать сыром.\n4. Запекать 30 минут при 190°C (с подготовкой — более часа).","bju":"Б:32,Ж:24,У:58"},

    {"name":"Сырники со сметаной и вареньем","calories":522,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"творог 200 г, яйцо 1 шт., мука 40 г, сахар 15 г, сметана 30 г, варенье 30 г, масло 10 г","recipe":"1. Творог смешать с яйцом, сахаром и мукой.\n2. Сформировать 5 сырников.\n3. Обжарить по 4 минуты с каждой стороны.\n4. Подавать со сметаной и вареньем.","bju":"Б:28,Ж:18,У:62"},
    {"name":"Овсяные оладьи с яблоком","calories":512,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"овсяные хлопья 80 г, кефир 150 мл, яблоко 1 шт., яйцо 1 шт., мёд 20 г, масло 10 г","recipe":"1. Хлопья залить кефиром на 20 минут.\n2. Добавить яйцо и тёртое яблоко.\n3. Жарить оладьи по 3 минуты с каждой стороны.\n4. Подавать с мёдом.","bju":"Б:16,Ж:16,У:76"},
    {"name":"Рисовая каша с сухофруктами","calories":518,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"рис 80 г, молоко 300 мл, курага 30 г, изюм 30 г, сахар 15 г, масло 10 г","recipe":"1. Рис залить молоком и водой, довести до кипения.\n2. Варить 25 минут на слабом огне.\n3. Добавить сухофрукты, сахар, масло.\n4. Томить ещё 5 минут.","bju":"Б:12,Ж:14,У:86"},
    {"name":"Драники со сметаной","calories":530,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"картофель 350 г, яйцо 1 шт., мука 20 г, лук 30 г, сметана 40 г, масло 20 г","recipe":"1. Картофель и лук натереть, отжать сок.\n2. Добавить яйцо, муку, соль.\n3. Жарить лепёшки по 4 минуты с каждой стороны.\n4. Подавать со сметаной.","bju":"Б:12,Ж:26,У:62"},
    {"name":"Блины с творогом","calories":522,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"мука 70 г, молоко 150 мл, яйцо 1 шт., творог 120 г, сахар 20 г, масло 10 г","recipe":"1. Замесить жидкое тесто из муки, молока, яйца.\n2. Испечь 4 тонких блина.\n3. Творог смешать с сахаром, завернуть в блины.\n4. Обжарить до румяности.","bju":"Б:24,Ж:18,У:66"},
    {"name":"Творожная запеканка с манкой","calories":521,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"творог 250 г, манка 30 г, яйцо 1 шт., сахар 30 г, сметана 30 г, изюм 20 г","recipe":"1. Смешать творог, манку, яйцо, сахар, изюм.\n2. Выложить в форму, смазать сметаной.\n3. Запекать 35 минут при 180°C.","bju":"Б:30,Ж:17,У:62"},

    {"name":"Борщ со сметаной и хлебом","calories":520,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"говядина 100 г, свёкла 80 г, капуста 100 г, картофель 100 г, морковь 40 г, лук 40 г, сметана 30 г, хлеб 50 г","recipe":"1. Мясо отварить 30 минут (или взять готовый бульон).\n2. Добавить картофель и капусту, варить 10 минут.\n3. Обжарить свёклу, лук, морковь, добавить в суп.\n4. Варить 10 минут, подавать со сметаной.","bju":"Б:24,Ж:24,У:52"},
    {"name":"Котлеты с картофельным пюре","calories":540,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"фарш 150 г, хлеб 20 г, лук 30 г, картофель 250 г, молоко 50 мл, масло 10 г","recipe":"1. Фарш смешать с луком и размоченным хлебом, сформировать котлеты.\n2. Обжарить по 5 минут с каждой стороны.\n3. Картофель отварить 20 минут, размять с молоком и маслом.","bju":"Б:30,Ж:28,У:42"},
    {"name":"Гречка с куриной печенью","calories":564,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"гречка 90 г, куриная печень 200 г, лук 60 г, морковь 40 г, сметана 30 г","recipe":"1. Гречку отварить 20 минут.\n2. Печень обжарить с луком и морковью 10 минут.\n3. Добавить сметану, тушить 5 минут.\n4. Подавать вместе.","bju":"Б:38,Ж:20,У:58"},
    {"name":"Рис с тушёной курицей и овощами","calories":570,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"рис 90 г, куриное филе 150 г, морковь 60 г, лук 50 г, болгарский перец 60 г, масло 10 г","recipe":"1. Рис отварить 15 минут.\n2. Курицу и овощи нарезать, тушить 20 минут.\n3. Подавать с рисом.","bju":"Б:36,Ж:18,У:66"},
    {"name":"Картофельная запеканка с фаршем","calories":530,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"картофель 300 г, фарш 120 г, лук 50 г, молоко 50 мл, сыр 30 г","recipe":"1. Картофель отварить, размять с молоком.\n2. Фарш обжарить с луком 10 минут.\n3. В форму слоями выложить пюре, фарш, пюре, посыпать сыром.\n4. Запекать 20 минут при 200°C.","bju":"Б:30,Ж:26,У:44"},
    {"name":"Перловка с тушёнкой","calories":566,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"перловка 90 г, тушёнка говяжья 120 г, лук 50 г, морковь 40 г","recipe":"1. Перловку замочить на 1 час (по желанию) и варить 30 минут.\n2. Лук и морковь обжарить.\n3. Добавить тушёнку, прогреть, смешать с крупой.","bju":"Б:30,Ж:22,У:62"},

    {"name":"Греческий йогурт с орехами, мёдом и фруктами","calories":514,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"греческий йогурт 250 г, миндаль 25 г, грецкие орехи 20 г, мёд 20 г, киви 1 шт., банан 1/2","recipe":"1. Йогурт выложить в миску.\n2. Фрукты нарезать.\n3. Добавить орехи и фрукты, полить мёдом.","bju":"Б:22,Ж:26,У:48"},
    {"name":"Тост с авокадо и яйцом пашот","calories":520,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"цельнозерновой хлеб 70 г, авокадо 1/2 шт., яйца 2 шт., лимонный сок 5 мл, оливковое масло 10 г","recipe":"1. Хлеб подсушить.\n2. Авокадо размять с лимонным соком и солью, намазать.\n3. Яйца сварить пашот 3 минуты в слабо кипящей воде.\n4. Выложить на тост, полить маслом.","bju":"Б:20,Ж:32,У:38"},
    {"name":"Смузи-боул с гранолой и ягодами","calories":548,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"замороженные ягоды 150 г, банан 1 шт., йогурт 100 г, гранола 50 г, семена чиа 10 г, мёд 10 г","recipe":"1. Ягоды, банан и йогурт взбить в блендере до густоты.\n2. Вылить в миску.\n3. Сверху гранола, чиа, мёд.","bju":"Б:16,Ж:20,У:76"},
    {"name":"Салат с киноа, фетой и орехами","calories":516,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"киноа варёная 150 г, фета 60 г, огурец 80 г, помидоры черри 80 г, грецкие орехи 25 г, оливковое масло 15 г","recipe":"1. Использовать готовую остывшую киноа.\n2. Овощи нарезать, фету покрошить.\n3. Смешать, заправить маслом и лимонным соком, посыпать орехами.","bju":"Б:18,Ж:28,У:48"},
    {"name":"Хумус с питой и овощами","calories":546,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"хумус 120 г, пита 80 г, огурец 80 г, морковь 60 г, болгарский перец 60 г, оливковое масло 10 г","recipe":"1. Овощи нарезать брусочками.\n2. Питу подогреть и нарезать.\n3. Хумус выложить на тарелку, полить маслом.\n4. Подавать с питой и овощами.","bju":"Б:18,Ж:26,У:60"},
    {"name":"Протеиновый смузи с ягодами и миндалём","calories":508,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"протеин 30 г, замороженные ягоды 150 г, банан 1 шт., миндальная паста 25 г, молоко 250 мл","recipe":"1. Все ингредиенты сложить в блендер.\n2. Взбить 1 минуту.\n3. Подавать охлаждённым.","bju":"Б:34,Ж:20,У:48"},

    {"name":"Паста с креветками и чесноком","calories":564,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"спагетти 90 г, креветки очищенные 150 г, чеснок 2 зубчика, оливковое масло 15 г, петрушка 5 г, лимон 1/4","recipe":"1. Спагетти отварить 9 минут.\n2. Чеснок обжарить в масле 1 минуту, добавить креветки на 3 минуты.\n3. Смешать с пастой, добавить лимонный сок и зелень.","bju":"Б:30,Ж:20,У:66"},
    {"name":"Куриный стейк с булгуром","calories":528,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"куриное филе 200 г, булгур 70 г, оливковое масло 10 г, лимон 1/4, специи","recipe":"1. Филе разрезать на тонкие стейки, посолить.\n2. Обжарить по 4 минуты с каждой стороны.\n3. Булгур залить кипятком на 10 минут.\n4. Подавать с лимоном.","bju":"Б:44,Ж:16,У:52"},
    {"name":"Лосось на сковороде с рисом","calories":552,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"филе лосося 150 г, варёный рис 200 г, масло 5 г, лимон 1/4, соевый соус 10 мл","recipe":"1. Лосось посолить, обжарить кожей вниз 5 минут.\n2. Перевернуть, жарить 3 минуты.\n3. Подавать с тёплым рисом и соевым соусом.","bju":"Б:36,Ж:24,У:48"},
    {"name":"Бурито с курицей и фасолью","calories":564,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"тортилья 1 шт. (70 г), курица варёная 120 г, фасоль консервированная 80 г, сыр 30 г, томатная сальса 40 г","recipe":"1. Курицу нарезать, смешать с фасолью и сальсой, прогреть.\n2. Выложить на тортилью, посыпать сыром.\n3. Завернуть, обжарить 1 минуту с каждой стороны.","bju":"Б:38,Ж:20,У:58"},
    {"name":"Омлет с лососем и авокадо с тостом","calories":510,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"яйца 3 шт., слабосолёный лосось 50 г, авокадо 1/4 шт., хлеб 40 г, масло 5 г","recipe":"1. Яйца взбить, вылить на сковороду с маслом.\n2. Готовить 4 минуты.\n3. Сверху лосось и авокадо, подавать с тостом.","bju":"Б:32,Ж:30,У:28"},
    {"name":"Говяжий стир-фрай с лапшой","calories":582,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"говядина 130 г, рисовая лапша 80 г, болгарский перец 80 г, морковь 40 г, соевый соус 20 мл, масло 10 г","recipe":"1. Лапшу залить кипятком на 5 минут.\n2. Говядину тонко нарезать, жарить 3 минуты на сильном огне.\n3. Добавить овощи на 3 минуты.\n4. Добавить лапшу и соус, прогреть.","bju":"Б:36,Ж:22,У:60"},

    {"name":"Морковный пирог","calories":538,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"морковь 150 г, мука 100 г, яйцо 2 шт., сахар 50 г, грецкие орехи 30 г, масло 40 г, корица 2 г","recipe":"1. Морковь натереть, смешать с яйцами, сахаром и маслом.\n2. Добавить муку, корицу, орехи.\n3. Выпекать 45 минут при 180°C, остудить (всего 1,5 часа).","bju":"Б:8,Ж:26,У:68"},
    {"name":"Лимонный кекс с маком","calories":532,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"мука 100 г, сахар 60 г, масло 50 г, яйцо 2 шт., мак 10 г, лимон 1/2 шт.","recipe":"1. Масло взбить с сахаром, добавить яйца.\n2. Добавить муку, мак, цедру и сок лимона.\n3. Выпекать 45 минут при 175°C, остудить.","bju":"Б:9,Ж:24,У:70"},
    {"name":"Панна котта с ягодами","calories":518,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"сливки 33% 120 мл, молоко 80 мл, сахар 30 г, желатин 3 г, ягодное пюре 80 г","recipe":"1. Желатин замочить.\n2. Сливки с молоком и сахаром нагреть, не кипятить, добавить желатин.\n3. Разлить по формам, охладить 4 часа.\n4. Подавать с ягодным пюре.","bju":"Б:8,Ж:30,У:54"},
    {"name":"Яблочный штрудель","calories":534,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"тесто фило 80 г, яблоки 250 г, изюм 30 г, орехи 20 г, сахар 30 г, масло 20 г","recipe":"1. Яблоки нарезать, смешать с сахаром, изюмом, орехами.\n2. Листы теста смазать маслом, выложить начинку.\n3. Свернуть рулетом, выпекать 40 минут при 190°C.","bju":"Б:8,Ж:22,У:76"},
    {"name":"Банановый пирог с шоколадом","calories":534,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"банан 2 шт., мука 90 г, шоколад 30 г, яйцо 1 шт., сахар 40 г, масло 30 г","recipe":"1. Бананы размять, смешать с яйцом, сахаром, маслом.\n2. Добавить муку и кусочки шоколада.\n3. Выпекать 50 минут при 175°C, остудить.","bju":"Б:9,Ж:26,У:66"},
    {"name":"Рисовый пудинг с миндалём и манго","calories":534,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"рис круглозёрный 60 г, молоко 300 мл, сахар 25 г, миндаль 20 г, манго 80 г","recipe":"1. Рис варить в молоке на слабом огне 50 минут, помешивая.\n2. Добавить сахар, охладить 1 час.\n3. Подавать с манго и миндалём.","bju":"Б:12,Ж:22,У:72"},

    {"name":"Запечённая курица с картофелем и розмарином","calories":562,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"куриные голени 250 г, картофель 250 г, розмарин 3 г, чеснок 2 зубчика, оливковое масло 10 г","recipe":"1. Курицу и картофель смешать с маслом, чесноком, розмарином.\n2. Выложить в форму.\n3. Запекать 60-70 минут при 200°C до золотистой корочки.","bju":"Б:42,Ж:26,У:40"},
    {"name":"Говядина, тушёная с овощами","calories":512,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"говядина 200 г, морковь 80 г, лук 60 г, сельдерей 50 г, томатная паста 20 г, картофель 100 г","recipe":"1. Говядину нарезать кубиками, обжарить 10 минут.\n2. Добавить овощи, томатную пасту и воду.\n3. Тушить 90 минут.","bju":"Б:40,Ж:24,У:34"},
    {"name":"Свиные рёбрышки с картофелем","calories":542,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"свиные рёбрышки 250 г, картофель 200 г, горчица 10 г, мёд 10 г, чеснок 2 зубчика","recipe":"1. Рёбрышки смазать горчицей, мёдом и чесноком, оставить на 30 минут.\n2. Выложить с картофелем в рукав.\n3. Запекать 90 минут при 180°C.","bju":"Б:36,Ж:30,У:32"},
    {"name":"Лазанья с мясным соусом","calories":554,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"листы лазаньи 70 г, фарш 120 г, томатный соус 80 г, молочный соус бешамель 80 г, сыр 30 г","recipe":"1. Приготовить мясной соус: фарш обжарить с томатным соусом 25 минут.\n2. Слоями выложить листы, мясо, бешамель.\n3. Посыпать сыром, запекать 40 минут при 190°C.","bju":"Б:30,Ж:26,У:50"},
    {"name":"Чахохбили с картофелем","calories":526,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"курица 250 г, помидоры 200 г, лук 80 г, картофель 100 г, кинза 10 г, чеснок 2 зубчика","recipe":"1. Курицу обжарить 10 минут.\n2. Добавить лук, помидоры, чеснок.\n3. Тушить под крышкой 60 минут.\n4. Добавить кинзу.","bju":"Б:42,Ж:22,У:40"},
    {"name":"Тушёная баранина с чечевицей","calories":552,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"баранина 180 г, чечевица 60 г, морковь 60 г, лук 50 г, томатная паста 15 г, специи","recipe":"1. Баранину обжарить с луком и морковью.\n2. Добавить томатную пасту и воду, тушить 60 минут.\n3. Добавить чечевицу, варить 30 минут.","bju":"Б:40,Ж:24,У:44"},

    {"name":"Салат с курицей, авокадо и орехами","calories":520,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"куриное филе 120 г, авокадо 1/2 шт., салатные листья 60 г, помидоры 80 г, грецкие орехи 20 г, оливковое масло 15 г","recipe":"1. Филе отварить 20 минут, остудить.\n2. Овощи и авокадо нарезать.\n3. Смешать, посыпать орехами, заправить маслом.","bju":"Б:36,Ж:32,У:22"},
    {"name":"Фриттата с овощами и сыром","calories":514,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"яйца 4 шт., цукини 100 г, помидоры 80 г, сыр 40 г, оливковое масло 10 г","recipe":"1. Овощи нарезать, обжарить 5 минут.\n2. Залить взбитыми яйцами, посыпать сыром.\n3. Готовить 5 минут на плите, затем 10 минут в духовке при 180°C.","bju":"Б:30,Ж:34,У:22"},
    {"name":"Тосты с авокадо и слабосолёным лососем","calories":526,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"хлеб цельнозерновой 80 г, авокадо 1/2 шт., лосось слабосолёный 70 г, яйцо 1 шт., лимон 1/4","recipe":"1. Яйцо сварить 8 минут.\n2. Хлеб подсушить, намазать авокадо.\n3. Сверху лосось и яйцо, лимонный сок.","bju":"Б:28,Ж:30,У:36"},
    {"name":"Сырники с ягодным соусом и орехами","calories":526,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"творог 250 г, яйцо 1 шт., мука 40 г, ягоды 100 г, сахар 20 г, миндаль 20 г","recipe":"1. Из творога, яйца, муки сформировать сырники и обжарить 8 минут.\n2. Ягоды проварить с сахаром 5 минут.\n3. Подавать с соусом и миндалём.","bju":"Б:30,Ж:22,У:52"},
    {"name":"Овсянка с миндальным молоком, ягодами и орехами","calories":544,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"овсяные хлопья 80 г, миндальное молоко 300 мл, ягоды 80 г, орехи 30 г, мёд 15 г","recipe":"1. Хлопья варить в молоке 10 минут.\n2. Выложить в миску, добавить ягоды, орехи, мёд.","bju":"Б:16,Ж:24,У:66"},
    {"name":"Запечённые баклажаны с моцареллой и орехами","calories":522,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"баклажаны 300 г, моцарелла 100 г, помидоры 100 г, кедровые орехи 20 г, оливковое масло 15 г, базилик","recipe":"1. Баклажаны разрезать вдоль, посолить, смазать маслом.\n2. Запекать 20 минут при 200°C.\n3. Добавить помидоры и моцареллу, запекать 10 минут.\n4. Посыпать орехами и базиликом.","bju":"Б:24,Ж:36,У:24"},

    {"name":"Рис с курицей терияки","calories":584,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"рис 90 г, куриное филе 160 г, соус терияки 30 мл, брокколи 80 г, кунжут 3 г","recipe":"1. Рис отварить 15 минут.\n2. Курицу нарезать, обжарить 8 минут, добавить терияки.\n3. Брокколи отварить 4 минуты.\n4. Подавать с кунжутом.","bju":"Б:38,Ж:16,У:72"},
    {"name":"Куриные котлеты с гречкой","calories":524,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"куриный фарш 180 г, лук 30 г, гречка 70 г, цукини 80 г, масло 10 г","recipe":"1. Фарш смешать с луком, сформировать котлеты.\n2. Обжарить по 5 минут с каждой стороны, довести в духовке 10 минут.\n3. Гречку отварить 20 минут, цукини обжарить.","bju":"Б:40,Ж:20,У:46"},
    {"name":"Фаршированный перец","calories":518,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"болгарский перец 2 шт., фарш 120 г, рис 40 г (сухого), лук 40 г, томатный соус 60 г","recipe":"1. Рис отварить до полуготовности.\n2. Смешать с фаршем и луком, начинить перцы.\n3. Залить соусом, тушить 40 минут.","bju":"Б:32,Ж:22,У:48"},
    {"name":"Рыбные котлеты с картофельным пюре","calories":524,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"филе белой рыбы 200 г, хлеб 20 г, лук 30 г, картофель 250 г, молоко 50 мл, масло 10 г","recipe":"1. Рыбу измельчить с луком и размоченным хлебом.\n2. Сформировать котлеты, обжарить по 5 минут с каждой стороны.\n3. Картофель отварить, сделать пюре.","bju":"Б:34,Ж:20,У:52"},
    {"name":"Ризотто с грибами","calories":584,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"рис арборио 90 г, шампиньоны 120 г, лук 40 г, пармезан 25 г, бульон 400 мл, сливочное масло 15 г, белое вино 30 мл","recipe":"1. Лук и грибы обжарить 7 минут.\n2. Добавить рис, вино, затем понемногу бульон, помешивая.\n3. Готовить 20 минут до кремовой текстуры.\n4. Добавить масло и пармезан.","bju":"Б:16,Ж:24,У:76"},
    {"name":"Индейка с киноа и овощами","calories":546,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"филе индейки 180 г, киноа 70 г, брокколи 100 г, морковь 50 г, оливковое масло 12 г","recipe":"1. Киноа промыть, варить 15 минут.\n2. Индейку нарезать, обжарить 10 минут.\n3. Овощи припустить 8 минут.\n4. Смешать и подавать.","bju":"Б:44,Ж:18,У:52"},

    {"name":"Тартар из лосося с авокадо","calories":534,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"филе лосося свежего 150 г, авокадо 1 шт., огурец 50 г, оливковое масло 10 г, соевый соус 10 мл, лайм 1/2, тосты 30 г","recipe":"1. Лосось и авокадо нарезать мелкими кубиками.\n2. Смешать с огурцом, маслом, соевым соусом, лаймом.\n3. Выложить кольцом, подавать с тостами.","bju":"Б:28,Ж:38,У:20"},
    {"name":"Сэндвич с сёмгой и сливочным сыром","calories":522,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"чиабатта 100 г, сёмга слабосолёная 80 г, сливочный сыр 40 г, огурец 40 г, руккола 10 г","recipe":"1. Булку разрезать, подсушить.\n2. Намазать сыром.\n3. Выложить сёмгу, огурец, руккола.","bju":"Б:30,Ж:26,У:42"},
    {"name":"Салат с креветками, авокадо и кедровыми орехами","calories":530,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"тигровые креветки 150 г, авокадо 1 шт., руккола 50 г, кедровые орехи 20 г, оливковое масло 15 г, лимон 1/4","recipe":"1. Креветки обжарить 3 минуты.\n2. Авокадо нарезать, смешать с рукколой.\n3. Добавить креветки, орехи, заправить маслом и лимоном.","bju":"Б:32,Ж:36,У:18"},
    {"name":"Брускетты с прошутто и моцареллой","calories":516,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"чиабатта 100 г, прошутто 50 г, моцарелла 80 г, помидоры черри 80 г, базилик, оливковое масло 10 г","recipe":"1. Хлеб подсушить на сковороде.\n2. Выложить моцареллу, помидоры, прошутто.\n3. Полить маслом, украсить базиликом.","bju":"Б:30,Ж:28,У:36"},
    {"name":"Боул с тунцом, авокадо и рисом","calories":542,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"свежий тунец 120 г, рис для суши 150 г (варёный), авокадо 1/2 шт., эдамаме 40 г, соевый соус 15 мл, кунжут","recipe":"1. Тунец нарезать кубиками, смешать с соевым соусом.\n2. Рис выложить в миску, добавить авокадо, эдамаме.\n3. Сверху тунец и кунжут.","bju":"Б:34,Ж:22,У:52"},
    {"name":"Парфе с малиной, фисташками и мёдом","calories":540,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"греческий йогурт 200 г, малина 120 г, фисташки 30 г, мёд 20 г, гранола 30 г","recipe":"1. В стакан слоями выложить йогурт, малину, гранолу.\n2. Посыпать фисташками, полить мёдом.","bju":"Б:20,Ж:28,У:52"},

    {"name":"Стейк рибай с салатом","calories":558,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"стейк рибай 150 г, руккола 40 г, помидоры черри 60 г, оливковое масло 10 г, соль, перец","recipe":"1. Стейк вынуть из холодильника за 20 минут, посолить.\n2. Обжарить по 3 минуты с каждой стороны на раскалённой сковороде.\n3. Дать отдохнуть 5 минут.\n4. Подавать с салатом.","bju":"Б:46,Ж:38,У:8"},
    {"name":"Креветки в сливочном соусе с пастой","calories":586,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"паста 80 г, тигровые креветки 150 г, сливки 20% 80 мл, чеснок 1 зубчик, пармезан 15 г","recipe":"1. Пасту отварить 9 минут.\n2. Креветки обжарить с чесноком 3 минуты.\n3. Влить сливки, прогреть 3 минуты.\n4. Смешать с пастой, посыпать пармезаном.","bju":"Б:34,Ж:26,У:54"},
    {"name":"Стейк из тунца с киноа","calories":548,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"стейк тунца 180 г, киноа 70 г, кунжут 5 г, соевый соус 10 мл, масло 10 г","recipe":"1. Киноа сварить 15 минут (можно заранее).\n2. Тунца обвалять в кунжуте, обжарить по 1,5 минуты с каждой стороны.\n3. Нарезать, подавать с киноа.","bju":"Б:48,Ж:20,У:44"},
    {"name":"Лосось со спаржей и картофелем","calories":540,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"филе лосося 150 г, спаржа 100 г, молодой картофель 150 г, масло сливочное 15 г, лимон 1/4","recipe":"1. Картофель заранее отварить 12 минут.\n2. Лосось обжарить 6 минут.\n3. Спаржу обжарить 4 минуты на масле.\n4. Подавать с лимоном.","bju":"Б:38,Ж:28,У:34"},
    {"name":"Утиная грудка с пюре из сельдерея","calories":520,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"утиная грудка 180 г, корень сельдерея 200 г, сливки 50 мл, масло 10 г, мёд 5 г","recipe":"1. Грудку надрезать кожу, обжарить кожей вниз 8 минут, перевернуть на 4 минуты.\n2. Сельдерей отварить в мелких кусочках 15 минут и пробить блендером со сливками.\n3. Подавать вместе.","bju":"Б:38,Ж:32,У:20"},
    {"name":"Гребешки с ризотто","calories":566,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"морские гребешки 120 г, готовый рис арборио 200 г, пармезан 20 г, сливочное масло 15 г, лимон 1/4","recipe":"1. Использовать заранее приготовленное ризотто, разогреть со сливочным маслом и пармезаном.\n2. Гребешки обжарить по 1,5 минуты с каждой стороны.\n3. Подавать на ризотто.","bju":"Б:30,Ж:22,У:62"},

    {"name":"Тирамису","calories":536,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"маскарпоне 100 г, савоярди 40 г, яичный желток 2 шт., сахар 30 г, кофе 60 мл, какао 5 г","recipe":"1. Желтки растереть с сахаром, добавить маскарпоне.\n2. Печенье обмакнуть в кофе, выложить слоем.\n3. Покрыть кремом, повторить слои.\n4. Охладить 5 часов, посыпать какао.","bju":"Б:10,Ж:32,У:52"},
    {"name":"Шоколадный фондан","calories":538,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"тёмный шоколад 70 г, сливочное масло 50 г, яйцо 1 шт. + желток 1, сахар 30 г, мука 20 г","recipe":"1. Шоколад растопить с маслом.\n2. Яйца взбить с сахаром, смешать с шоколадом и мукой.\n3. Залить в формы, охладить 1 час.\n4. Выпекать 10 минут при 200°C.","bju":"Б:8,Ж:34,У:50"},
    {"name":"Чизкейк Нью-Йорк","calories":540,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"сливочный сыр 120 г, печенье 40 г, масло 20 г, яйцо 1/2, сахар 30 г, сметана 30 г","recipe":"1. Печенье измельчить с маслом, выложить основу.\n2. Сыр взбить с сахаром, яйцом, сметаной, залить.\n3. Выпекать 50 минут при 160°C, охладить 4 часа.","bju":"Б:10,Ж:36,У:44"},
    {"name":"Тарт с малиной и кремом","calories":534,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"песочное тесто 60 г, заварной крем 100 г, малина 100 г, сахарная пудра 10 г","recipe":"1. Тесто испечь в форме 20 минут при 180°C.\n2. Остудить, заполнить кремом.\n3. Украсить малиной, охладить 1 час.","bju":"Б:8,Ж:30,У:58"},
    {"name":"Крем-брюле","calories":534,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"сливки 33% 150 мл, желтки 3 шт., сахар 40 г, ваниль","recipe":"1. Желтки с сахаром и ванилью смешать, влить тёплые сливки.\n2. Разлить в формы, запекать на водяной бане 40 минут при 150°C.\n3. Охладить 4 часа, посыпать сахаром, карамелизировать.","bju":"Б:8,Ж:40,У:40"},
    {"name":"Эклеры с заварным кремом","calories":540,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"заварное тесто 70 г, заварной крем 120 г, шоколадная глазурь 30 г","recipe":"1. Заварное тесто выпекать 30 минут при 190°C.\n2. Остудить, наполнить кремом.\n3. Покрыть глазурью.","bju":"Б:10,Ж:28,У:62"},

    {"name":"Говяжьи щёчки в вине","calories":542,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"говяжьи щёчки 200 г, красное вино 100 мл, морковь 60 г, лук 50 г, картофельное пюре 100 г","recipe":"1. Щёчки обжарить до корочки.\n2. Добавить овощи, вино, воду.\n3. Тушить 3 часа при 160°C.\n4. Подавать с пюре.","bju":"Б:44,Ж:30,У:24"},
    {"name":"Утка с яблоками","calories":570,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"утиная ножка 250 г, яблоки 150 г, мёд 10 г, апельсин 1/2","recipe":"1. Утку натереть солью, мёдом, апельсиновым соком.\n2. Выложить с яблоками.\n3. Запекать 2 часа при 170°C.","bju":"Б:40,Ж:34,У:26"},
    {"name":"Баранья ножка с овощами","calories":534,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"баранья ножка 220 г, розмарин 3 г, чеснок 3 зубчика, цукини 100 г, морковь 60 г","recipe":"1. Мясо нашпиговать чесноком, натереть розмарином.\n2. Запекать 2 часа при 170°C.\n3. Овощи добавить на последние 30 минут.","bju":"Б:46,Ж:30,У:20"},
    {"name":"Говядина Веллингтон","calories":570,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"вырезка говяжья 130 г, слоёное тесто 60 г, шампиньоны 60 г, прошутто 20 г, горчица 5 г","recipe":"1. Вырезку обжарить до корочки, смазать горчицей.\n2. Грибной дюксель обжарить.\n3. Обернуть в прошутто и тесто.\n4. Выпекать 40 минут при 200°C.","bju":"Б:36,Ж:34,У:30"},
    {"name":"Оссобуко с ризотто","calories":592,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"голяшка телячья 200 г, белое вино 60 мл, томаты 80 г, морковь 40 г, ризотто 150 г","recipe":"1. Голяшку обвалять в муке, обжарить.\n2. Добавить овощи, вино, томаты.\n3. Тушить 2,5 часа.\n4. Подавать с ризотто.","bju":"Б:42,Ж:24,У:52"},
    {"name":"Утиное конфи с картофелем","calories":564,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"утиная ножка 220 г, утиный жир 20 г, молодой картофель 150 г, чеснок, тимьян","recipe":"1. Утку посолить на ночь с травами.\n2. Томить в жире 2,5 часа при 140°C.\n3. Картофель обжарить на утином жире.","bju":"Б:36,Ж:36,У:24"},

    {"name":"Лосось су-вид с авокадо-кремом","calories":508,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"филе лосося 150 г, авокадо 1/2 шт., лайм 1/2, оливковое масло 10 г, кунжут 3 г","recipe":"1. Лосось приготовить при 52°C 30 минут в пакете (или запечь 15 минут при 160°C).\n2. Авокадо пробить блендером с лаймом.\n3. Подавать лосось на креме.","bju":"Б:32,Ж:36,У:14"},
    {"name":"Салат с уткой, грушей и орехами","calories":522,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"утиная грудка 120 г, груша 1 шт., руккола 50 г, грецкие орехи 20 г, бальзамик 10 мл, мёд 5 г","recipe":"1. Грудку обжарить 12 минут, дать отдохнуть, нарезать.\n2. Грушу нарезать.\n3. Собрать салат, полить бальзамиком с мёдом.","bju":"Б:28,Ж:34,У:26"},
    {"name":"Паштет из утиной печени с тостами","calories":526,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"утиная печень 150 г, сливочное масло 40 г, коньяк 10 мл, хлеб 60 г, джем 20 г","recipe":"1. Печень обжарить 6 минут с коньяком.\n2. Пробить блендером с маслом.\n3. Охладить 30 минут, подавать с тостами и джемом.","bju":"Б:18,Ж:38,У:28"},
    {"name":"Карпаччо из говядины с пармезаном и орехами","calories":526,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"вырезка говяжья 130 г, пармезан 30 г, руккола 30 г, кедровые орехи 20 г, оливковое масло 15 г","recipe":"1. Мясо заморозить на 40 минут для тонкой нарезки.\n2. Нарезать тончайшими слайсами.\n3. Выложить, добавить руккола, пармезан, орехи, масло.","bju":"Б:36,Ж:38,У:10"},
    {"name":"Креветки темпура с салатом","calories":558,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"креветки 150 г, мука 40 г, яйцо 1 шт., масло для фритюра 20 г (впитавшееся), салат 50 г, соус сладкий чили 20 г","recipe":"1. Тесто: мука, яйцо, холодная вода.\n2. Креветки обмакнуть, жарить во фритюре 3 минуты.\n3. Подавать с салатом и соусом.","bju":"Б:28,Ж:30,У:44"},
    {"name":"Фуа-гра на бриоши","calories":560,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"фуа-гра 80 г, бриошь 60 г, инжирный джем 30 г, соль","recipe":"1. Фуа-гра нарезать, обжарить без масла по 1 минуте с каждой стороны.\n2. Бриошь подсушить.\n3. Подавать с джемом.","bju":"Б:14,Ж:40,У:36"},

    {"name":"Лосось с булгуром и спаржей","calories":570,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"филе лосося 170 г, булгур 70 г, спаржа 100 г, оливковое масло 10 г, лимон 1/4","recipe":"1. Булгур отварить 15 минут.\n2. Лосось запечь 15 минут при 190°C.\n3. Спаржу обжарить 5 минут.\n4. Подавать вместе.","bju":"Б:42,Ж:26,У:42"},
    {"name":"Филе-миньон с картофельным гратеном","calories":566,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"филе-миньон 130 г, картофель 150 г, сливки 50 мл, сыр 20 г, чеснок","recipe":"1. Картофель тонко нарезать, залить сливками с чесноком, посыпать сыром.\n2. Запекать 35 минут при 190°C.\n3. Стейк обжарить по 3 минуты с каждой стороны.","bju":"Б:42,Ж:30,У:32"},
    {"name":"Паста с морепродуктами","calories":588,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"спагетти 90 г, морской коктейль 150 г, томатный соус 80 г, чеснок, белое вино 30 мл","recipe":"1. Спагетти отварить 9 минут.\n2. Морепродукты обжарить 5 минут с чесноком.\n3. Добавить вино и соус, тушить 8 минут.\n4. Смешать с пастой.","bju":"Б:36,Ж:20,У:66"},
    {"name":"Телятина с грибным соусом и пюре","calories":546,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"телятина 160 г, шампиньоны 80 г, сливки 50 мл, картофель 150 г, масло 10 г","recipe":"1. Телятину обжарить 10 минут.\n2. Грибы обжарить, добавить сливки, тушить 8 минут.\n3. Картофель отварить 20 минут, сделать пюре.","bju":"Б:40,Ж:26,У:38"},
    {"name":"Дорадо запечённая с картофелем","calories":534,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"дорадо 1 тушка (250 г), картофель 150 г, лимон 1/2, оливковое масло 15 г, тимьян","recipe":"1. Рыбу набить лимоном и тимьяном.\n2. Выложить с картофелем, полить маслом.\n3. Запекать 35 минут при 190°C.","bju":"Б:44,Ж:22,У:40"},
    {"name":"Паэлья с морепродуктами","calories":570,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"рис 90 г, креветки 80 г, мидии 60 г, кальмар 60 г, шафран, томаты 50 г, горошек 30 г","recipe":"1. Обжарить морепродукты 4 минуты, отложить.\n2. Добавить рис, томаты, бульон с шафраном.\n3. Варить 20 минут, не помешивая.\n4. Вернуть морепродукты на 5 минут.","bju":"Б:36,Ж:18,У:66"},
    
    // ===== 600–700 ккал | Дёшево, быстро, лёгкое =====
    {"name":"Овсянка с бананом и арахисовой пастой","calories":622,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"овсяные хлопья, молоко, банан, арахисовая паста, мёд","recipe":"1. Залить 80 г хлопьев 250 мл молока.\n2. Варить 5 минут на среднем огне, помешивая.\n3. Добавить 1 ст. л. арахисовой пасты и 1 ч. л. мёда, перемешать.\n4. Сверху выложить 1 нарезанный банан.","bju":"Б:18,Ж:22,У:88"},
    {"name":"Творог с бананом, мёдом и орехами","calories":636,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"творог 5%, банан, мёд, грецкие орехи","recipe":"1. Выложить 250 г творога в миску.\n2. Банан нарезать кружками.\n3. Орехи (30 г) крупно порубить.\n4. Смешать всё, полить 1 ст. л. мёда.","bju":"Б:32,Ж:20,У:82"},
    {"name":"Смузи банан-овсянка-арахис","calories":644,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"банан, овсяные хлопья, молоко, арахисовая паста, мёд","recipe":"1. В блендер положить 2 банана, 40 г хлопьев, 300 мл молока.\n2. Добавить 1 ст. л. арахисовой пасты и 1 ч. л. мёда.\n3. Взбивать 1 минуту до однородности.\n4. Подавать сразу.","bju":"Б:22,Ж:24,У:85"},
    {"name":"Салат из нута с овощами и маслом","calories":614,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"консервированный нут, огурец, помидор, лук, оливковое масло, лимон","recipe":"1. Откинуть на сито 400 г нута из банки и промыть.\n2. Нарезать огурец, помидор и 1/2 красного лука.\n3. Смешать с нутом.\n4. Заправить 2 ст. л. оливкового масла, соком 1/2 лимона, солью и перцем. Подать с ломтём хлеба.","bju":"Б:20,Ж:26,У:75"},
    {"name":"Йогурт с гранолой и бананом","calories":630,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"натуральный йогурт, гранола, банан, мёд","recipe":"1. Выложить 300 г йогурта в глубокую миску.\n2. Добавить 70 г гранолы.\n3. Банан нарезать кружками и положить сверху.\n4. Полить 1 ч. л. мёда.","bju":"Б:20,Ж:22,У:88"},
    {"name":"Рисовая каша с изюмом и маслом","calories":628,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"варёный рис, молоко, изюм, сливочное масло, сахар","recipe":"1. Взять 250 г готового риса и залить 250 мл молока.\n2. Варить 7 минут на слабом огне до густоты.\n3. Добавить 30 г изюма, 1 ст. л. сахара и 15 г масла.\n4. Перемешать и дать постоять 2 минуты.","bju":"Б:14,Ж:20,У:98"},

    // ===== Дёшево, быстро, сытное =====
    {"name":"Яичница с сосисками и хлебом","calories":640,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"яйца, сосиски, хлеб, растительное масло","recipe":"1. Разогреть сковороду с 1 ст. л. масла.\n2. Обжарить 2 сосиски 3 минуты.\n3. Разбить 3 яйца, посолить и жарить 4 минуты.\n4. Подать с 2 ломтями хлеба.","bju":"Б:30,Ж:40,У:40"},
    {"name":"Макароны с сыром","calories":666,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"макароны, сыр, сливочное масло, молоко","recipe":"1. Отварить 120 г макарон 8–9 минут в подсоленной воде и слить воду.\n2. Вернуть в кастрюлю, добавить 15 г масла и 50 мл молока.\n3. Всыпать 60 г тёртого сыра.\n4. Перемешать на слабом огне до расплавления сыра.","bju":"Б:28,Ж:26,У:80"},
    {"name":"Гречка с яйцом и маслом","calories":632,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"гречка, яйца, сливочное масло, лук","recipe":"1. Взять 250 г готовой гречки.\n2. Лук мелко нарезать и обжарить 3 минуты на масле.\n3. Добавить гречку и прогреть 2 минуты.\n4. Отдельно пожарить 2 яйца и выложить сверху.","bju":"Б:26,Ж:24,У:78"},
    {"name":"Омлет с картофелем","calories":610,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"яйца, картофель, молоко, лук, масло","recipe":"1. Мелко нарезать 1 отварной картофель и обжарить с луком 4 минуты.\n2. Взбить 3 яйца с 50 мл молока и солью.\n3. Залить картофель яйцами.\n4. Накрыть крышкой и готовить 5 минут на слабом огне.","bju":"Б:26,Ж:34,У:50"},
    {"name":"Кесадилья с фасолью и сыром","calories":636,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"лепёшка тортилья, консервированная фасоль, сыр, лук, специи","recipe":"1. Размять вилкой 150 г фасоли с щепоткой паприки.\n2. Намазать на половину тортильи и посыпать 60 г тёртого сыра.\n3. Сложить пополам.\n4. Обжарить по 2 минуты с каждой стороны на сухой сковороде.","bju":"Б:30,Ж:24,У:75"},
    {"name":"Жареный рис с яйцом и овощами","calories":646,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"варёный рис, яйца, замороженные овощи, соевый соус, масло","recipe":"1. Разогреть 1 ст. л. масла и жарить 150 г замороженных овощей 4 минуты.\n2. Добавить 300 г холодного варёного риса и жарить 3 минуты.\n3. Сдвинуть рис в сторону, вбить 2 яйца и перемешать до готовности.\n4. Влить 1 ст. л. соевого соуса и перемешать.","bju":"Б:24,Ж:22,У:88"},

    // ===== Дёшево, медленно, лёгкое =====
    {"name":"Овощное рагу с чечевицей","calories":642,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"красная чечевица, морковь, кабачок, лук, томатная паста, масло","recipe":"1. Обжарить лук и морковь 5 минут.\n2. Добавить кабачок, 1 ст. л. томатной пасты и 100 г чечевицы.\n3. Залить 400 мл воды.\n4. Тушить под крышкой 40 минут, посолить в конце. Подать с хлебом.","bju":"Б:30,Ж:18,У:90"},
    {"name":"Тыквенный крем-суп со сливками","calories":620,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"тыква, лук, сливки, хлеб, масло","recipe":"1. Нарезать 400 г тыквы и 1 луковицу.\n2. Варить в 500 мл воды 30 минут до мягкости.\n3. Пробить блендером, влить 100 мл сливок.\n4. Хлеб нарезать кубиками и подсушить на масле для сухариков. Подать с супом.","bju":"Б:12,Ж:28,У:80"},
    {"name":"Запечённые овощи с нутом и тахини","calories":622,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"нут, морковь, цветная капуста, лук, тахини, масло","recipe":"1. Нарезать овощи крупно, смешать с 200 г нута и 2 ст. л. масла.\n2. Запекать при 200 °C 45 минут.\n3. Смешать 1 ст. л. тахини, лимонный сок и воду.\n4. Полить овощи соусом.","bju":"Б:22,Ж:26,У:75"},
    {"name":"Постный борщ с фасолью","calories":624,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"свёкла, капуста, картофель, фасоль, морковь, лук, хлеб","recipe":"1. Отварить 100 г фасоли заранее до мягкости.\n2. В кипящую воду (800 мл) заложить картофель и капусту, варить 15 минут.\n3. Обжарить свёклу, морковь и лук 10 минут и добавить в кастрюлю.\n4. Добавить фасоль, варить 15 минут. Подать с хлебом.","bju":"Б:24,Ж:16,У:96"},
    {"name":"Перловка с овощами и грибами","calories":644,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"перловая крупа, шампиньоны, морковь, лук, масло","recipe":"1. Замочить 100 г перловки на 2 часа и отварить 40 минут.\n2. Обжарить лук, морковь и 150 г грибов 10 минут.\n3. Смешать с перловкой.\n4. Тушить 5 минут, посолить и поперчить.","bju":"Б:18,Ж:20,У:98"},
    {"name":"Фасолевый суп с овощами и хлебом","calories":606,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"фасоль, картофель, морковь, лук, томатная паста, хлеб","recipe":"1. Отварить 100 г замоченной фасоли 1 час.\n2. Добавить картофель кубиками.\n3. Обжарить лук, морковь и 1 ст. л. томатной пасты, переложить в суп.\n4. Варить 20 минут. Подать с 2 ломтями хлеба.","bju":"Б:28,Ж:14,У:92"},

    // ===== Дёшево, медленно, сытное =====
    {"name":"Плов с курицей","calories":698,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"рис, куриные бёдра, морковь, лук, чеснок, масло, специи","recipe":"1. Обжарить 200 г курицы с луком и морковью 10 минут.\n2. Добавить 100 г промытого риса и специи (зира, барбарис).\n3. Залить водой на 1 см выше риса.\n4. Тушить под крышкой 40 минут на слабом огне.","bju":"Б:36,Ж:26,У:80"},
    {"name":"Ленивые голубцы","calories":628,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"фарш, рис, капуста, лук, томатная паста, сметана","recipe":"1. Смешать 150 г фарша, 50 г отварного риса и лук.\n2. Добавить 150 г мелко нашинкованной капусты.\n3. Сформировать котлеты и выложить в сотейник.\n4. Залить соусом из томатной пасты и воды, тушить 40 минут. Подать со сметаной.","bju":"Б:32,Ж:28,У:62"},
    {"name":"Тушёная картошка с говядиной","calories":608,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"говядина, картофель, лук, морковь, лавровый лист","recipe":"1. Обжарить 150 г говядины кубиками 10 минут.\n2. Добавить лук и морковь, жарить 5 минут.\n3. Залить водой, тушить 40 минут.\n4. Добавить 300 г картофеля и лавровый лист, тушить 25 минут.","bju":"Б:34,Ж:28,У:55"},
    {"name":"Гороховый суп с копчёностями","calories":618,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"горох, копчёные рёбрышки, картофель, морковь, лук","recipe":"1. Замочить 100 г гороха на 3 часа.\n2. Варить с 100 г рёбрышек в 1 л воды 1 час.\n3. Добавить картофель.\n4. Обжарить лук с морковью, положить в суп и варить 15 минут.","bju":"Б:34,Ж:26,У:62"},
    {"name":"Запечённые макароны по-флотски","calories":684,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"макароны, фарш, лук, сыр, яйцо, масло","recipe":"1. Отварить 120 г макарон.\n2. Обжарить 150 г фарша с луком 10 минут.\n3. Смешать с макаронами и взбитым яйцом.\n4. Посыпать 40 г сыра, запекать 30 минут при 190 °C.","bju":"Б:36,Ж:28,У:72"},
    {"name":"Курица тушёная с гречкой","calories":614,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"курица, гречка, лук, морковь, масло","recipe":"1. Обжарить 200 г курицы 8 минут.\n2. Добавить лук и морковь, залить 150 мл воды.\n3. Тушить 45 минут.\n4. Отварить 80 г гречки и подать как гарнир.","bju":"Б:44,Ж:22,У:60"},

    // ===== Дёшево, средне, лёгкое =====
    {"name":"Салат с картофелем и сельдью","calories":620,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"картофель, сельдь, лук, подсолнечное масло, огурец солёный","recipe":"1. Отварить 3 картофелины 20 минут.\n2. Нарезать картофель, 100 г сельди, лук и огурец.\n3. Смешать.\n4. Заправить 2 ст. л. масла и посыпать зеленью.","bju":"Б:20,Ж:28,У:72"},
    {"name":"Рисовая запеканка с яблоком","calories":626,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"рис, яблоко, яйцо, молоко, сахар, масло","recipe":"1. Отварить 100 г риса в молоке 15 минут.\n2. Смешать с 1 яйцом, 2 ст. л. сахара и тёртым яблоком.\n3. Выложить в форму со сливочным маслом.\n4. Выпекать 25 минут при 180 °C.","bju":"Б:16,Ж:18,У:100"},
    {"name":"Сырники со сметаной и вареньем","calories":614,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"творог, яйцо, мука, сахар, сметана, варенье","recipe":"1. Смешать 250 г творога, 1 яйцо, 3 ст. л. муки и 1 ст. л. сахара.\n2. Сформировать 5 сырников и обвалять в муке.\n3. Жарить по 3–4 минуты с каждой стороны на масле.\n4. Подать со сметаной и вареньем.","bju":"Б:34,Ж:22,У:70"},
    {"name":"Овощной суп с чечевицей и тостами","calories":618,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"чечевица, морковь, картофель, лук, хлеб, чеснок","recipe":"1. Обжарить лук и морковь 5 минут.\n2. Добавить картофель, 100 г чечевицы и 700 мл воды.\n3. Варить 25 минут.\n4. Подсушить хлеб с чесноком в тостере и подать с супом.","bju":"Б:26,Ж:18,У:88"},
    {"name":"Тыквенная каша с пшеном","calories":622,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"пшено, тыква, молоко, сливочное масло, сахар","recipe":"1. Нарезать 200 г тыквы мелким кубиком и варить в 200 мл воды 10 минут.\n2. Добавить 80 г промытого пшена и 200 мл молока.\n3. Варить 20 минут.\n4. Добавить 20 г масла и 1 ст. л. сахара.","bju":"Б:14,Ж:22,У:92"},
    {"name":"Блины с яблоками и корицей","calories":622,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"мука, молоко, яйцо, яблоко, сахар, корица, масло","recipe":"1. Замесить тесто: 100 г муки, 200 мл молока, 1 яйцо и щепотка соли.\n2. Обжарить 5 тонких блинов.\n3. Яблоко нарезать и потушить 5 минут с сахаром и корицей.\n4. Завернуть начинку в блины.","bju":"Б:18,Ж:22,У:88"},

    // ===== Дёшево, средне, сытное =====
    {"name":"Куриные котлеты с картофельным пюре","calories":632,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"куриный фарш, картофель, лук, хлеб, молоко, масло","recipe":"1. Смешать 200 г фарша, лук, размоченный в молоке хлеб и соль.\n2. Сформировать 2 котлеты и жарить по 6 минут с каждой стороны.\n3. Отварить 300 г картофеля 20 минут.\n4. Размять с 20 г масла и 50 мл молока.","bju":"Б:40,Ж:28,У:55"},
    {"name":"Картофельная запеканка с фаршем","calories":614,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"картофель, фарш, лук, молоко, сыр","recipe":"1. Сварить 300 г картофеля и размять с молоком.\n2. Обжарить 150 г фарша с луком 10 минут.\n3. Выложить в форму слоями: пюре, фарш, пюре.\n4. Посыпать сыром и запекать 20 минут при 200 °C.","bju":"Б:34,Ж:30,У:52"},
    {"name":"Гречка с печёночной подливой","calories":622,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"гречка, куриная печень, лук, морковь, сметана","recipe":"1. Отварить 80 г гречки 15 минут.\n2. Обжарить лук с морковью 5 минут, добавить 200 г печени.\n3. Жарить 8 минут, добавить 3 ст. л. сметаны.\n4. Тушить 5 минут и подать с гречкой.","bju":"Б:38,Ж:22,У:68"},
    {"name":"Макароны с курицей в сливочном соусе","calories":664,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"макароны, куриная грудка, сливки, лук, чеснок","recipe":"1. Отварить 100 г макарон.\n2. Обжарить 150 г нарезанной грудки с луком и чесноком 8 минут.\n3. Влить 100 мл сливок, тушить 5 минут.\n4. Смешать с макаронами.","bju":"Б:42,Ж:24,У:70"},
    {"name":"Жареная картошка с яйцом и колбасой","calories":676,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"картофель, яйца, колбаса, лук, масло","recipe":"1. Нарезать 350 г картофеля брусочками и жарить 15 минут.\n2. Добавить лук и 60 г колбасы, жарить 5 минут.\n3. Вбить 2 яйца и накрыть крышкой.\n4. Готовить 4 минуты.","bju":"Б:28,Ж:36,У:60"},
    {"name":"Запечённый рис с куриными бёдрами","calories":646,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"куриные бёдра, рис, лук, морковь, специи","recipe":"1. Выложить в форму 90 г риса, лук и морковь.\n2. Залить 200 мл горячей воды и посолить.\n3. Сверху положить 2 бедра со специями.\n4. Накрыть фольгой, запекать 45 минут при 190 °C.","bju":"Б:38,Ж:26,У:65"},

    // ===== Средне, быстро, лёгкое =====
    {"name":"Салат с тунцом, фасолью и маслом","calories":618,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"тунец консервированный, фасоль, красный лук, помидоры, оливковое масло","recipe":"1. Выложить 1 банку тунца (150 г) и 150 г фасоли в миску.\n2. Добавить помидоры и лук.\n3. Заправить 2 ст. л. оливкового масла и лимонным соком.\n4. Подать с ломтём хлеба.","bju":"Б:34,Ж:26,У:62"},
    {"name":"Тост с слабосолёным лососем и творожным сыром","calories":620,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"хлеб цельнозерновой, лосось слабосолёный, творожный сыр, огурец","recipe":"1. Поджарить 3 ломтя хлеба.\n2. Намазать 60 г творожного сыра.\n3. Выложить 80 г лосося и ломтики огурца.\n4. Посыпать укропом.","bju":"Б:30,Ж:28,У:62"},
    {"name":"Боул с рисом и креветками","calories":618,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"рис, креветки, огурец, морковь, соевый соус, кунжут","recipe":"1. Разогреть 200 г готового риса.\n2. Обжарить 150 г креветок 3 минуты.\n3. Выложить в миску рис, креветки, огурец и морковь.\n4. Полить соевым соусом и посыпать кунжутом.","bju":"Б:34,Ж:18,У:80"},
    {"name":"Греческий салат с питой и курицей","calories":626,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"куриная грудка, огурец, помидор, фета, маслины, пита, масло","recipe":"1. Обжарить 150 г грудки 8 минут и нарезать.\n2. Нарезать овощи и 50 г феты.\n3. Смешать с маслинами и 1 ст. л. оливкового масла.\n4. Подать с питой.","bju":"Б:38,Ж:26,У:60"},
    {"name":"Смузи-боул с ягодами и гранолой","calories":652,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"замороженные ягоды, банан, йогурт, гранола, миндаль","recipe":"1. Взбить в блендере 150 г ягод, банан и 200 г йогурта.\n2. Вылить в миску.\n3. Посыпать 50 г гранолы и 20 г миндаля.\n4. Подавать сразу.","bju":"Б:22,Ж:28,У:78"},
    {"name":"Паста с песто и черри","calories":670,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"спагетти, соус песто, помидоры черри, пармезан","recipe":"1. Отварить 100 г спагетти.\n2. Нарезать 100 г черри пополам.\n3. Смешать пасту с 2 ст. л. песто и помидорами.\n4. Посыпать 20 г пармезана.","bju":"Б:22,Ж:30,У:78"},

    // ===== Средне, быстро, сытное =====
    {"name":"Куриный стейк с булгуром","calories":630,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"куриное филе, булгур, сладкий перец, масло, специи","recipe":"1. Отбить 200 г филе и посыпать паприкой с солью.\n2. Жарить по 5 минут с каждой стороны.\n3. Залить 80 г булгура кипятком 1:2 на 15 минут.\n4. Добавить обжаренный перец и подать со стейком.","bju":"Б:46,Ж:22,У:62"},
    {"name":"Спагетти карбонара","calories":678,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"спагетти, бекон, яйцо, пармезан, чеснок","recipe":"1. Отварить 100 г спагетти.\n2. Обжарить 70 г бекона 5 минут.\n3. Смешать 1 яйцо, 1 желток и 30 г пармезана.\n4. Снять сковороду с огня, соединить пасту с беконом и соусом, быстро перемешать.","bju":"Б:32,Ж:30,У:70"},
    {"name":"Домашний бургер","calories":648,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"булочка, говяжий фарш, сыр, помидор, салат, соус","recipe":"1. Сформировать котлету из 150 г фарша.\n2. Жарить по 4 минуты с каждой стороны, сверху положить сыр.\n3. Разрезать и слегка подсушить булочку.\n4. Собрать с салатом, помидором и соусом.","bju":"Б:38,Ж:32,У:52"},
    {"name":"Лапша удон с говядиной","calories":622,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"лапша удон, говядина, перец, морковь, соевый соус, имбирь","recipe":"1. Нарезать 120 г говядины тонкими полосками и жарить 4 минуты.\n2. Добавить овощи, жарить 3 минуты.\n3. Добавить сваренную лапшу (200 г) и 2 ст. л. соевого соуса.\n4. Прогреть 2 минуты.","bju":"Б:36,Ж:22,У:70"},
    {"name":"Буррито с курицей и фасолью","calories":648,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"тортилья, куриное филе, фасоль, рис, сыр, сальса","recipe":"1. Обжарить 120 г нарезанного филе 7 минут.\n2. Смешать с фасолью, 80 г риса и сальсой.\n3. Выложить на тортилью, посыпать сыром.\n4. Завернуть и обжарить 2 минуты.","bju":"Б:40,Ж:24,У:68"},
    {"name":"Рис с креветками и яйцом","calories":628,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"рис, креветки, яйца, зелёный горошек, соевый соус","recipe":"1. Обжарить 150 г креветок 3 минуты.\n2. Добавить 250 г готового риса и горошек.\n3. Влить 2 взбитых яйца и перемешать.\n4. Добавить 1 ст. л. соевого соуса.","bju":"Б:38,Ж:20,У:74"},

    // ===== Средне, медленно, лёгкое =====
    {"name":"Запечённая треска с овощами и картофелем","calories":642,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"филе трески, картофель, кабачок, помидоры, оливковое масло, лимон","recipe":"1. Нарезать 250 г картофеля дольками и запекать 20 минут при 200 °C.\n2. Добавить кабачок и помидоры, сверху положить 200 г трески.\n3. Полить 1,5 ст. л. масла и лимонным соком.\n4. Запекать ещё 25 минут.","bju":"Б:40,Ж:26,У:62"},
