    {"name":"Куриный шашлык на сковороде-гриль","calories":130,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"куриное бедро без кожи 100 г, лук 20 г, лимонный сок 5 мл, паприка, соль","recipe":"1. Мясо нарезать кубиками, смешать с луком, лимоном, паприкой и солью.\n2. Мариновать 15 минут.\n3. Нанизать на шпажки, жарить на гриле 12 минут.","bju":"Б:18,Ж:6,У:2"},
    {"name":"Омлет с брокколи и сыром","calories":156,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"яйцо 1 шт., яичный белок 1 шт., брокколи 50 г, сыр 15 г, соль","recipe":"1. Брокколи отварить 5 минут, нарезать.\n2. Яйца взбить с солью.\n3. Выложить брокколи на сковороду, залить яйцом, посыпать сыром.\n4. Готовить под крышкой 5 минут.","bju":"Б:14,Ж:10,У:3"},
    {"name":"Гуляш из индейки","calories":137,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"филе индейки 80 г, помидор 30 г, лук 20 г, перец 30 г, подсолнечное масло 3 г, вода 80 мл, соль","recipe":"1. Индейку нарезать кубиками, обжарить в масле 5 минут.\n2. Добавить лук, перец и помидор.\n3. Влить воду, тушить под крышкой 25 минут, посолить.","bju":"Б:17,Ж:5,У:6"},
    
    {"name":"Салат с креветками и авокадо","calories":130,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"креветки очищенные 60 г, авокадо 40 г, огурец 50 г, салат 30 г, лимонный сок","recipe":"1. Креветки отварить 3 минуты, остудить.\n2. Авокадо и огурец нарезать.\n3. Смешать с салатом, сбрызнуть лимоном.","bju":"Б:11,Ж:8,У:3"},
    {"name":"Карпаччо из лосося","calories":130,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"филе лосося (охлаждённое, для сырого употребления) 60 г, рукола 20 г, лимон, каперсы 3 г","recipe":"1. Лосось подморозить 20 минут, нарезать тончайшими пластинами.\n2. Выложить на тарелку, сверху руколу и каперсы.\n3. Сбрызнуть лимоном.","bju":"Б:12,Ж:9,У:0"},
    {"name":"Тартар из тунца с авокадо","calories":150,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"свежий тунец 80 г, авокадо 40 г, соевый соус 5 мл, лайм, кунжут 1 г","recipe":"1. Тунец и авокадо нарезать мелкими кубиками.\n2. Смешать с соевым соусом и лаймом.\n3. Выложить формой, посыпать кунжутом.","bju":"Б:18,Ж:8,У:2"},
    {"name":"Салат с крабом и авокадо","calories":145,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"мясо краба 70 г, авокадо 50 г, огурец 50 г, лимонный сок, зелень","recipe":"1. Краба разобрать на волокна.\n2. Авокадо и огурец нарезать кубиками.\n3. Смешать, добавить лимонный сок и зелень.","bju":"Б:10,Ж:9,У:5"},
    {"name":"Хлебец с лососем и авокадо","calories":165,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"хлебец 10 г, слабосолёный лосось 40 г, авокадо 30 г, лимонный сок, укроп","recipe":"1. Авокадо размять с лимонным соком.\n2. Намазать на хлебец.\n3. Сверху ломтики лосося и укроп.","bju":"Б:10,Ж:10,У:8"},
    {"name":"Салат с гребешками и грейпфрутом","calories":150,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"морской гребешок 80 г, грейпфрут 80 г, рукола 30 г, оливковое масло 5 г","recipe":"1. Гребешки обжарить на сухой сковороде по 1,5 минуты с каждой стороны.\n2. Грейпфрут очистить от плёнок.\n3. Собрать салат с руколой, заправить маслом.","bju":"Б:15,Ж:7,У:7"},
    
    {"name":"Лосось на сковороде","calories":165,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"филе лосося 80 г, лимон, соль, перец","recipe":"1. Лосось посолить и поперчить.\n2. Жарить на антипригарной сковороде кожей вниз 4 минуты.\n3. Перевернуть, жарить 2 минуты.\n4. Подавать с лимоном.","bju":"Б:16,Ж:11,У:0"},
    {"name":"Стейк из тунца","calories":125,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"свежий тунец 120 г, соль, перец, лимон","recipe":"1. Тунца обсушить, посолить и поперчить.\n2. Обжарить на раскалённой сухой сковороде по 1,5 минуты с каждой стороны.\n3. Подавать с лимоном.","bju":"Б:29,Ж:1,У:0"},
    {"name":"Тигровые креветки, обжаренные","calories":142,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"тигровые креветки 150 г, чеснок, лимон, соль","recipe":"1. Креветки очистить, посолить.\n2. Обжарить на сухой сковороде с чесноком 3–4 минуты.\n3. Сбрызнуть лимоном.","bju":"Б:30,Ж:2,У:1"},
    {"name":"Стейк из говяжьей вырезки","calories":130,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"говяжья вырезка 80 г, соль, перец, розмарин","recipe":"1. Мясо достать из холодильника за 15 минут, посолить и поперчить.\n2. Жарить на раскалённой сковороде по 2 минуты с каждой стороны.\n3. Дать отдохнуть 3 минуты.","bju":"Б:17,Ж:7,У:0"},
    {"name":"Гребешки с овощами гриль","calories":148,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"морской гребешок 100 г, кабачок 100 г, подсолнечное масло 4 г, лимон, соль","recipe":"1. Кабачок нарезать ломтями, обжарить на гриле по 2 минуты.\n2. Гребешки посолить, обжарить по 1,5 минуты с каждой стороны.\n3. Подавать с лимоном.","bju":"Б:18,Ж:6,У:6"},
    {"name":"Утиная грудка без кожи","calories":125,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"утиная грудка без кожи 100 г, соль, перец, тимьян","recipe":"1. Грудку разрезать пополам вдоль и слегка отбить.\n2. Посолить, поперчить.\n3. Жарить по 4 минуты с каждой стороны, дать отдохнуть.","bju":"Б:23,Ж:4,У:0"},
    
    {"name":"Заливное из креветок","calories":105,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"очищенные креветки 100 г, желатин 5 г, лимон, укроп, вода 150 мл, соль","recipe":"1. Креветки отварить 3 минуты.\n2. Желатин замочить, растворить в горячей подсоленной воде.\n3. Креветки и укроп выложить в форму, залить желе.\n4. Охладить минимум 5 часов.","bju":"Б:23,Ж:1,У:1"},
    {"name":"Артишоки, тушёные с луком","calories":115,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"артишок 150 г, лук 20 г, оливковое масло 5 г, лимонный сок, вода 100 мл, соль","recipe":"1. Артишоки очистить, обрезать листья.\n2. Тушить с луком, маслом и водой под крышкой 50 минут.\n3. Сбрызнуть лимоном.","bju":"Б:4,Ж:5,У:12"},
    {"name":"Севиче из креветок и гребешка","calories":148,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"креветки 60 г, морской гребешок 50 г, авокадо 30 г, лайм 1 шт., красный лук 10 г, кинза","recipe":"1. Морепродукты нарезать мелко, залить соком лайма.\n2. Мариновать в холодильнике 2 часа.\n3. Добавить авокадо, лук и кинзу.","bju":"Б:15,Ж:8,У:4"},
    {"name":"Лосось домашнего слабого посола","calories":146,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"филе лосося 70 г, соль 3 г, сахар 1 г, укроп, лимон","recipe":"1. Смешать соль с сахаром, натереть рыбу.\n2. Обложить укропом, плотно завернуть в плёнку.\n3. Выдержать в холодильнике 12 часов.\n4. Нарезать тонкими ломтями, подать с лимоном.","bju":"Б:14,Ж:10,У:0"},
    {"name":"Крем-суп из белых грибов с трюфельным маслом","calories":160,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"белые грибы 100 г, картофель 40 г, лук 20 г, сливки 10% 60 мл, трюфельное масло 2 г, вода 250 мл, соль","recipe":"1. Лук и грибы томить с небольшим количеством воды 15 минут.\n2. Добавить картофель и воду, варить 30 минут.\n3. Пробить блендером, добавить сливки.\n4. Подавая, капнуть трюфельным маслом.","bju":"Б:6,Ж:9,У:13"},
    {"name":"Морской окунь с фенхелем","calories":150,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"филе морского окуня 100 г, фенхель 100 г, оливковое масло 3 г, лимон, соль","recipe":"1. Рыбу замариновать с лимоном и солью 40 минут.\n2. Фенхель нарезать, выложить в форму.\n3. Сверху рыба, сбрызнуть маслом.\n4. Запекать при 180 °C 30 минут.","bju":"Б:19,Ж:5,У:7"},
    
    {"name":"Лосось, запечённый в соли","calories":165,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"филе лосося 80 г, крупная соль 100 г (не съедается), белок 1 шт., лимон, укроп","recipe":"1. Соль смешать с белком до влажного песка.\n2. Рыбу уложить на слой соли, покрыть сверху остатками.\n3. Запекать при 200 °C 45 минут.\n4. Разбить корку, подать с лимоном (соль не есть).","bju":"Б:16,Ж:11,У:0"},
    {"name":"Вырезка медленного приготовления","calories":160,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"говяжья вырезка 100 г, тимьян, соль, перец","recipe":"1. Мясо натереть солью, перцем и тимьяном.\n2. Запекать в рукаве при 120 °C 90 минут.\n3. Дать отдохнуть 10 минут и нарезать.","bju":"Б:21,Ж:8,У:0"},
    {"name":"Утиная грудка с яблоком","calories":147,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"утиная грудка без кожи 100 г, яблоко 50 г, розмарин, соль","recipe":"1. Грудку замариновать с розмарином на 2 часа.\n2. Яблоко нарезать дольками, выложить в форму вместе с мясом.\n3. Запекать при 180 °C 45 минут.","bju":"Б:22,Ж:3,У:8"},
    {"name":"Томлёная баранина","calories":125,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"постная баранина 70 г, чеснок 2 зубчика, розмарин, вода 80 мл, соль","recipe":"1. Мясо нарезать кусками, посолить, добавить чеснок и розмарин.\n2. Залить водой, накрыть крышкой.\n3. Томить на минимальном огне 2 часа.","bju":"Б:14,Ж:7,У:1"},
    {"name":"Осьминог с картофелем","calories":142,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"осьминог 100 г, картофель 80 г, лимонный сок, лавровый лист, соль","recipe":"1. Осьминога варить 60 минут с лавровым листом.\n2. Картофель отварить 20 минут.\n3. Осьминога нарезать кружками, подать с картофелем и лимонным соком.","bju":"Б:16,Ж:2,У:15"},
    {"name":"Кролик, томлёный в сливках","calories":145,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"мясо кролика 80 г, сливки 10% 30 мл, лук 20 г, вода 80 мл, лавровый лист, соль","recipe":"1. Кролика нарезать кусочками, обжарить на сухой сковороде 5 минут.\n2. Добавить лук, воду и лавровый лист, тушить 60 минут.\n3. Влить сливки, тушить ещё 15 минут.","bju":"Б:16,Ж:8,У:2"},
    
    {"name":"Спаржа с яйцом-пашот","calories":130,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"зелёная спаржа 150 г, яйцо 1 шт., пармезан 5 г, уксус 5 мл, соль","recipe":"1. Спаржу отварить 5 минут.\n2. Яйцо приготовить пашот (3 минуты в воде с уксусом).\n3. Выложить на спаржу, посыпать пармезаном.","bju":"Б:11,Ж:7,У:6"},
    {"name":"Салат с запечённой свёклой и козьим сыром","calories":155,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"запечённая свёкла 100 г, козий сыр 25 г, рукола 20 г, грецкий орех 5 г, бальзамический уксус 5 мл","recipe":"1. Свёклу нарезать ломтиками (запечь заранее).\n2. Выложить на руколу.\n3. Сверху крошёный сыр и орех, сбрызнуть уксусом.","bju":"Б:6,Ж:10,У:11"},
    {"name":"Сибас на пару","calories":107,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"филе сибаса 100 г, лимон, укроп, соль","recipe":"1. Филе посолить, сбрызнуть лимоном.\n2. Готовить на пару 12–15 минут.\n3. Посыпать укропом.","bju":"Б:20,Ж:3,У:0"},
    {"name":"Креветки на пару с брокколи и имбирём","calories":125,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"очищенные креветки 100 г, брокколи 100 г, имбирь 3 г, соевый соус 5 мл","recipe":"1. Брокколи разобрать на соцветия.\n2. Выложить в пароварку с креветками и имбирём.\n3. Готовить 10 минут, полить соевым соусом.","bju":"Б:21,Ж:1,У:7"},
    {"name":"Суп-пюре из спаржи","calories":128,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"спаржа 150 г, картофель 40 г, сливки 10% 50 мл, лук 15 г, вода 250 мл, соль","recipe":"1. Лук, картофель и спаржу варить в воде 20 минут.\n2. Пробить блендером.\n3. Добавить сливки и прогреть.","bju":"Б:5,Ж:6,У:12"},
    {"name":"Лосось с цукини","calories":137,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"филе лосося 50 г, цукини 150 г, лимонный сок, соль, перец","recipe":"1. Цукини нарезать лентами.\n2. Лосось запекать при 200 °C 12 минут.\n3. Цукини быстро обжарить на сухой сковороде 3 минуты.\n4. Подать вместе, сбрызнуть лимоном.","bju":"Б:12,Ж:7,У:6"},
    
    {"name":"Тигровые креветки с овощами в воке","calories":160,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"тигровые креветки 100 г, перец 50 г, брокколи 50 г, подсолнечное масло 4 г, соевый соус 5 мл","recipe":"1. Креветки очистить.\n2. Разогреть вок с маслом, жарить овощи 4 минуты.\n3. Добавить креветки, жарить 4 минуты.\n4. Полить соевым соусом.","bju":"Б:20,Ж:5,У:7"},
    {"name":"Тунец с авокадо","calories":156,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"свежий тунец 100 г, авокадо 30 г, лайм, соль","recipe":"1. Тунца обжарить на сухой сковороде по 1,5 минуты с каждой стороны.\n2. Авокадо нарезать ломтиками.\n3. Подать вместе, сбрызнуть лаймом.","bju":"Б:24,Ж:6,У:2"},
    {"name":"Говяжья вырезка гриль","calories":150,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"говяжья вырезка 100 г, соль, перец, розмарин","recipe":"1. Мясо замариновать с розмарином на 20 минут.\n2. Жарить на гриле по 3–4 минуты с каждой стороны.\n3. Дать отдохнуть 5 минут.","bju":"Б:21,Ж:7,У:0"},
    {"name":"Утка с апельсиновым соусом","calories":140,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"утиная грудка без кожи 100 г, апельсиновый сок 30 мл, мёд 3 г, соль","recipe":"1. Грудку обжарить по 4 минуты с каждой стороны.\n2. Сок смешать с мёдом, уварить до густоты 5 минут.\n3. Нарезать мясо, полить соусом.","bju":"Б:22,Ж:4,У:5"},
    {"name":"Гребешки с пюре из цветной капусты","calories":140,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"морской гребешок 100 г, цветная капуста 100 г, сливки 10% 20 мл, соль","recipe":"1. Капусту отварить 12 минут, пробить с горячими сливками в пюре.\n2. Гребешки обжарить на сухой сковороде по 1,5 минуты с каждой стороны.\n3. Подать на пюре.","bju":"Б:17,Ж:4,У:9"},
    {"name":"Мидии в сливочно-чесночном соусе","calories":146,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"мидии 150 г (мякоть), сливки 10% 30 мл, чеснок 1 зубчик, петрушка, соль","recipe":"1. Мидии разморозить или очистить свежие.\n2. Обжарить чеснок 30 секунд, добавить сливки.\n3. Положить мидии, тушить 5 минут.\n4. Посыпать петрушкой.","bju":"Б:18,Ж:6,У:5"},

    {"name":"Овсянка на молоке с бананом","calories":250,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"овсяные хлопья быстрого приготовления 40 г, молоко 1,5% 150 мл, банан 50 г, корица 1 г","recipe":"1. Молоко довести до кипения.\n2. Всыпать хлопья, варить 3–4 минуты, помешивая.\n3. Банан нарезать кружками, добавить сверху.\n4. Посыпать корицей.","bju":"Б:9,Ж:5,У:42"},
    {"name":"Овощной салат с яйцом и маслом","calories":210,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"огурец 100 г, помидор 100 г, яйцо варёное 1 шт., лук 15 г, подсолнечное масло 10 г, соль","recipe":"1. Овощи нарезать крупными кусочками, лук — тонкими полукольцами.\n2. Яйцо нарезать дольками (сварить заранее, 10 минут).\n3. Смешать, заправить маслом, посолить.","bju":"Б:8,Ж:17,У:8"},
    {"name":"Бутерброд с сыром и помидором","calories":210,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"хлеб 40 г, сыр 30 г, помидор 30 г","recipe":"1. Хлеб слегка подсушить.\n2. Выложить ломтики сыра и помидора.\n3. При желании подогреть 1 минуту в микроволновке.","bju":"Б:11,Ж:9,У:22"},
    {"name":"Кефир с бананом и овсянкой","calories":240,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"кефир 1% 200 мл, банан 100 г, овсяные хлопья 20 г","recipe":"1. Банан нарезать, смешать с кефиром.\n2. Добавить хлопья.\n3. Взбить блендером и дать постоять 5 минут.","bju":"Б:10,Ж:4,У:42"},
    {"name":"Яблоко с арахисовой пастой","calories":240,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"яблоко 250 г, арахисовая паста 20 г","recipe":"1. Яблоко вымыть, нарезать дольками.\n2. Арахисовую пасту выложить в пиалу для макания.","bju":"Б:5,Ж:10,У:33"},
    {"name":"Макароны с сыром","calories":240,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"макароны 40 г (сухие), сливочное масло 5 г, сыр 15 г, соль","recipe":"1. Макароны отварить 8–10 минут в подсоленной воде.\n2. Слить воду, добавить масло.\n3. Посыпать тёртым сыром и перемешать.","bju":"Б:9,Ж:10,У:29"},
    
    {"name":"Омлет из трёх яиц с помидором","calories":240,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"яйца 3 шт., помидор 30 г, подсолнечное масло 2 г, соль, зелень","recipe":"1. Яйца взбить с солью.\n2. Помидор нарезать кубиками.\n3. Разогреть сковороду с маслом, влить яйца, добавить помидор.\n4. Готовить под крышкой 4 минуты.","bju":"Б:19,Ж:17,У:3"},
    {"name":"Гречка с яйцом","calories":230,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"готовая гречка 120 г, яйцо 1 шт., сливочное масло 2 г, соль","recipe":"1. Гречку разогреть.\n2. Яйцо пожарить или сварить за 6 минут всмятку.\n3. Подавать вместе, посолить.","bju":"Б:12,Ж:8,У:28"},
    {"name":"Творог с бананом","calories":243,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"творог 5% 150 г, банан 70 г","recipe":"1. Банан нарезать кружками.\n2. Смешать с творогом.\n3. Подавать сразу.","bju":"Б:25,Ж:8,У:18"},
    {"name":"Бутерброд с яйцом и сыром","calories":235,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"хлеб 40 г, яйцо 1 шт., сыр 20 г","recipe":"1. Яйцо пожарить на антипригарной сковороде.\n2. Хлеб подсушить, сверху выложить сыр и яйцо.\n3. Подержать 1 минуту под крышкой, чтобы сыр подплавился.","bju":"Б:14,Ж:10,У:22"},
    {"name":"Рис с тунцом и огурцом","calories":205,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"рис готовый 100 г, тунец в собственном соку 60 г, огурец 40 г, зелень","recipe":"1. Рис разогреть.\n2. Тунец размять вилкой.\n3. Смешать с рисом и нарезанным огурцом.","bju":"Б:18,Ж:2,У:29"},
    {"name":"Куриные сосиски с гречкой","calories":232,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"куриные сосиски 2 шт. (80 г), готовая гречка 60 г","recipe":"1. Сосиски отварить 5 минут.\n2. Гречку разогреть.\n3. Подавать вместе.","bju":"Б:14,Ж:13,У:14"},
    
    {"name":"Постный борщ с фасолью","calories":225,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"свёкла 80 г, капуста 70 г, картофель 80 г, морковь 40 г, лук 20 г, варёная фасоль 40 г, томатная паста 10 г, подсолнечное масло 5 г, вода 400 мл, соль","recipe":"1. Свёклу, морковь и лук тушить с маслом и томатной пастой 15 минут.\n2. В кипящую воду положить картофель и фасоль, варить 15 минут.\n3. Добавить капусту и зажарку, варить 30 минут.\n4. Посолить, настоять 15 минут.","bju":"Б:7,Ж:6,У:36"},
    {"name":"Картофельная запеканка с морковью","calories":210,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"картофель 200 г, морковь 50 г, подсолнечное масло 5 г, соль","recipe":"1. Картофель и морковь отварить 20 минут, размять в пюре.\n2. Посолить, выложить в форму, смазанную маслом.\n3. Запекать при 190 °C 40 минут до румяной корочки.","bju":"Б:4,Ж:5,У:36"},
    {"name":"Пшённая каша с тыквой и мёдом","calories":215,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"пшено 45 г, тыква 150 г, мёд 8 г, вода 250 мл, соль","recipe":"1. Тыкву нарезать кубиками, варить 15 минут.\n2. Добавить промытое пшено, варить 30 минут.\n3. Настоять под крышкой 20 минут, добавить мёд.","bju":"Б:6,Ж:2,У:42"},
    {"name":"Печёный картофель с чесноком","calories":218,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"картофель 250 г, подсолнечное масло 3 г, чеснок 2 зубчика, зелень, соль","recipe":"1. Картофель вымыть, нарезать дольками.\n2. Смешать с маслом, чесноком и солью.\n3. Запекать при 200 °C 50 минут, переворачивая раз.\n4. Посыпать зеленью.","bju":"Б:5,Ж:3,У:42"},
    {"name":"Овощной суп с рисом и фасолью","calories":220,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"рис 25 г, варёная фасоль 50 г, картофель 60 г, морковь 30 г, подсолнечное масло 3 г, вода 400 мл, соль","recipe":"1. Фасоль и картофель варить 20 минут.\n2. Добавить морковь и рис.\n3. Варить 25 минут до готовности риса.\n4. Влить масло, посолить.","bju":"Б:6,Ж:3,У:41"},
    {"name":"Печёное яблоко с овсянкой и мёдом","calories":214,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"яблоко 200 г, овсяные хлопья 25 г, мёд 10 г, корица 1 г","recipe":"1. Яблоко разрезать пополам, вынуть сердцевину.\n2. Смешать хлопья с мёдом и корицей, заполнить углубления.\n3. Запекать при 180 °C 50 минут.","bju":"Б:3,Ж:2,У:46"},
    
    {"name":"Густой гороховый суп","calories":235,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"горох 60 г, картофель 50 г, морковь 30 г, лук 20 г, вода 450 мл, лавровый лист, соль","recipe":"1. Горох замочить на 3 часа, слить воду.\n2. Варить 60 минут до мягкости.\n3. Добавить картофель, морковь и лук, варить 25 минут.\n4. Посолить, добавить лавровый лист.","bju":"Б:14,Ж:1,У:43"},
    {"name":"Плов с курицей","calories":255,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"рис 40 г, куриное бедро без кожи 50 г, морковь 40 г, лук 20 г, подсолнечное масло 3 г, зира, соль","recipe":"1. Мясо, лук и морковь обжарить в масле 10 минут.\n2. Добавить зиру, соль и 100 мл воды, тушить 30 минут.\n3. Засыпать промытый рис, залить водой на 1 см выше.\n4. Готовить под крышкой 25 минут, не мешая.","bju":"Б:10,Ж:8,У:38"},
    {"name":"Тушёная чечевица с овощами","calories":220,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"чечевица 60 г, морковь 30 г, лук 20 г, вода 250 мл, куркума, соль","recipe":"1. Чечевицу промыть.\n2. Овощи нарезать, залить водой вместе с чечевицей.\n3. Тушить на слабом огне 50 минут до мягкости.\n4. Посолить, добавить куркуму.","bju":"Б:15,Ж:1,У:38"},
    {"name":"Куриная голень с картофелем","calories":228,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"куриная голень без кожи 150 г (с костью), картофель 100 г, морковь 30 г, лук 15 г, вода 100 мл, соль","recipe":"1. Голень обжарить на сухой сковороде 5 минут.\n2. Добавить лук, морковь, воду, тушить 30 минут.\n3. Добавить картофель кубиками, тушить 25 минут.","bju":"Б:22,Ж:8,У:17"},
    {"name":"Густой фасолевый суп","calories":215,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"сухая фасоль 50 г, картофель 50 г, морковь 30 г, лук 15 г, вода 450 мл, лавровый лист, соль","recipe":"1. Фасоль замочить на ночь.\n2. Варить 70 минут до мягкости.\n3. Добавить картофель, морковь и лук, варить 20 минут.\n4. Посолить.","bju":"Б:12,Ж:1,У:40"},
    {"name":"Перловка с куриной печенью","calories":230,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"перловка 40 г (сухая), куриная печень 60 г, лук 20 г, вода 200 мл, соль","recipe":"1. Перловку замочить на 3 часа.\n2. Варить 50 минут до мягкости.\n3. Печень с луком тушить 12 минут.\n4. Смешать с кашей, посолить.","bju":"Б:14,Ж:5,У:31"},
    
    {"name":"Овсянка на воде с яблоком","calories":210,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"овсяные хлопья 50 г, яблоко 80 г, вода 200 мл, корица 1 г, соль","recipe":"1. Воду довести до кипения, всыпать хлопья.\n2. Варить 15 минут на слабом огне.\n3. Яблоко нарезать кубиками, добавить за 3 минуты до конца.\n4. Посыпать корицей.","bju":"Б:6,Ж:3,У:38"},
    {"name":"Картофельное пюре на молоке","calories":215,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"картофель 200 г, молоко 50 мл, сливочное масло 5 г, соль","recipe":"1. Картофель очистить, отварить 20 минут.\n2. Слить воду, размять с тёплым молоком и маслом.\n3. Посолить.","bju":"Б:5,Ж:5,У:36"},
    {"name":"Блины с яблочным пюре","calories":215,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"мука 30 г, молоко 60 мл, яйцо 1/3 шт., масло 3 г, яблочное пюре 80 г","recipe":"1. Замесить жидкое тесто из муки, молока и яйца.\n2. Жарить тонкие блины на смазанной сковороде по 1 минуте с каждой стороны.\n3. Подавать с пюре.","bju":"Б:6,Ж:5,У:35"},
    {"name":"Макароны с томатным соусом","calories":232,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"макароны 50 г (сухие), томатный соус 80 г, подсолнечное масло 3 г, базилик","recipe":"1. Макароны отварить 9 минут.\n2. Соус прогреть с маслом 5 минут.\n3. Смешать с пастой, посыпать базиликом.","bju":"Б:7,Ж:4,У:42"},
    {"name":"Рис с овощами","calories":250,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"рис 50 г (сухой), овощная смесь 100 г, подсолнечное масло 3 г, соль","recipe":"1. Рис отварить 15 минут.\n2. Овощную смесь обжарить 7 минут.\n3. Смешать, посолить.","bju":"Б:5,Ж:3,У:50"},
    {"name":"Морковно-картофельные котлеты","calories":205,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"картофель 120 г, морковь 60 г, мука 15 г, подсолнечное масло 5 г, соль","recipe":"1. Картофель и морковь отварить, размять.\n2. Добавить муку и соль, сформировать котлеты.\n3. Обжарить по 3 минуты с каждой стороны.","bju":"Б:4,Ж:5,У:35"},
    
    {"name":"Куриная грудка с рисом","calories":225,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"куриная грудка 90 г, рис отварной 100 г, соль, перец","recipe":"1. Грудку нарезать, посолить и поперчить.\n2. Обжарить на антипригарной сковороде 10 минут.\n3. Подавать с рисом.","bju":"Б:23,Ж:2,У:28"},
    {"name":"Рыбная котлета с картофелем","calories":245,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"филе минтая 100 г, манка 8 г, лук 10 г, картофель 120 г, подсолнечное масло 5 г, соль","recipe":"1. Рыбу и лук прокрутить, добавить манку и соль.\n2. Сформировать котлету, обжарить по 4 минуты с каждой стороны.\n3. Картофель отварить 20 минут, подавать вместе.","bju":"Б:17,Ж:7,У:27"},
    {"name":"Макароны по-флотски с куриным фаршем","calories":240,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"макароны 40 г (сухие), куриный фарш 60 г, лук 10 г, подсолнечное масло 3 г, соль","recipe":"1. Макароны отварить.\n2. Лук и фарш обжарить 10 минут.\n3. Смешать с макаронами, посолить.","bju":"Б:15,Ж:6,У:33"},
    {"name":"Куриные котлеты с гречкой","calories":220,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"куриная котлета 80 г (фарш, лук, соль), готовая гречка 80 г","recipe":"1. Фарш смешать с луком и солью, сформировать котлету.\n2. Запекать при 200 °C 20 минут.\n3. Подавать с гречкой.","bju":"Б:19,Ж:7,У:20"},
    {"name":"Ленивые голубцы с говяжьим фаршем","calories":205,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"капуста 100 г, говяжий фарш 70 г, рис 15 г (сухой), томатная паста 10 г, вода 80 мл, соль","recipe":"1. Капусту порубить, ошпарить.\n2. Смешать с фаршем, рисом и солью, сформировать котлетки.\n3. Тушить в воде с томатной пастой 30 минут.","bju":"Б:13,Ж:9,У:17"},
    {"name":"Жареная картошка с яйцом","calories":230,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"картофель 150 г, яйцо 1 шт., подсолнечное масло 5 г, соль","recipe":"1. Картофель нарезать брусочками.\n2. Обжарить на масле 15 минут.\n3. Разбить яйцо поверх, накрыть крышкой на 3 минуты.","bju":"Б:8,Ж:11,У:25"},
    
    {"name":"Салат с авокадо и яйцом","calories":210,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"авокадо 80 г, яйцо варёное 1 шт., помидор 50 г, лимонный сок, соль","recipe":"1. Авокадо и яйцо нарезать кубиками.\n2. Добавить помидор.\n3. Заправить лимонным соком и солью.","bju":"Б:8,Ж:18,У:6"},
    {"name":"Салат с киноа и овощами","calories":235,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"киноа готовая 80 г, огурец 80 г, помидор 80 г, фета 15 г, оливковое масло 8 г","recipe":"1. Овощи нарезать кубиками.\n2. Смешать с киноа и крошёной фетой.\n3. Заправить маслом.","bju":"Б:7,Ж:13,У:22"},
    {"name":"Капрезе","calories":215,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"помидор 150 г, моцарелла 50 г, оливковое масло 5 г, базилик, соль","recipe":"1. Помидор и моцареллу нарезать кружками.\n2. Выложить чередуя.\n3. Полить маслом, посыпать базиликом.","bju":"Б:11,Ж:16,У:6"},
    {"name":"Хумус с овощами и хлебцем","calories":205,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"хумус 60 г, морковь 80 г, огурец 80 г, хлебцы 20 г","recipe":"1. Овощи нарезать брусочками.\n2. Хумус выложить в пиалу.\n3. Подавать с овощами и хлебцами.","bju":"Б:6,Ж:7,У:28"},
    {"name":"Тост с авокадо и яйцом-пашот","calories":240,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"хлеб цельнозерновой 40 г, авокадо 40 г, яйцо 1 шт., уксус 5 мл, соль","recipe":"1. Хлеб подсушить.\n2. Авокадо размять и намазать на хлеб.\n3. Яйцо приготовить пашот (3 минуты).\n4. Выложить сверху.","bju":"Б:11,Ж:13,У:21"},
    {"name":"Салат из тунца, фасоли и лука","calories":205,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"тунец 60 г, консервированная фасоль 80 г, красный лук 15 г, оливковое масло 8 г, лимон, петрушка","recipe":"1. Фасоль промыть, тунец размять.\n2. Лук нарезать тонко.\n3. Смешать, заправить маслом и лимоном.","bju":"Б:17,Ж:9,У:14"},
    
    {"name":"Скрэмбл с лососем","calories":223,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"яйца 2 шт., слабосолёный лосось 40 г, зелёный лук 3 г","recipe":"1. Яйца взбить.\n2. Готовить на антипригарной сковороде 3 минуты, помешивая.\n3. Добавить кусочки лосося, посыпать луком.","bju":"Б:21,Ж:15,У:1"},
    {"name":"Куриная грудка гриль с киноа","calories":220,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"куриная грудка 100 г, киноа готовая 70 г, оливковое масло 3 г, соль, перец","recipe":"1. Грудку разрезать пополам вдоль, посолить.\n2. Жарить на гриле по 4 минуты с каждой стороны.\n3. Подавать с киноа.","bju":"Б:27,Ж:5,У:16"},
    {"name":"Креветки с рисом и чесноком","calories":235,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"очищенные креветки 100 г, рис готовый 80 г, чеснок 1 зубчик, подсолнечное масло 4 г","recipe":"1. Чеснок обжарить в масле 30 секунд.\n2. Добавить креветки, жарить 3 минуты.\n3. Добавить рис, прогреть 2 минуты.","bju":"Б:22,Ж:6,У:24"},
    {"name":"Яичница с ветчиной и сыром","calories":245,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"яйца 2 шт., ветчина из индейки 30 г, сыр 20 г","recipe":"1. Ветчину слегка обжарить.\n2. Разбить яйца, готовить 3 минуты.\n3. Посыпать сыром, накрыть крышкой на 1 минуту.","bju":"Б:22,Ж:17,У:2"},
    {"name":"Куриный бургер лайт","calories":235,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"куриная котлета 80 г, цельнозерновая булочка 40 г, салат 20 г, помидор 20 г","recipe":"1. Котлету обжарить на сухой сковороде по 4 минуты с каждой стороны.\n2. Булочку подсушить.\n3. Собрать бургер с салатом и помидором.","bju":"Б:22,Ж:7,У:22"},
    {"name":"Тосты с творожным сыром и лососем","calories":240,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"хлеб 50 г, слабосолёный лосось 40 г, творожный сыр 15 г, укроп","recipe":"1. Хлеб подсушить.\n2. Намазать сыром.\n3. Сверху лосось и укроп.","bju":"Б:15,Ж:10,У:24"},
    

    {"name":"Овощное рагу с нутом","calories":205,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"нут 25 г (сухой), кабачок 100 г, баклажан 100 г, помидор 100 г, оливковое масло 5 г, соль","recipe":"1. Нут замочить на ночь, отварить 60 минут.\n2. Овощи нарезать, тушить в масле 25 минут.\n3. Добавить нут, тушить 15 минут, посолить.","bju":"Б:8,Ж:7,У:28"},
    {"name":"Запечённый баклажан с моцареллой","calories":205,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"баклажан 200 г, моцарелла 40 г, помидор 80 г, базилик, соль","recipe":"1. Баклажан нарезать вдоль ломтями, запечь 25 минут при 200 °C.\n2. Сверху выложить помидор и моцареллу.\n3. Запекать ещё 20 минут, посыпать базиликом.","bju":"Б:13,Ж:12,У:11"},
    {"name":"Суп-пюре из чечевицы и тыквы","calories":205,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"красная чечевица 30 г, тыква 150 г, сливки 10% 50 мл, вода 300 мл, соль","recipe":"1. Чечевицу и тыкву варить в воде 45 минут.\n2. Пробить блендером.\n3. Влить сливки, посолить, прогреть.","bju":"Б:9,Ж:6,У:27"},
    {"name":"Запечённая тыква с нутом и фетой","calories":225,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"тыква 200 г, варёный нут 50 г, фета 25 г, оливковое масло 3 г, тимьян","recipe":"1. Тыкву нарезать кубиками, смешать с нутом, маслом и тимьяном.\n2. Запекать при 200 °C 50 минут.\n3. Сверху крошёная фета, запекать ещё 5 минут.","bju":"Б:9,Ж:10,У:24"},
    {"name":"Лазанья из кабачка","calories":220,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"кабачок 200 г, фарш из индейки 60 г, помидор 80 г, сыр 25 г, соль","recipe":"1. Кабачок нарезать продольно пластинами.\n2. Фарш обжарить с помидором 10 минут.\n3. Слоями выложить кабачок и фарш, сверху сыр.\n4. Запекать при 190 °C 45 минут.","bju":"Б:17,Ж:12,У:10"},
    {"name":"Фаршированный перец с рисом и овощами","calories":215,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"болгарский перец 200 г, рис 30 г (сухой), морковь 30 г, томатная паста 15 г, подсолнечное масло 3 г","recipe":"1. Рис отварить до полуготовности.\n2. Морковь обжарить, смешать с рисом.\n3. Перец нафаршировать, залить разведённой томатной пастой.\n4. Тушить или запекать 50 минут.","bju":"Б:5,Ж:3,У:42"},
    
    {"name":"Куриная грудка с картофелем в духовке","calories":205,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"куриная грудка 100 г, картофель 120 г, чеснок, паприка, соль","recipe":"1. Грудку замариновать с чесноком и паприкой на 1 час.\n2. Картофель нарезать дольками.\n3. Запекать в рукаве при 190 °C 50 минут.","bju":"Б:24,Ж:2,У:21"},
    {"name":"Говядина, тушёная с картофелем","calories":210,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"говядина 70 г, картофель 100 г, морковь 40 г, лук 15 г, вода 100 мл, соль","recipe":"1. Мясо нарезать кубиками, тушить с водой 60 минут.\n2. Добавить лук, морковь и картофель.\n3. Тушить 30 минут, посолить.","bju":"Б:15,Ж:7,У:22"},
    {"name":"Свинина, тушёная с капустой","calories":205,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"свиная вырезка 80 г, капуста 150 г, картофель 60 г, подсолнечное масло 3 г, соль","recipe":"1. Мясо нарезать, обжарить 5 минут.\n2. Добавить капусту, картофель и 80 мл воды.\n3. Тушить под крышкой 50 минут, посолить.","bju":"Б:18,Ж:7,У:18"},
    {"name":"Хек, запечённый со сметаной","calories":215,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"филе хека 150 г, сметана 15% 30 г, лук 20 г, картофель 60 г, соль","recipe":"1. Рыбу посолить, замариновать с луком 30 минут.\n2. Выложить в форму с картофелем.\n3. Полить сметаной.\n4. Запекать при 190 °C 35 минут.","bju":"Б:28,Ж:8,У:9"},
    {"name":"Плов с индейкой","calories":270,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"рис 45 г, филе индейки 60 г, морковь 40 г, лук 20 г, подсолнечное масло 3 г, зира, соль","recipe":"1. Индейку обжарить с овощами 8 минут.\n2. Добавить воду и зиру, тушить 40 минут.\n3. Засыпать рис, готовить под крышкой 25 минут.","bju":"Б:13,Ж:5,У:44"},
    {"name":"Куриное рагу с овощами","calories":215,"cost":2,"gotofnost":3,"sutnost":2,"ingredients":"куриное бедро без кожи 100 г, картофель 100 г, морковь 40 г, помидор 40 г, вода 100 мл, соль","recipe":"1. Курицу обжарить на сухой сковороде 5 минут.\n2. Добавить овощи и воду.\n3. Тушить под крышкой 50 минут.","bju":"Б:18,Ж:7,У:18"},
    
    {"name":"Крем-суп из цветной капусты с сыром","calories":225,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"цветная капуста 150 г, картофель 40 г, сливки 10% 60 мл, сыр 25 г, вода 250 мл, соль","recipe":"1. Капусту и картофель варить 20 минут.\n2. Пробить блендером.\n3. Добавить сливки и сыр, прогреть до растворения сыра.","bju":"Б:11,Ж:13,У:14"},
    {"name":"Паста с цукини и томатом","calories":240,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"паста 50 г (сухая), цукини 100 г, помидор 60 г, оливковое масло 3 г, чеснок, базилик","recipe":"1. Пасту отварить 9 минут.\n2. Цукини и помидор тушить с чесноком 10 минут.\n3. Смешать, посыпать базиликом.","bju":"Б:8,Ж:4,У:44"},
    {"name":"Грибное ризотто (малая порция)","calories":240,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"рис арборио 40 г, шампиньоны 80 г, пармезан 10 г, сливочное масло 5 г, овощной бульон 200 мл","recipe":"1. Грибы обжарить 5 минут, добавить рис.\n2. Понемногу вливать горячий бульон, помешивая, 20 минут.\n3. В конце добавить масло и пармезан.","bju":"Б:7,Ж:8,У:36"},
    {"name":"Блинчики с творогом","calories":210,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"мука 30 г, молоко 50 мл, яйцо 1/3 шт., творог 5% 50 г, ванилин","recipe":"1. Испечь 2 тонких блина.\n2. Творог смешать с ванилином, завернуть в блины.\n3. Прогреть на сковороде 1 минуту.","bju":"Б:12,Ж:6,У:25"},
    {"name":"Овощной крем-суп со сливками","calories":215,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"картофель 100 г, морковь 50 г, лук 30 г, сливки 10% 70 мл, вода 250 мл, соль","recipe":"1. Овощи нарезать, варить 20 минут.\n2. Пробить блендером.\n3. Влить сливки, посолить, прогреть.","bju":"Б:5,Ж:9,У:28"},
    {"name":"Салат с булгуром и нутом","calories":215,"cost":2,"gotofnost":2,"sutnost":1,"ingredients":"булгур 30 г (сухой), варёный нут 30 г, огурец 40 г, помидор 40 г, оливковое масло 5 г, лимон, мята","recipe":"1. Булгур залить кипятком (1:2) на 20 минут.\n2. Смешать с нутом и нарезанными овощами.\n3. Заправить маслом, лимоном, мятой.","bju":"Б:7,Ж:6,У:32"},
    
    {"name":"Куриное филе с киноа и брокколи","calories":230,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"куриная грудка 100 г, киноа 25 г (сухая), брокколи 60 г, оливковое масло 3 г","recipe":"1. Киноа отварить 15 минут.\n2. Грудку нарезать и обжарить 8 минут.\n3. Брокколи отварить 5 минут.\n4. Подавать вместе.","bju":"Б:28,Ж:6,У:17"},
    {"name":"Куриные котлеты с пюре","calories":235,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"куриный фарш 100 г, лук 10 г, картофель 100 г, молоко 20 мл, соль","recipe":"1. Фарш смешать с луком, сформировать 2 котлеты.\n2. Запекать при 200 °C 20 минут.\n3. Картофель отварить, размять с молоком.","bju":"Б:22,Ж:8,У:17"},
    {"name":"Паста с куриной грудкой и томатом","calories":235,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"паста 40 г (сухая), куриная грудка 60 г, помидор 80 г, чеснок, базилик","recipe":"1. Пасту отварить.\n2. Грудку нарезать, обжарить 7 минут.\n3. Добавить помидор и чеснок, тушить 5 минут.\n4. Смешать с пастой.","bju":"Б:18,Ж:3,У:34"},
    {"name":"Омлет с овощами и сыром","calories":225,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"яйца 2 шт., сыр 20 г, перец 40 г, зелень, соль","recipe":"1. Перец нарезать, обжарить 3 минуты.\n2. Залить взбитыми яйцами.\n3. Посыпать сыром, готовить под крышкой 5 минут.","bju":"Б:17,Ж:16,У:4"},
    {"name":"Гречка с грибами и курицей","calories":245,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"гречка 50 г (сухая), куриное филе 50 г, шампиньоны 60 г, лук 15 г, соль","recipe":"1. Гречку отварить 15 минут.\n2. Филе, лук и грибы обжарить 10 минут.\n3. Смешать с гречкой.","bju":"Б:16,Ж:4,У:38"},
    {"name":"Борщ с говядиной","calories":225,"cost":2,"gotofnost":2,"sutnost":2,"ingredients":"говядина 50 г, свёкла 80 г, капуста 70 г, картофель 70 г, морковь 30 г, сметана 10 г, подсолнечное масло 3 г, вода 350 мл","recipe":"1. Мясо варить 30 минут (можно заранее).\n2. Добавить картофель и капусту, варить 12 минут.\n3. Свёклу и морковь обжарить с маслом, добавить в суп.\n4. Варить ещё 10 минут, подавать со сметаной.","bju":"Б:10,Ж:7,У:30"},
    
    {"name":"Салат с лососем и авокадо","calories":215,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"слабосолёный лосось 50 г, авокадо 60 г, салатные листья 40 г, лимонный сок","recipe":"1. Авокадо и лосось нарезать.\n2. Выложить на салатные листья.\n3. Сбрызнуть лимонным соком.","bju":"Б:11,Ж:17,У:6"},
    {"name":"Тартар из лосося с авокадо","calories":245,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"свежий лосось 80 г, авокадо 50 г, лайм 1/4 шт., соевый соус 3 мл, кунжут 1 г","recipe":"1. Лосось и авокадо нарезать мелкими кубиками.\n2. Смешать с лаймом и соевым соусом.\n3. Выложить формой, посыпать кунжутом.","bju":"Б:17,Ж:18,У:3"},
    {"name":"Креветочный коктейль с авокадо","calories":210,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"креветки 100 г, авокадо 70 г, огурец 40 г, лимонный сок, укроп","recipe":"1. Креветки отварить 3 минуты, остудить.\n2. Авокадо и огурец нарезать кубиками.\n3. Смешать в бокале, сбрызнуть лимоном.","bju":"Б:19,Ж:12,У:6"},
    {"name":"Рулеты из лосося с творожным сыром","calories":220,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"слабосолёный лосось 70 г, творожный сыр 30 г, укроп, огурец 30 г","recipe":"1. Ломтики лосося смазать творожным сыром.\n2. Положить полоску огурца и укроп.\n3. Свернуть рулетом.","bju":"Б:15,Ж:17,У:2"},
    {"name":"Карпаччо из говядины с пармезаном","calories":220,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"говяжья вырезка 70 г, пармезан 15 г, рукола 20 г, оливковое масло 5 г, лимон","recipe":"1. Вырезку подморозить 30 минут, нарезать тончайшими ломтиками.\n2. Выложить на тарелку, сверху руколу и стружку пармезана.\n3. Полить маслом и лимоном.","bju":"Б:20,Ж:14,У:2"},
    {"name":"Сашими из тунца с авокадо","calories":225,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"свежий тунец 100 г, авокадо 70 г, соевый соус 5 мл, васаби, имбирь маринованный","recipe":"1. Тунца нарезать ломтиками толщиной 1 см.\n2. Авокадо нарезать дольками.\n3. Выложить на тарелку, подать с соевым соусом.","bju":"Б:25,Ж:12,У:4"},
    
    {"name":"Стейк из лосося","calories":250,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"филе лосося 120 г, лимон, соль, перец","recipe":"1. Рыбу посолить и поперчить.\n2. Жарить на антипригарной сковороде кожей вниз 5 минут.\n3. Перевернуть и жарить 3 минуты.","bju":"Б:24,Ж:17,У:0"},
    {"name":"Тигровые креветки с рисом и лаймом","calories":240,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"тигровые креветки 120 г, рис готовый 80 г, лайм 1/2 шт., чеснок, подсолнечное масло 3 г","recipe":"1. Креветки обжарить с чесноком 4 минуты.\n2. Добавить рис, прогреть.\n3. Сбрызнуть лаймом.","bju":"Б:26,Ж:4,У:24"},
    {"name":"Тунец с киноа и спаржей","calories":225,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"свежий тунец 120 г, киноа готовая 60 г, спаржа 100 г, соль","recipe":"1. Спаржу отварить 4 минуты.\n2. Тунца обжарить по 1,5 минуты с каждой стороны.\n3. Подавать с киноа.","bju":"Б:30,Ж:3,У:20"},
    {"name":"Говяжья вырезка со шпинатом","calories":210,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"говяжья вырезка 120 г, шпинат 80 г, чеснок, соль, перец","recipe":"1. Мясо посолить и поперчить.\n2. Жарить по 3 минуты с каждой стороны.\n3. Шпинат прогреть с чесноком 2 минуты, подать вместе.","bju":"Б:27,Ж:11,У:2"},
    {"name":"Гребешки с гороховым пюре","calories":210,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"морской гребешок 120 г, зелёный горошек 80 г, сливочное масло 5 г, мята, соль","recipe":"1. Горошек отварить 3 минуты, пробить с маслом и мятой.\n2. Гребешки обжарить по 1,5 минуты с каждой стороны.\n3. Подать на пюре.","bju":"Б:22,Ж:7,У:13"},
    {"name":"Утиная грудка с картофелем","calories":205,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"утиная грудка без кожи 100 г, картофель отварной 100 г, соль, розмарин","recipe":"1. Грудку разрезать пополам вдоль, посолить.\n2. Жарить по 4 минуты с каждой стороны.\n3. Подавать с отварным картофелем.","bju":"Б:23,Ж:4,У:17"},
    
    {"name":"Ризотто с белыми грибами","calories":230,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"рис арборио 35 г, свежие белые грибы 80 г, пармезан 10 г, сливочное масло 4 г, овощной бульон 250 мл","recipe":"1. Грибы томить 20 минут с небольшим количеством бульона.\n2. Добавить рис и постепенно вливать бульон 25 минут.\n3. Добавить масло и пармезан.","bju":"Б:7,Ж:9,У:32"},
    {"name":"Крем-суп из белых грибов с гренками","calories":215,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"белые грибы 100 г, картофель 50 г, сливки 10% 80 мл, хлеб (гренки) 15 г, вода 250 мл","recipe":"1. Грибы и картофель варить 40 минут.\n2. Пробить блендером, влить сливки.\n3. Хлеб подсушить в духовке, подать с супом.","bju":"Б:7,Ж:9,У:25"},
    {"name":"Севиче из лосося с авокадо","calories":220,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"свежий лосось 60 г, авокадо 60 г, лайм 1 шт., красный лук 10 г, кинза","recipe":"1. Лосось нарезать кубиками, залить соком лайма.\n2. Мариновать в холодильнике 2 часа.\n3. Добавить авокадо, лук и кинзу.","bju":"Б:12,Ж:17,У:4"},
    {"name":"Цветная капуста, запечённая с пармезаном","calories":215,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"цветная капуста 250 г, пармезан 20 г, оливковое масло 5 г, трюфельное масло 2 г, соль","recipe":"1. Капусту разобрать на соцветия, смешать с маслом.\n2. Запекать при 200 °C 40 минут.\n3. Посыпать пармезаном, запекать ещё 10 минут.\n4. Капнуть трюфельным маслом.","bju":"Б:11,Ж:12,У:13"},
    {"name":"Лосось, маринованный в свёкле","calories":215,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"филе лосося 80 г, свёкла 30 г, соль 3 г, укроп, хлебец 15 г","recipe":"1. Свёклу натереть, смешать с солью и укропом.\n2. Обмазать рыбу, завернуть в плёнку.\n3. Выдержать в холодильнике 24 часа.\n4. Нарезать тонкими ломтями, подать на хлебце.","bju":"Б:17,Ж:11,У:11"},
    {"name":"Паэлья с морепродуктами","calories":255,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"рис 40 г (сухой), креветки 40 г, мидии 40 г, кальмар 30 г, помидор 40 г, оливковое масло 3 г, шафран","recipe":"1. Кальмар и помидор тушить 10 минут.\n2. Добавить рис и шафран, залить бульоном.\n3. Варить 20 минут, затем положить креветки и мидии.\n4. Накрыть и настоять 10 минут.","bju":"Б:18,Ж:5,У:35"},
    
    {"name":"Томлёные говяжьи щёчки","calories":210,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"говяжьи щёчки 100 г, морковь 30 г, лук 20 г, вода 150 мл, лавровый лист, соль","recipe":"1. Щёчки обжарить на сухой сковороде 5 минут.\n2. Добавить овощи, воду и лавровый лист.\n3. Тушить под крышкой на слабом огне 3 часа.","bju":"Б:24,Ж:11,У:6"},
    {"name":"Томлёная баранья нога","calories":200,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"баранина (нога) 100 г, чеснок 2 зубчика, розмарин, вода 100 мл, соль","recipe":"1. Мясо натереть чесноком, розмарином и солью.\n2. Залить водой, закрыть фольгой.\n3. Томить в духовке при 150 °C 2,5 часа.","bju":"Б:20,Ж:12,У:3"},
    {"name":"Томлёное утиное бедро без кожи","calories":200,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"утиное бедро без кожи 120 г, тимьян, чеснок, вода 100 мл, соль","recipe":"1. Мясо посолить, добавить чеснок и тимьян.\n2. Залить водой, накрыть.\n3. Томить при 160 °C 2 часа.","bju":"Б:22,Ж:11,У:3"},
    {"name":"Лосось, запечённый на доске","calories":250,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"филе лосося 120 г, лимон, укроп, мёд 3 г, соль","recipe":"1. Кедровую или кленовую доску замочить в воде на 1 час.\n2. Выложить на неё лосось, сбрызнуть лимоном.\n3. Запекать при 180 °C 25 минут.","bju":"Б:24,Ж:17,У:0"},
    {"name":"Осьминог с картофелем и паприкой","calories":230,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"осьминог 120 г, картофель 120 г, подсолнечное масло 5 г, паприка, соль","recipe":"1. Осьминога варить 60 минут до мягкости.\n2. Картофель отварить и нарезать кружками.\n3. Осьминога нарезать, обжарить 3 минуты с паприкой.","bju":"Б:20,Ж:6,У:22"},

    {"name":"Перловка с курицей и грибами","calories":330,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"перловка 60 г (сухая), куриное филе 70 г, шампиньоны 60 г, лук 20 г, соль","recipe":"1. Перловку замочить на 3 часа, варить 50 минут.\n2. Курицу, лук и грибы обжарить 12 минут.\n3. Смешать с кашей.","bju":"Б:20,Ж:6,У:50"},

    {"name":"Тартар из говядины с желтком","calories":355,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"говяжья вырезка 100 г, желток 1 шт., хлеб 30 г, каперсы 5 г, оливковое масло 8 г, горчица","recipe":"1. Вырезку мелко нарубить ножом.\n2. Смешать с каперсами, горчицей и маслом.\n3. Выложить кольцом, сверху желток.\n4. Подавать с хлебом.","bju":"Б:25,Ж:22,У:17"},
    {"name":"Крабовый салат с авокадо и рисом","calories":320,"cost":3,"gotofnost":1,"sutnost":1,"ingredients":"мясо краба 100 г, авокадо 80 г, готовый рис 60 г, огурец 40 г, лимонный сок","recipe":"1. Краба разобрать на волокна.\n2. Авокадо и огурец нарезать кубиками.\n3. Смешать с рисом, добавить лимонный сок.","bju":"Б:16,Ж:17,У:26"},
    

    {"name":"Лосось с картофелем и спаржей","calories":345,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"филе лосося 120 г, спаржа 80 г, готовый отварной картофель 100 г, лимон, соль","recipe":"1. Лосось обжарить кожей вниз 5 минут, перевернуть на 3 минуты.\n2. Спаржу отварить 4 минуты.\n3. Подавать с картофелем и лимоном.","bju":"Б:27,Ж:17,У:21"},
    {"name":"Стейк из тунца с рисом и овощами","calories":335,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"свежий тунец 150 г, готовый рис 100 г, овощи 80 г, соевый соус 5 мл","recipe":"1. Тунца обжарить по 1,5 минуты с каждой стороны.\n2. Овощи обжарить 4 минуты.\n3. Подавать с рисом, полить соевым соусом.","bju":"Б:38,Ж:4,У:37"},
    {"name":"Тигровые креветки с пастой и чесноком","calories":355,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"тигровые креветки 150 г, паста 50 г (сухая), оливковое масло 5 г, чеснок, петрушка","recipe":"1. Пасту отварить 8 минут.\n2. Креветки обжарить с чесноком 4 минуты.\n3. Смешать с пастой, посыпать петрушкой.","bju":"Б:34,Ж:7,У:38"},

    {"name":"Гребешки с рисом и спаржей","calories":335,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"морской гребешок 150 г, готовый рис 120 г, спаржа 60 г, сливочное масло 5 г","recipe":"1. Гребешки обжарить по 1,5 минуты с каждой стороны.\n2. Спаржу отварить 4 минуты.\n3. Подавать с рисом.","bju":"Б:28,Ж:7,У:38"},
    {"name":"Утка с яблоком и гречкой","calories":325,"cost":3,"gotofnost":1,"sutnost":2,"ingredients":"утиная грудка без кожи 120 г, яблоко 50 г, готовая гречка 120 г","recipe":"1. Грудку разрезать пополам, жарить по 4 минуты с каждой стороны.\n2. Яблоко нарезать дольками, обжарить 2 минуты.\n3. Подавать с гречкой.","bju":"Б:32,Ж:6,У:36"},
    

    {"name":"Ризотто с белыми грибами и трюфелем","calories":365,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"рис арборио 60 г, белые грибы 100 г, пармезан 15 г, сливочное масло 5 г, трюфельное масло 2 г, овощной бульон 350 мл","recipe":"1. Грибы томить 20 минут.\n2. Добавить рис и постепенно вливать бульон 25 минут.\n3. Добавить масло и пармезан.\n4. Капнуть трюфельным маслом.","bju":"Б:11,Ж:14,У:49"},
    {"name":"Крем-суп из креветок","calories":345,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"креветки 80 г, сливки 10% 100 мл, картофель 60 г, сливочное масло 5 г, хлеб 30 г, вода 250 мл","recipe":"1. Из панцирей и воды сварить бульон 40 минут, процедить.\n2. Сварить в нём картофель.\n3. Добавить креветки на 3 минуты, пробить блендером со сливками.\n4. Подавать с хлебом.","bju":"Б:16,Ж:17,У:32"},
    {"name":"Гравлакс с картофелем","calories":320,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"филе лосося 100 г, соль 4 г, сахар 2 г, укроп, отварной картофель 150 г","recipe":"1. Лосось натереть солью, сахаром и укропом.\n2. Завернуть в плёнку, выдержать в холодильнике 24 часа.\n3. Нарезать тонкими ломтями, подать с картофелем.","bju":"Б:23,Ж:14,У:24"},
    {"name":"Севиче из морепродуктов с бататом","calories":310,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"креветки 60 г, гребешок 60 г, кальмар 40 г, батат 100 г, авокадо 30 г, лайм 1 шт., красный лук, кинза","recipe":"1. Морепродукты нарезать, залить лаймом на 1,5 часа.\n2. Батат запечь или отварить 25 минут.\n3. Подавать с авокадо, луком и кинзой.","bju":"Б:28,Ж:7,У:32"},
    {"name":"Домашние равиоли со шпинатом и рикоттой","calories":330,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"мука 60 г, яйцо 1/2 шт., рикотта 50 г, шпинат 40 г, соль","recipe":"1. Замесить тесто из муки и яйца, оставить на 40 минут.\n2. Начинку смешать из рикотты и шпината.\n3. Раскатать тесто, сформировать равиоли.\n4. Варить 4 минуты.","bju":"Б:16,Ж:10,У:42"},
    {"name":"Запечённые овощи с козьим сыром и киноа","calories":350,"cost":3,"gotofnost":3,"sutnost":1,"ingredients":"козий сыр 40 г, киноа 60 г (готовая), овощи 150 г, оливковое масло 8 г, грецкий орех 5 г","recipe":"1. Овощи нарезать, смешать с маслом, запекать 40 минут при 200 °C.\n2. Киноа отварить.\n3. Собрать, добавить сыр и орех.","bju":"Б:13,Ж:24,У:24"},
    

    {"name":"Томлёные говяжьи щёчки с пюре","calories":315,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"говяжьи щёчки 120 г, картофель 100 г, морковь 30 г, лук 20 г, лавровый лист","recipe":"1. Щёчки обжарить 5 минут, добавить овощи и воду.\n2. Тушить под крышкой на слабом огне 3 часа.\n3. Картофель отварить и размять в пюре.","bju":"Б:30,Ж:13,У:17"},
    {"name":"Баранья нога с кускусом","calories":340,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"баранина 100 г, кускус 40 г (сухой), чеснок, розмарин, соль","recipe":"1. Мясо натереть чесноком и розмарином.\n2. Томить в духовке при 150 °C 2,5 часа.\n3. Кускус залить кипятком (1:1) на 5 минут.","bju":"Б:25,Ж:13,У:32"},
    {"name":"Утиная ножка без кожи с картофелем","calories":320,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"утиное бедро без кожи 140 г, картофель 120 г, тимьян, соль","recipe":"1. Мясо посолить, добавить тимьян.\n2. Запекать при 160 °C 2 часа с картофелем.","bju":"Б:31,Ж:12,У:22"},
    {"name":"Лосось с картофелем в сливках","calories":365,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"филе лосося 120 г, картофель 100 г, сливки 10% 30 мл, укроп, соль","recipe":"1. Картофель нарезать ломтиками, запекать 25 минут.\n2. Сверху положить лосось, залить сливками.\n3. Запекать при 180 °C 30 минут.","bju":"Б:27,Ж:22,У:17"},
    {"name":"Осьминог с картофелем и маслом","calories":315,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"осьминог 150 г, картофель 150 г, оливковое масло 8 г, паприка, лавровый лист","recipe":"1. Осьминога варить 60 минут с лавровым листом.\n2. Картофель отварить 20 минут.\n3. Осьминога нарезать, обжарить с паприкой 3 минуты, подать с картофелем.","bju":"Б:28,Ж:11,У:26"},
    {"name":"Тушёный кролик с овощами и картофелем","calories":320,"cost":3,"gotofnost":3,"sutnost":2,"ingredients":"мясо кролика 120 г, картофель 100 г, морковь 40 г, лук 20 г, вода 100 мл, соль","recipe":"1. Кролика обжарить 5 минут.\n2. Добавить овощи и воду.\n3. Тушить под крышкой 80 минут.","bju":"Б:28,Ж:12,У:24"},
    

    {"name":"Паста с лососем в сливочном соусе","calories":355,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"паста 50 г (сухая), филе лосося 60 г, сливки 10% 50 мл, укроп, соль","recipe":"1. Пасту отварить 9 минут.\n2. Лосось нарезать кубиками, обжарить 4 минуты.\n3. Влить сливки, прогреть 3 минуты.\n4. Смешать с пастой.","bju":"Б:20,Ж:16,У:32"},
    {"name":"Ризотто с креветками","calories":335,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"рис арборио 50 г, креветки 80 г, пармезан 10 г, сливочное масло 5 г, овощной бульон 250 мл","recipe":"1. Рис варить с бульоном 18 минут, помешивая.\n2. Креветки обжарить 3 минуты.\n3. Добавить масло и пармезан, смешать с креветками.","bju":"Б:19,Ж:11,У:40"},
    {"name":"Салат с лососем, картофелем и яйцом","calories":335,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"слабосолёный лосось 60 г, отварной картофель 120 г, яйцо 1 шт., оливковое масло 5 г, зелень","recipe":"1. Картофель и яйцо отварить, нарезать.\n2. Смешать с лососем и зеленью.\n3. Заправить маслом.","bju":"Б:22,Ж:20,У:17"},
    {"name":"Спагетти с мидиями в томатном соусе","calories":315,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"спагетти 60 г (сухие), мидии 120 г, помидор 80 г, чеснок, петрушка","recipe":"1. Спагетти отварить.\n2. Томат тушить с чесноком 7 минут, добавить мидии на 5 минут.\n3. Смешать с пастой.","bju":"Б:19,Ж:4,У:50"},
    {"name":"Кальмар, фаршированный рисом и овощами","calories":320,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"кальмар 150 г, рис 40 г (сухой), морковь 30 г, лук 15 г, масло 5 г","recipe":"1. Рис отварить до полуготовности, смешать с обжаренными овощами.\n2. Тушки кальмара нафаршировать.\n3. Тушить в воде 20 минут.","bju":"Б:26,Ж:8,У:34"},
    {"name":"Салат с гребешком, авокадо и киноа","calories":315,"cost":3,"gotofnost":2,"sutnost":1,"ingredients":"морской гребешок 100 г, авокадо 60 г, киноа готовая 70 г, оливковое масло 5 г, лимон","recipe":"1. Гребешки обжарить по 1,5 минуты с каждой стороны.\n2. Авокадо нарезать, смешать с киноа.\n3. Сверху гребешки, заправить маслом и лимоном.","bju":"Б:17,Ж:19,У:18"},
    

    {"name":"Стейк лосося с киноа и брокколи","calories":345,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"филе лосося 120 г, киноа готовая 60 г, брокколи 80 г, лимон","recipe":"1. Лосось запекать при 200 °C 15 минут.\n2. Брокколи отварить 5 минут.\n3. Подавать с киноа.","bju":"Б:30,Ж:17,У:15"},
    {"name":"Креветки с рисом и соусом терияки","calories":335,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"тигровые креветки 120 г, готовый рис 120 г, соус терияки 20 мл, масло 5 г","recipe":"1. Креветки обжарить 4 минуты.\n2. Влить соус терияки, уварить 2 минуты.\n3. Подавать с рисом.","bju":"Б:28,Ж:6,У:42"},
    {"name":"Говяжья вырезка с картофельным пюре","calories":320,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"говяжья вырезка 120 г, картофельное пюре 150 г, соль, перец","recipe":"1. Мясо жарить по 3 минуты с каждой стороны.\n2. Дать отдохнуть 3 минуты.\n3. Подавать с пюре.","bju":"Б:28,Ж:14,У:21"},
    {"name":"Телячья отбивная с рисом и овощами","calories":335,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"телятина 120 г, готовый рис 100 г, овощи 80 г, подсолнечное масло 8 г","recipe":"1. Телятину отбить, обжарить по 4 минуты с каждой стороны.\n2. Овощи обжарить 6 минут.\n3. Подавать с рисом.","bju":"Б:26,Ж:11,У:32"},
    {"name":"Гребешки с пастой в сливочном соусе","calories":345,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"морской гребешок 120 г, паста 50 г (сухая), сливки 10% 60 мл, чеснок","recipe":"1. Пасту отварить 9 минут.\n2. Гребешки обжарить по 1,5 минуты с каждой стороны.\n3. Сливки прогреть с чесноком 3 минуты, смешать с пастой.\n4. Сверху гребешки.","bju":"Б:25,Ж:8,У:42"},
    {"name":"Тунец с кунжутом и лапшой удон","calories":335,"cost":3,"gotofnost":2,"sutnost":2,"ingredients":"свежий тунец 100 г, лапша удон 150 г (готовая), кунжут 3 г, соевый соус 5 мл, масло 5 г","recipe":"1. Лапшу прогреть в кипятке 2 минуты.\n2. Тунца обвалять в кунжуте, обжарить по 1,5 минуты с каждой стороны.\n3. Нарезать, подать с лапшой и соевым соусом.","bju":"Б:28,Ж:8,У:38"},


    {"name":"Омлет с помидорами и тостом","calories":430,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"яйцо 3 шт. (150 г), помидор 100 г, молоко 50 мл, хлеб 40 г, масло растительное 10 г, соль","recipe":"1. Яйца взбить с молоком и солью.\n2. Помидор нарезать кубиками.\n3. Разогреть сковороду с маслом, обжарить помидор 2 минуты.\n4. Залить яичной смесью, накрыть крышкой, готовить на слабом огне 5 минут.\n5. Подать с подсушенным тостом.","bju":"Б:22,Ж:25,У:30"},
    {"name":"Гречка с яйцом и огурцом","calories":420,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"гречка варёная 200 г, яйцо 2 шт., огурец 100 г, масло растительное 8 г, зелень, соль","recipe":"1. Яйца сварить вкрутую (8 минут), остудить.\n2. Гречку разогреть с каплей воды в сковороде или микроволновке.\n3. Огурец нарезать полукольцами, яйца порубить.\n4. Смешать всё, заправить маслом, посолить, добавить зелень.","bju":"Б:20,Ж:15,У:52"},
    {"name":"Творог со сметаной и бананом","calories":410,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"творог 5% 200 г, сметана 15% 40 г, банан 100 г, мёд 10 г","recipe":"1. Творог выложить в миску.\n2. Банан нарезать кружками.\n3. Добавить сметану и перемешать.\n4. Сверху выложить банан, полить мёдом.","bju":"Б:30,Ж:17,У:35"},
    {"name":"Макароны с томатной пастой и сыром","calories":450,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"макароны 80 г (сухие), томатная паста 30 г, сыр твёрдый 20 г, лук 30 г, масло 8 г, соль, специи","recipe":"1. Макароны отварить в подсоленной воде 8–9 минут.\n2. Лук мелко нарезать и обжарить 3 минуты на масле.\n3. Добавить томатную пасту и 50 мл воды, тушить 3 минуты.\n4. Смешать с макаронами и посыпать тёртым сыром.","bju":"Б:16,Ж:12,У:70"},
    {"name":"Бутерброды с яйцом и творожным сыром","calories":440,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"хлеб цельнозерновой 80 г, яйцо 2 шт., творожный сыр 40 г, огурец 60 г, зелень","recipe":"1. Яйца сварить вкрутую 8 минут и очистить.\n2. Хлеб слегка подсушить в тостере.\n3. Намазать творожным сыром.\n4. Сверху выложить ломтики яйца, огурец и зелень.","bju":"Б:20,Ж:22,У:40"},
    {"name":"Рис с тунцом и кукурузой","calories":430,"cost":1,"gotofnost":1,"sutnost":1,"ingredients":"рис варёный 200 г, тунец консервированный в собственном соку 100 г, кукуруза консервированная 50 г, лимонный сок 10 мл, масло 5 г","recipe":"1. Рис разогреть или использовать только что сваренный.\n2. Тунец размять вилкой, слив жидкость.\n3. Смешать с рисом и кукурузой.\n4. Заправить лимонным соком и маслом, посолить.","bju":"Б:28,Ж:11,У:55"},


    {"name":"Яичница с сосисками и хлебом","calories":490,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"яйцо 2 шт., сосиски 2 шт. (100 г), хлеб 50 г, масло 8 г, помидор 50 г","recipe":"1. Сосиски нарезать кружками и обжарить 3 минуты на масле.\n2. Влить яйца, посолить.\n3. Жарить под крышкой 4 минуты.\n4. Подать с хлебом и дольками помидора.","bju":"Б:24,Ж:31,У:28"},
    {"name":"Макароны по-флотски быстрые","calories":495,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"макароны 80 г, фарш смешанный 80 г, лук 40 г, масло 8 г, соль, перец","recipe":"1. Макароны отварить 8 минут.\n2. Лук нарезать, обжарить 2 минуты.\n3. Добавить фарш, разбивая лопаткой, жарить 7 минут до готовности.\n4. Смешать с макаронами, посолить, поперчить.","bju":"Б:25,Ж:19,У:55"},
    {"name":"Овсяная каша с арахисовой пастой и бананом","calories":480,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"овсяные хлопья 60 г, молоко 200 мл, банан 100 г, арахисовая паста 15 г","recipe":"1. Хлопья залить молоком, довести до кипения.\n2. Варить 5 минут, помешивая.\n3. Добавить арахисовую пасту и перемешать.\n4. Сверху выложить кружки банана.","bju":"Б:15,Ж:19,У:62"},
    {"name":"Лаваш с сыром и ветчиной","calories":470,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"лаваш тонкий 60 г, сыр 40 г, ветчина 50 г, помидор 40 г, масло 3 г","recipe":"1. На лаваш выложить ветчину, сыр и помидор.\n2. Сложить конвертом.\n3. Обжарить на сухой сковороде по 2 минуты с каждой стороны, до расплавления сыра.\n4. Разрезать пополам и подать горячим.","bju":"Б:26,Ж:24,У:38"},
    {"name":"Рис с яйцом и соевым соусом","calories":460,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"рис варёный 250 г, яйцо 2 шт., соевый соус 15 мл, лук зелёный 20 г, масло 8 г","recipe":"1. Разогреть масло на сковороде.\n2. Вбить яйца и быстро перемешать до крупных хлопьев.\n3. Добавить рис и прогреть 3 минуты.\n4. Влить соевый соус и посыпать зелёным луком.","bju":"Б:18,Ж:13,У:68"},
    {"name":"Быстрые сырники","calories":480,"cost":1,"gotofnost":1,"sutnost":2,"ingredients":"творог 200 г, яйцо 1 шт., мука 40 г, сахар 10 г, масло 10 г, сметана 30 г","recipe":"1. Творог смешать с яйцом, сахаром и мукой.\n2. Сформировать 5 небольших лепёшек.\n3. Обжарить на масле по 3 минуты с каждой стороны.\n4. Подать со сметаной.","bju":"Б:28,Ж:21,У:45"},


    {"name":"Тушёная капуста с курицей","calories":420,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"капуста белокочанная 300 г, куриное бедро без кожи 150 г, морковь 60 г, лук 50 г, томатная паста 15 г, масло 10 г","recipe":"1. Курицу нарезать кусочками и обжарить 5 минут.\n2. Добавить нарезанные лук и морковь, обжарить 5 минут.\n3. Добавить шинкованную капусту, томатную пасту, 100 мл воды.\n4. Тушить под крышкой на слабом огне 50 минут.\n5. Посолить и поперчить.","bju":"Б:35,Ж:20,У:25"},
    {"name":"Чечевичный суп с морковью","calories":410,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"чечевица 100 г, морковь 80 г, лук 60 г, картофель 100 г, масло 10 г, вода 500 мл, специи","recipe":"1. Чечевицу промыть и залить водой.\n2. Варить 30 минут.\n3. Добавить кубики картофеля и обжаренные лук с морковью.\n4. Варить ещё 25 минут до мягкости.\n5. Посолить, добавить специи.","bju":"Б:24,Ж:8,У:60"},
    {"name":"Куриная голень с кабачком в духовке","calories":430,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"куриные голени без кожи 250 г, кабачок 200 г, чеснок 5 г, масло 10 г, паприка, соль","recipe":"1. Голени натереть солью, паприкой, чесноком и маслом.\n2. Кабачок нарезать полукружками.\n3. Всё выложить на противень.\n4. Запекать при 190 °C 55 минут.","bju":"Б:38,Ж:26,У:12"},
    {"name":"Фасолевый суп с овощами","calories":420,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"фасоль красная сухая 90 г, морковь 60 г, лук 60 г, картофель 100 г, томатная паста 15 г, масло 8 г","recipe":"1. Фасоль замочить на 8 часов, воду слить.\n2. Варить 60 минут до мягкости.\n3. Добавить картофель, затем обжарку из лука, моркови и томатной пасты.\n4. Варить 20 минут, посолить.","bju":"Б:22,Ж:9,У:62"},
    {"name":"Минтай, запечённый с картофелем","calories":410,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"филе минтая 200 г, картофель 200 г, лук 50 г, сметана 20 г, масло 8 г, лимон","recipe":"1. Картофель нарезать дольками и выложить в форму.\n2. Сверху положить кольца лука и филе минтая.\n3. Посолить, сбрызнуть лимоном, смазать сметаной.\n4. Запекать при 190 °C 50 минут, накрыв фольгой.","bju":"Б:36,Ж:13,У:38"},
    {"name":"Овощное рагу с куриной грудкой","calories":400,"cost":1,"gotofnost":3,"sutnost":1,"ingredients":"куриная грудка 150 г, картофель 120 г, кабачок 100 г, морковь 60 г, лук 50 г, масло 10 г, томатная паста 15 г","recipe":"1. Грудку нарезать кубиками и обжарить 5 минут.\n2. Добавить лук и морковь, обжарить 5 минут.\n3. Добавить картофель, кабачок, томатную пасту и 150 мл воды.\n4. Тушить под крышкой 45 минут.","bju":"Б:36,Ж:14,У:32"},


    {"name":"Борщ с говядиной и сметаной","calories":450,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"говядина 100 г, свёкла 100 г, капуста 100 г, картофель 100 г, морковь 50 г, лук 40 г, томатная паста 15 г, сметана 30 г","recipe":"1. Говядину варить 90 минут, снимая пену.\n2. Добавить картофель и варить 15 минут.\n3. Свёклу, морковь и лук обжарить с томатной пастой.\n4. Добавить капусту и обжарку в бульон, варить 15 минут.\n5. Подать со сметаной.","bju":"Б:25,Ж:23,У:35"},
    {"name":"Плов с курицей","calories":490,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"рис 90 г (сухой), куриные бёдра 150 г, морковь 100 г, лук 70 г, масло 15 г, чеснок 5 г, зира","recipe":"1. В казане обжарить кусочки курицы 8 минут.\n2. Добавить лук и морковь соломкой, жарить 10 минут.\n3. Влить воды на 1 см выше уровня, варить зирвак 30 минут.\n4. Выложить промытый рис, чеснок, залить водой на 1 см выше риса.\n5. Томить под крышкой 30 минут на слабом огне.","bju":"Б:24,Ж:16,У:62"},
    {"name":"Ленивые голубцы","calories":470,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"фарш говяжий 100 г, капуста 150 г, рис варёный 60 г, лук 40 г, морковь 40 г, томатная паста 20 г, сметана 20 г","recipe":"1. Капусту мелко нашинковать, лук и морковь обжарить.\n2. Смешать фарш, рис, капусту, соль и перец.\n3. Сформовать котлеты и выложить в сотейник.\n4. Залить водой с томатной пастой и сметаной.\n5. Тушить под крышкой 60 минут.","bju":"Б:26,Ж:21,У:45"},
    {"name":"Гороховый суп с копчёными рёбрышками","calories":480,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"горох колотый 90 г, копчёные рёбрышки 80 г, картофель 120 г, морковь 50 г, лук 50 г, масло 8 г","recipe":"1. Горох промыть и замочить на 2 часа.\n2. Рёбрышки варить 30 минут, добавить горох и варить 40 минут.\n3. Добавить картофель и обжарку из лука с морковью.\n4. Варить ещё 20 минут до мягкости гороха.","bju":"Б:28,Ж:22,У:42"},
    {"name":"Тушёная картошка с мясом","calories":480,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"свинина 120 г, картофель 250 г, лук 60 г, морковь 50 г, масло 8 г, лавровый лист","recipe":"1. Свинину нарезать кубиками и обжарить 10 минут.\n2. Добавить лук и морковь, обжарить 5 минут.\n3. Добавить картофель, лавровый лист и воду до половины.\n4. Тушить под крышкой 45 минут.","bju":"Б:24,Ж:21,У:48"},
    {"name":"Перловка с тушёнкой","calories":500,"cost":1,"gotofnost":3,"sutnost":2,"ingredients":"перловка 80 г (сухая), тушёнка говяжья 100 г, лук 50 г, морковь 50 г, масло 5 г","recipe":"1. Перловку замочить на 6 часов.\n2. Варить 50 минут до мягкости, слить воду.\n3. Лук и морковь обжарить 8 минут.\n4. Добавить тушёнку и перловку, прогреть 10 минут под крышкой.","bju":"Б:26,Ж:17,У:60"},


    {"name":"Куриные котлеты с гречкой","calories":430,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"фарш куриный 150 г, лук 30 г, яйцо 0,5 шт., гречка 70 г (сухая), масло 8 г","recipe":"1. Гречку сварить 15–20 минут.\n2. Фарш смешать с луком, яйцом, солью.\n3. Сформовать 2 котлеты.\n4. Обжарить по 5 минут с каждой стороны и довести под крышкой 5 минут.","bju":"Б:34,Ж:17,У:36"},
    {"name":"Рыбные котлеты с рисом","calories":420,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"филе минтая 180 г, лук 30 г, хлеб 20 г, молоко 30 мл, рис 60 г (сухой), масло 8 г","recipe":"1. Рис сварить 15 минут.\n2. Рыбу и лук прокрутить, добавить размоченный хлеб, соль.\n3. Сформовать котлеты.\n4. Обжарить по 4 минуты с каждой стороны, довести 5 минут под крышкой.","bju":"Б:30,Ж:15,У:42"},
    {"name":"Куриный суп с лапшой","calories":410,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"куриная грудка 150 г, лапша 50 г, картофель 100 г, морковь 50 г, лук 40 г, масло 5 г, вода 500 мл","recipe":"1. Курицу варить 25 минут, вынуть и нарезать.\n2. В бульон добавить картофель, варить 10 минут.\n3. Добавить обжаренные лук и морковь и лапшу, варить 7 минут.\n4. Вернуть курицу, посолить.","bju":"Б:28,Ж:14,У:42"},
    {"name":"Овощная запеканка с яйцом и сыром","calories":400,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"кабачок 200 г, помидор 100 г, яйцо 2 шт., сыр 30 г, молоко 50 мл, масло 5 г","recipe":"1. Кабачок и помидор нарезать кружками, выложить в форму.\n2. Яйца взбить с молоком и солью, залить овощи.\n3. Посыпать тёртым сыром.\n4. Запекать при 180 °C 30 минут.","bju":"Б:22,Ж:22,У:28"},
    {"name":"Фаршированный перец с рисом","calories":430,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"болгарский перец 2 шт. (250 г), фарш 100 г, рис 40 г (сухой), лук 30 г, томатная паста 20 г, сметана 20 г","recipe":"1. Рис отварить до полуготовности (8 минут).\n2. Смешать с фаршем и обжаренным луком.\n3. Перцы очистить и нафаршировать.\n4. Залить водой с томатной пастой и сметаной.\n5. Тушить под крышкой 40 минут.","bju":"Б:22,Ж:18,У:44"},
    {"name":"Тефтели с пшёнкой","calories":440,"cost":1,"gotofnost":2,"sutnost":1,"ingredients":"фарш индейки 130 г, рис 20 г, лук 30 г, пшёнка 70 г (сухая), томатная паста 20 г, масло 5 г","recipe":"1. Пшёнку промыть и варить 20 минут.\n2. Фарш смешать с отварным рисом, луком, солью, скатать шарики.\n3. Обжарить 5 минут.\n4. Залить водой с томатной пастой и тушить 20 минут.","bju":"Б:26,Ж:16,У:48"},


    {"name":"Картофельная запеканка с фаршем","calories":490,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"картофель 250 г, фарш 100 г, лук 50 г, молоко 40 мл, сыр 20 г, масло 8 г","recipe":"1. Картофель отварить 20 минут и сделать пюре с молоком.\n2. Фарш обжарить с луком 10 минут.\n3. В форму выложить половину пюре, фарш и остальное пюре.\n4. Посыпать сыром и запекать при 190 °C 20 минут.","bju":"Б:24,Ж:24,У:44"},
    {"name":"Макароны с мясной подливой","calories":500,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"макароны 85 г (сухие), говядина 100 г, лук 40 г, морковь 40 г, томатная паста 20 г, масло 8 г","recipe":"1. Мясо нарезать мелкими кубиками и обжарить 8 минут.\n2. Добавить лук, морковь, томатную пасту и 150 мл воды.\n3. Тушить 25 минут.\n4. Макароны отварить и подать с подливой.","bju":"Б:26,Ж:16,У:62"},
    {"name":"Жареная картошка с грибами и яйцом","calories":480,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"картофель 250 г, шампиньоны 100 г, яйцо 1 шт., лук 40 г, масло 12 г","recipe":"1. Картофель нарезать брусочками, жарить 15 минут.\n2. Отдельно обжарить грибы с луком 10 минут.\n3. Соединить, влить яйцо и жарить 3 минуты под крышкой.","bju":"Б:16,Ж:24,У:50"},
    {"name":"Творожная запеканка с изюмом","calories":450,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"творог 250 г, яйцо 1 шт., манка 25 г, изюм 20 г, сахар 15 г, сметана 30 г","recipe":"1. Творог смешать с яйцом, манкой, сахаром и изюмом.\n2. Оставить на 10 минут для набухания манки.\n3. Выложить в смазанную форму.\n4. Запекать при 180 °C 35 минут, подать со сметаной.","bju":"Б:28,Ж:16,У:48"},
    {"name":"Блины с мясом","calories":480,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"молоко 120 мл, яйцо 1 шт., мука 60 г, фарш 100 г, лук 40 г, масло 10 г","recipe":"1. Замесить жидкое тесто из молока, яйца, муки и щепотки соли.\n2. Испечь 4 тонких блина.\n3. Фарш обжарить с луком 10 минут.\n4. Завернуть начинку в блины и слегка обжарить.","bju":"Б:22,Ж:23,У:46"},
    {"name":"Ленивые вареники со сметаной","calories":460,"cost":1,"gotofnost":2,"sutnost":2,"ingredients":"творог 200 г, яйцо 1 шт., мука 50 г, сахар 10 г, сметана 30 г","recipe":"1. Творог смешать с яйцом, мукой, сахаром.\n2. Сформировать колбаску и нарезать кусочками.\n3. Варить в подсоленной воде 5 минут после всплытия.\n4. Подать со сметаной.","bju":"Б:24,Ж:17,У:52"},


    {"name":"Лосось на сковороде с овощами","calories":450,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"филе лосося 130 г, цукини 100 г, перец 80 г, масло оливковое 10 г, лимон, соль","recipe":"1. Лосось посолить, сбрызнуть лимоном.\n2. Обжарить на масле по 4 минуты с каждой стороны.\n3. Овощи нарезать и обжарить 6 минут на отдельной сковороде.\n4. Подать вместе.","bju":"Б:34,Ж:30,У:10"},
    {"name":"Салат с курицей и авокадо","calories":430,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"куриная грудка 120 г, авокадо 80 г, листья салата 60 г, помидор 80 г, масло оливковое 10 г, лимонный сок","recipe":"1. Грудку обжарить 6 минут с каждой стороны, остудить 5 минут и нарезать.\n2. Авокадо и помидор нарезать.\n3. Смешать с салатом.\n4. Заправить маслом и лимонным соком.","bju":"Б:32,Ж:27,У:14"},
    {"name":"Креветки с рисом","calories":420,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"креветки очищенные 150 г, рис варёный 200 г, чеснок 5 г, масло 8 г, соевый соус 10 мл, лук зелёный","recipe":"1. На масле обжарить чеснок 30 секунд.\n2. Добавить креветки и жарить 3 минуты.\n3. Добавить рис и соевый соус, прогреть 3 минуты.\n4. Посыпать зелёным луком.","bju":"Б:30,Ж:11,У:50"},
    {"name":"Паста с тунцом и черри","calories":450,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"паста 75 г (сухая), тунец в собственном соку 100 г, помидоры черри 120 г, чеснок 5 г, масло оливковое 10 г","recipe":"1. Пасту отварить 9 минут.\n2. На масле обжарить чеснок и половинки черри 4 минуты.\n3. Добавить тунец и 2 ложки воды от пасты.\n4. Смешать с пастой.","bju":"Б:28,Ж:12,У:58"},
    {"name":"Куриная грудка с киноа и шпинатом","calories":430,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"куриная грудка 130 г, киноа 60 г (сухая), шпинат 80 г, масло оливковое 8 г, чеснок 5 г","recipe":"1. Киноа варить 12 минут.\n2. Грудку нарезать полосками, обжарить 7 минут.\n3. Добавить чеснок и шпинат, готовить 2 минуты.\n4. Смешать с киноа.","bju":"Б:38,Ж:13,У:40"},
    {"name":"Омлет с фетой и авокадо","calories":440,"cost":2,"gotofnost":1,"sutnost":1,"ingredients":"яйцо 3 шт., сыр фета 40 г, авокадо 70 г, масло 5 г, зелень","recipe":"1. Яйца взбить, добавить раскрошенную фету.\n2. Вылить на разогретую сковороду с маслом.\n3. Готовить под крышкой 5 минут.\n4. Подать с ломтиками авокадо и зеленью.","bju":"Б:24,Ж:34,У:10"},


    {"name":"Свиной стейк с картофельным пюре","calories":500,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"свиная шея 120 г, картофель 200 г, молоко 40 мл, масло 8 г, специи","recipe":"1. Картофель нарезать мелко, варить 12 минут.\n2. Мясо отбить, посолить, поперчить.\n3. Обжарить по 4 минуты с каждой стороны.\n4. Картофель размять с молоком и маслом, подать со стейком.","bju":"Б:34,Ж:26,У:32"},
    {"name":"Домашний куриный бургер","calories":490,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"булочка 70 г, куриное филе 100 г, сыр 20 г, салат 20 г, помидор 40 г, соус 15 г","recipe":"1. Филе слегка отбить и обжарить по 4 минуты с каждой стороны.\n2. Булочку подсушить.\n3. Собрать: соус, салат, курица, сыр, помидор.\n4. Накрыть второй половиной булочки.","bju":"Б:30,Ж:22,У:42"},
    {"name":"Паста карбонара","calories":500,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"спагетти 80 г (сухие), бекон 40 г, яйцо 1 шт., желток 1 шт., пармезан 20 г","recipe":"1. Спагетти отварить 9 минут.\n2. Бекон обжарить 4 минуты.\n3. Яйцо, желток и сыр смешать.\n4. Горячую пасту смешать с беконом, снять с огня, влить яичную смесь и быстро перемешать.","bju":"Б:22,Ж:23,У:52"},
    {"name":"Шаурма куриная в лаваше","calories":480,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"лаваш 70 г, куриное филе 100 г, огурец 40 г, капуста 40 г, помидор 40 г, соус 20 г","recipe":"1. Курицу нарезать полосками и обжарить 8 минут.\n2. Овощи нашинковать.\n3. Лаваш смазать соусом, выложить начинку.\n4. Завернуть и обжарить на сухой сковороде по 1 минуте с каждой стороны.","bju":"Б:30,Ж:20,У:44"},
    {"name":"Рис с говядиной по-китайски","calories":480,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"говядина 100 г, рис варёный 200 г, перец 60 г, морковь 40 г, соевый соус 15 мл, масло 8 г","recipe":"1. Говядину нарезать тонкими полосками.\n2. Обжарить на сильном огне 4 минуты.\n3. Добавить овощи соломкой, жарить 4 минуты.\n4. Добавить рис и соус, прогреть 3 минуты.","bju":"Б:30,Ж:18,У:50"},
    {"name":"Круассан с лососем и сыром","calories":470,"cost":2,"gotofnost":1,"sutnost":2,"ingredients":"круассан 60 г, слабосолёный лосось 50 г, сливочный сыр 30 г, огурец 40 г, зелень","recipe":"1. Круассан разрезать вдоль.\n2. Намазать сливочным сыром.\n3. Выложить лосось, огурец и зелень.\n4. Сложить и слегка прогреть 2 минуты в духовке.","bju":"Б:22,Ж:27,У:34"},


    {"name":"Запечённая треска с овощами и картофелем","calories":420,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"филе трески 180 г, картофель 150 г, цукини 100 г, помидор 80 г, масло оливковое 10 г, лимон","recipe":"1. Картофель нарезать дольками и запекать 20 минут при 200 °C.\n2. Добавить цукини и помидоры.\n3. Сверху выложить посоленную и сбрызнутую лимоном треску.\n4. Запекать ещё 25 минут.","bju":"Б:38,Ж:14,У:36"},
    {"name":"Куриные грудки, фаршированные шпинатом, с гречкой","calories":440,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"куриная грудка 180 г, шпинат 60 г, сыр моцарелла 30 г, гречка 60 г (сухая), чеснок 5 г","recipe":"1. В грудке сделать глубокий карман.\n2. Начинить шпинатом, чесноком и сыром.\n3. Закрепить зубочистками, посолить.\n4. Запекать при 190 °C 40 минут.\n5. Подать с отварной гречкой.","bju":"Б:42,Ж:15,У:34"},
    {"name":"Тушёная индейка с овощами","calories":410,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"филе индейки 180 г, кабачок 120 г, морковь 60 г, лук 50 г, томаты 100 г, масло 8 г","recipe":"1. Индейку нарезать кубиками, обжарить 6 минут.\n2. Добавить лук и морковь, жарить 5 минут.\n3. Добавить кабачок, томаты и 100 мл воды.\n4. Тушить под крышкой 50 минут.","bju":"Б:40,Ж:17,У:24"},
    {"name":"Минестроне с индейкой","calories":400,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"индейка 100 г, фасоль консервированная 80 г, макароны мелкие 30 г, цукини 80 г, морковь 50 г, сельдерей 40 г, томаты в с.с. 100 г","recipe":"1. Индейку нарезать, обжарить 5 минут.\n2. Добавить овощи кубиками и обжарить 7 минут.\n3. Влить 500 мл воды и томаты, варить 40 минут.\n4. Добавить фасоль и макароны, варить ещё 10 минут.","bju":"Б:28,Ж:13,У:42"},
    {"name":"Запечённая скумбрия с овощами и рисом","calories":450,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"скумбрия 180 г, лук 50 г, помидор 80 г, рис 50 г (сухой), лимон, специи","recipe":"1. Скумбрию почистить, посолить, сбрызнуть лимоном.\n2. Выложить на фольгу с кольцами лука и помидорами.\n3. Запекать при 190 °C 40 минут.\n4. Рис отварить 15 минут и подать.","bju":"Б:32,Ж:19,У:38"},
    {"name":"Постное говяжье рагу с овощами","calories":430,"cost":2,"gotofnost":3,"sutnost":1,"ingredients":"говядина 150 г, картофель 100 г, морковь 60 г, лук 50 г, томатная паста 15 г, масло 8 г","recipe":"1. Говядину нарезать кубиками и обжарить 10 минут.\n2. Добавить лук, морковь, томатную пасту и воду.\n3. Тушить 80 минут.\n4. Добавить картофель и тушить ещё 25 минут.","bju":"Б:36,Ж:18,У:30"},
